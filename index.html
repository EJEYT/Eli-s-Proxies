<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eli's Proxies</title>

  <style>
    :root { 
      --bg-dark: #1e1e2e; --bg-sidebar: #181825; --bg-card: #313244;
      --text-main: #cdd6f4; --text-muted: #a6adc8; --accent: #89b4fa;
      --red: #f38ba8; --green: #a6e3a1; --border: #45475a; --overlay: rgba(0,0,0,0.7);
      --glass-blur: 0px; --bg-animate: none;
    }
    [data-theme="dark"] { --bg-dark: #121212; --bg-sidebar: #1e1e1e; --bg-card: #242424; --text-main: #e0e0e0; --text-muted: #909090; --accent: #bb86fc; --border: #333333; }
    [data-theme="oled"] { --bg-dark: #000000; --bg-sidebar: #000000; --bg-card: #111111; --text-main: #ffffff; --text-muted: #888888; --accent: #ffffff; --border: #222222; }
    [data-theme="light"] { --bg-dark: #eff1f5; --bg-sidebar: #e6e9ef; --bg-card: #ffffff; --text-main: #4c4f69; --text-muted: #6c6f85; --accent: #1e66f5; --border: #ccd0da; }
    [data-theme="liquid"] { 
      --bg-dark: linear-gradient(-45deg, #0f172a, #1e293b, #082f49, #0f172a); 
      --bg-animate: gradientMove 15s ease infinite;
      --bg-sidebar: rgba(255, 255, 255, 0.1); 
      --bg-card: rgba(255, 255, 255, 0.05); 
      --text-main: #ffffff; --accent: #ffffff; --border: rgba(255, 255, 255, 0.2);
      --glass-blur: 16px;
    }
    @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    * { box-sizing: border-box; transition: background 0.2s; }
    *::-webkit-scrollbar { display: none; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: var(--bg-dark); background-size: 400% 400%; animation: var(--bg-animate); color: var(--text-main); height: 100vh; overflow: hidden; }

    #toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); padding: 12px 25px; border-radius: 12px; font-weight: bold; z-index: 99999; transition: 0.4s; }
    #toast.show { top: 20px; }

    /* Layout */
    #selectionScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
    .blocker-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; width: 100%; max-width: 900px; margin-top: 20px; }
    .blocker-card { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 15px; cursor: pointer; text-align: center; backdrop-filter: blur(var(--glass-blur)); font-weight: bold; }
    .blocker-card:hover { border-color: var(--accent); transform: scale(1.02); }

    .app-container { display: none; width: 100%; height: 100%; flex-direction: column; }
    .header { padding: 15px 25px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--bg-sidebar); backdrop-filter: blur(var(--glass-blur)); }
    .search-bar { flex: 0.6; padding: 10px 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; color: white; outline: none; }

    #posts { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .post-card { background: var(--bg-card); padding: 20px; border-radius: 15px; width: 100%; max-width: 700px; border: 1px solid var(--border); backdrop-filter: blur(var(--glass-blur)); }
    .post-author { color: var(--accent); font-weight: bold; font-size: 0.9rem; }
    .post-content { margin-top: 10px; white-space: pre-wrap; word-break: break-all; }

    /* Dropdown */
    .settings-dropdown { position: relative; }
    .settings-menu { display: none; position: absolute; right: 0; top: 40px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; width: 200px; padding: 8px; z-index: 1000; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .settings-menu.show { display: block; }
    .menu-item { padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 500; }
    .menu-item:hover { background: rgba(255,255,255,0.1); }
    .themes-sub { display: none; padding-left: 10px; border-left: 1px solid var(--border); margin-top: 5px; }
    .themes-sub.show { display: block; }

    /* Admin Panel */
    .panel { display: none; position: fixed; bottom: 20px; right: 20px; width: 400px; background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 20px; z-index: 10000; box-shadow: 0 15px 40px rgba(0,0,0,0.6); }
    .admin-input { width: 100%; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: white; border-radius: 8px; margin-bottom: 10px; }
    .admin-btn { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    .admin-tabs { display: flex; gap: 5px; margin-bottom: 15px; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 10px; }
    .admin-tab { flex: 1; padding: 6px; text-align: center; cursor: pointer; border-radius: 6px; font-size: 0.7rem; color: var(--text-muted); }
    .admin-tab.active { background: var(--bg-card); color: var(--accent); font-weight: bold; }

    /* Utils */
    .btn-outline { background: none; border: 1px solid var(--border); color: var(--text-main); padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; }
    .copy-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--accent); padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 0.7rem; font-weight: bold; }
    .report-btn { border: 1px solid var(--red); color: var(--red); background: none; padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 0.7rem; margin-left: 5px; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 99999; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    .modal-content { background: var(--bg-card); padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; border: 1px solid var(--border); }
  </style>
</head>
<body>

<div id="toast"></div>

<div id="reportModal" class="modal">
  <div class="modal-content">
    <h3 style="margin-top:0; color:var(--red);">Report Proxy</h3>
    <textarea id="reportText" class="admin-input" rows="4" placeholder="Why is this proxy broken?"></textarea>
    <div style="display:flex; gap:10px;">
        <button id="submitReport" class="admin-btn" style="background:var(--red); color:white;">Send</button>
        <button onclick="document.getElementById('reportModal').style.display='none'" class="admin-btn" style="background:none; border:1px solid var(--border); color:white;">Cancel</button>
    </div>
  </div>
</div>

<div id="selectionScreen">
  <h1 style="margin-bottom:0;">Eli's Proxies</h1>
  <p style="opacity:0.6; margin-bottom:30px;">Select a filter to start</p>
  <div class="blocker-grid" id="grid"></div>
  <div class="blocker-card" style="margin-top:20px; width:100%; max-width:300px; color:var(--accent);" onclick="selectBlocker('All')">View All</div>
</div>

<div id="app" class="app-container">
  <div class="header">
    <button onclick="location.reload()" class="btn-outline">← Home</button>
    <input type="text" id="search" class="search-bar" placeholder="Search proxies...">
    <div class="settings-dropdown">
      <div onclick="toggleSettings()" style="cursor:pointer; font-size:1.5rem;">⚙</div>
      <div id="menu" class="settings-menu">
        <div class="menu-item" onclick="toggleThemes()">🎨 Themes</div>
        <div id="themeList" class="themes-sub">
            <div class="menu-item" onclick="setTheme('liquid')">Liquid Glass</div>
            <div class="menu-item" onclick="setTheme('dark')">Dark</div>
            <div class="menu-item" onclick="setTheme('oled')">OLED</div>
            <div class="menu-item" onclick="setTheme('light')">Light</div>
        </div>
        <div class="menu-item" onclick="document.getElementById('admin').style.display='block'">🔑 Admin Panel</div>
      </div>
    </div>
  </div>
  <div id="posts"></div>
</div>

<div id="admin" class="panel">
  <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
    <h3 style="margin:0;">Admin</h3>
    <span onclick="document.getElementById('admin').style.display='none'" style="cursor:pointer;">&times;</span>
  </div>
  <div id="adminAuth">
    <input type="password" id="pass" class="admin-input" placeholder="Password">
    <button onclick="doAuth()" class="admin-btn">Login</button>
  </div>
  <div id="adminUI" style="display:none;">
    <div class="admin-tabs">
        <div class="admin-tab active" onclick="switchTab('p')">Proxy</div>
        <div class="admin-tab" onclick="switchTab('r')">Reports</div>
    </div>
    <div id="tabP">
        <input type="text" id="pAuthor" class="admin-input" placeholder="Author">
        <textarea id="pText" class="admin-input" rows="3" placeholder="Link..."></textarea>
        <div id="pillContainer" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; margin-bottom:10px;"></div>
        <button onclick="publish()" class="admin-btn">Add Proxy</button>
    </div>
    <div id="tabR" style="display:none; max-height:250px; overflow-y:auto;">
        <div id="reportList"></div>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
const supabase = createClient('https://saauhuiruadqjogzughm.supabase.co', 'sb_publishable_u2yOKUXvz3qjRMOZt55-3Q_FGBN6b-F');

const blockers = ["Linewize", "Securly", "Palo_alto", "Blocksi", "Aristotle", "Lightspeed", "Contentkeeper", "Lanschool", "Goguardian", "Fortiguard", "Cisco_talos", "Deledao"];
let activeBlocker = null;
let isAdmin = false;

// EXPOSE TO WINDOW SO ONCLICK WORKS
window.toggleSettings = () => document.getElementById('menu').classList.toggle('show');
window.toggleThemes = () => document.getElementById('themeList').classList.toggle('show');
window.setTheme = (t) => { document.documentElement.setAttribute('data-theme', t); localStorage.setItem('eli_theme', t); };

window.selectBlocker = (name) => {
    activeBlocker = name;
    document.getElementById('selectionScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    loadPosts();
};

window.copyLinks = (text) => {
    const urls = text.match(/(https?:\/\/[^\s]+)/gi);
    if(urls) {
        navigator.clipboard.writeText(urls.join('\n'));
        showToast("Links Copied!");
    }
};

window.openReport = (id, auth, cont) => {
    document.getElementById('reportModal').style.display = 'flex';
    document.getElementById('submitReport').onclick = async () => {
        const msg = document.getElementById('reportText').value;
        if(!msg) return;
        const { error } = await supabase.from('reports').insert([{ 
            post_id: id, message: msg, post_author: auth, post_content: cont 
        }]);
        if(error) { showToast("Failed to send", "#f38ba8"); console.log(error); }
        else { showToast("Report Sent!"); document.getElementById('reportModal').style.display='none'; }
    };
};

window.switchTab = (tab) => {
    document.getElementById('tabP').style.display = tab === 'p' ? 'block' : 'none';
    document.getElementById('tabR').style.display = tab === 'r' ? 'block' : 'none';
    if(tab === 'r') loadReports();
};

window.doAuth = () => {
    if(document.getElementById('pass').value === 'EISisBetterForever') {
        isAdmin = true;
        document.getElementById('adminAuth').style.display = 'none';
        document.getElementById('adminUI').style.display = 'block';
        loadPosts();
    }
};

window.publish = async () => {
    const a = document.getElementById('pAuthor').value || 'Admin';
    const c = document.getElementById('pText').value;
    const targets = document.querySelectorAll('.pill.selected');
    for(let t of targets) {
        await supabase.from('posts').insert([{ blocker: t.dataset.val, author: a, content: c }]);
    }
    showToast("Added!"); loadPosts();
};

window.delReport = async (id) => {
    await supabase.from('reports').delete().eq('id', id);
    loadReports();
};

async function loadPosts() {
    let q = supabase.from('posts').select('*').order('created_at', {ascending: false});
    if(activeBlocker !== 'All') q = q.eq('blocker', activeBlocker);
    const { data } = await q;
    
    document.getElementById('posts').innerHTML = data.map(p => `
        <div class="post-card">
            <div class="post-author">${p.author}</div>
            <div class="post-content">${p.content}</div>
            <div style="margin-top:15px;">
                <button class="copy-btn" onclick="copyLinks(\`${p.content}\`)">Copy</button>
                <button class="report-btn" onclick="openReport('${p.id}', \`${p.author}\`, \`${p.content}\`)">Report</button>
            </div>
        </div>
    `).join('');
}

async function loadReports() {
    const { data } = await supabase.from('reports').select('*').order('created_at', {ascending: false});
    document.getElementById('reportList').innerHTML = data.map(r => `
        <div style="background:rgba(0,0,0,0.2); padding:10px; border-radius:10px; margin-bottom:8px; font-size:0.7rem;">
            <b style="color:var(--red);">Reason: ${r.message}</b><br>
            Auth: ${r.post_author}<br>
            <button onclick="delReport('${r.id}')" style="margin-top:5px; font-size:0.6rem;">Dismiss</button>
        </div>
    `).join('');
}

function showToast(m, bg = "#a6e3a1") {
    const t = document.getElementById('toast');
    t.textContent = m; t.style.background = bg; t.style.color = "#111";
    t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
}

// Start
setTheme(localStorage.getItem('eli_theme') || 'dark');
blockers.forEach(b => {
    const c = document.createElement('div');
    c.className = 'blocker-card'; c.textContent = b.replace('_', ' ');
    c.onclick = () => selectBlocker(b);
    document.getElementById('grid').appendChild(c);

    const p = document.createElement('div');
    p.className = 'admin-tab pill'; p.textContent = b.split('_')[0];
    p.dataset.val = b; p.onclick = () => p.classList.toggle('selected');
    document.getElementById('pillContainer').appendChild(p);
});

document.getElementById('search').oninput = (e) => {
    const val = e.target.value.toLowerCase();
    document.querySelectorAll('.post-card').forEach(c => c.style.display = c.innerText.toLowerCase().includes(val) ? 'block' : 'none');
};
</script>
</body>
</html>
