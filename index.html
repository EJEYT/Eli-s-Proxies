<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Eli's Proxies</title>
  <meta name="title" content="Eli's Proxies | Start your unblocking journey">
  <meta name="description" content="The ultimate destination for unblocked links and proxy feeds.">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://elis-proxies.com/"> 
  <meta property="og:title" content="Eli's Proxies | Start your unblocking journey">
  <meta property="og:description" content="Get the latest unblocked links for Linewize, Securly, GoGuardian, and more.">
  <meta property="og:image" content="https://elis-proxies.odoo.com/web/image/website/1/logo/Eli%27s%20Proxies?unique=7b51271.png">

  <link rel="icon" type="image/png" href="https://elis-proxies.odoo.com/web/image/website/1/logo/Eli%27s%20Proxies?unique=7b51271.png">

  <style>
    /* Themes */
    :root { 
      --bg-dark: #1e1e2e; --bg-sidebar: #181825; --bg-card: #313244;
      --text-main: #cdd6f4; --text-muted: #a6adc8; --accent: #89b4fa;
      --red: #f38ba8; --green: #a6e3a1; --border: #45475a; --overlay: rgba(0,0,0,0.7);
      --glass-blur: 0px; --bg-animate: none;
    }
    [data-theme="dark"] { --bg-dark: #121212; --bg-sidebar: #1e1e1e; --bg-card: #242424; --text-main: #e0e0e0; --text-muted: #909090; --accent: #bb86fc; --border: #333333; }
    [data-theme="oled"] { --bg-dark: #000000; --bg-sidebar: #000000; --bg-card: #111111; --text-main: #ffffff; --text-muted: #888888; --accent: #ffffff; --border: #222222; }
    [data-theme="light"] { --bg-dark: #eff1f5; --bg-sidebar: #e6e9ef; --bg-card: #ffffff; --text-main: #4c4f69; --text-muted: #6c6f85; --accent: #1e66f5; --border: #ccd0da; }
    [data-theme="emerald"] { --bg-dark: #06120e; --bg-sidebar: #0a1a15; --bg-card: #122a22; --text-main: #ecfdf5; --text-muted: #6ee7b7; --accent: #10b981; --border: #065f46; }
    [data-theme="rose"] { --bg-dark: #1a1012; --bg-sidebar: #24181a; --bg-card: #3d2b2e; --text-main: #fff1f2; --text-muted: #fda4af; --accent: #f43f5e; --border: #9f1239; }
    
    [data-theme="cyberpunk"] { --bg-dark: #000b1e; --bg-sidebar: #00162d; --bg-card: #002244; --text-main: #00ffcc; --text-muted: #fdee00; --accent: #ff007f; --border: #00ffcc; }
    [data-theme="forest"] { --bg-dark: #0b120b; --bg-sidebar: #131d13; --bg-card: #1b2b1b; --text-main: #d4e4d4; --text-muted: #7da17d; --accent: #4caf50; --border: #2e442e; }
    [data-theme="lava"] { --bg-dark: #0d0000; --bg-sidebar: #1a0000; --bg-card: #2d0000; --text-main: #ffd1d1; --text-muted: #ff6b6b; --accent: #ff4500; --border: #4d0000; }
    [data-theme="dracula"] { --bg-dark: #282a36; --bg-sidebar: #1e1f29; --bg-card: #44475a; --text-main: #f8f8f2; --text-muted: #6272a4; --accent: #bd93f9; --border: #bd93f9; }
    [data-theme="sakura"] { --bg-dark: #fff5f7; --bg-sidebar: #ffe0e9; --bg-card: #ffffff; --text-main: #d01d56; --text-muted: #f1a7bb; --accent: #ff8fa3; --border: #ffcad4; }
    [data-theme="synthwave"] { --bg-dark: #241744; --bg-sidebar: #2d1b5a; --bg-card: #37246e; --text-main: #fede5d; --text-muted: #ff7edb; --accent: #2de2e6; --border: #72f1b8; }
    [data-theme="ghost"] { --bg-dark: #f0f2f5; --bg-sidebar: #ffffff; --bg-card: #ffffff; --text-main: #2c3e50; --text-muted: #95a5a6; --accent: #34495e; --border: #dcdde1; }
    [data-theme="gold"] { --bg-dark: #0a0a0a; --bg-sidebar: #141414; --bg-card: #1a1a1a; --text-main: #ffffff; --text-muted: #888888; --accent: #d4af37; --border: #333333; }
    
    [data-theme="ocean"] { --bg-dark: #0f172a; --bg-sidebar: #1e293b; --bg-card: #334155; --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #38bdf8; --border: #475569; }
    [data-theme="midnight"] { --bg-dark: #020617; --bg-sidebar: #0f172a; --bg-card: #1e293b; --text-main: #f1f5f9; --text-muted: #64748b; --accent: #6366f1; --border: #334155; }
    [data-theme="coffee"] { --bg-dark: #1c1917; --bg-sidebar: #292524; --bg-card: #44403c; --text-main: #fafaf9; --text-muted: #a8a29e; --accent: #d97706; --border: #57534e; }
    [data-theme="nebula"] { --bg-dark: #09090b; --bg-sidebar: #18181b; --bg-card: #27272a; --text-main: #fafafa; --text-muted: #a1a1aa; --accent: #d946ef; --border: #3f3f46; }
    [data-theme="amber"] { --bg-dark: #0c0a09; --bg-sidebar: #1c1917; --bg-card: #292524; --text-main: #f5f5f4; --text-muted: #a8a29e; --accent: #f59e0b; --border: #44403c; }
    [data-theme="nord"] { --bg-dark: #2e3440; --bg-sidebar: #3b4252; --bg-card: #434c5e; --text-main: #eceff4; --text-muted: #d8dee9; --accent: #88c0d0; --border: #4c566a; }

    [data-theme="liquid"] { 
      --bg-dark: linear-gradient(-45deg, #0f172a, #1e293b, #082f49, #0f172a); 
      --bg-animate: gradientMove 15s ease infinite;
      --bg-sidebar: rgba(255, 255, 255, 0.08); 
      --bg-card: rgba(255, 255, 255, 0.05); 
      --text-main: #ffffff; --text-muted: rgba(255, 255, 255, 0.6); 
      --accent: #ffffff; --border: rgba(255, 255, 255, 0.2); --glass-blur: 16px;
    }

    @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    * { box-sizing: border-box; transition: background 0.3s, color 0.3s, border 0.3s; }
    *::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }

    body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; background: var(--bg-dark); background-size: 400% 400%; animation: var(--bg-animate); color: var(--text-main); height: 100vh; overflow: hidden; }

    .particle-layer { position: fixed; inset: 0; overflow: hidden; z-index: -1; pointer-events: none; }
    .particle-layer span { position: absolute; width: 6px; height: 6px; border-radius: 999px; opacity: 0.35; animation: floatParticle linear infinite; }
    .particle-layer span:nth-child(3n+1) { background: var(--accent); }
    .particle-layer span:nth-child(3n+2) { background: var(--text-muted); }
    .particle-layer span:nth-child(3n+3) { background: var(--border); }

    @keyframes floatParticle {
      0%   { transform: translate(0, 0); }
      20%  { transform: translate(20px, -30px); }
      40%  { transform: translate(-25px, -10px); }
      60%  { transform: translate(15px, 25px); }
      80%  { transform: translate(-20px, 15px); }
      100% { transform: translate(0, 0); }
    }

    /* ONLINE COUNTER STYLE */
    .online-indicator { display: inline-flex; align-items: center; gap: 6px; color: var(--green); font-size: 0.85rem; font-weight: bold; background: rgba(166, 227, 161, 0.1); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(166, 227, 161, 0.2); margin-bottom: 15px; }
    .dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; animation: blink 1.5s infinite; }
    @keyframes blink { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

    #announcementBanner { background: var(--accent); color: #000; padding: 8px; text-align: center; font-weight: bold; font-size: 0.85rem; display: none; z-index: 100; }
    #toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); padding: 12px 25px; border-radius: 12px; color: #11111b; font-weight: bold; z-index: 60000; transition: top 0.4s; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    #toast.show { top: 20px; }

    #selectionScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: transparent; overflow-y: auto; padding: 20px; position: relative; }
    .blocker-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; width: 100%; max-width: 1000px; margin-top: 20px; }
    .blocker-card { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 18px; cursor: pointer; transition: 0.3s; font-weight: bold; text-align: center; display: flex; align-items: center; justify-content: center; min-height: 80px; backdrop-filter: blur(var(--glass-blur)); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .blocker-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.15); border-color: var(--accent); }
    
    .app-container { display: none; width: 100%; height: 100%; flex-direction: column; }
    .header { padding: 15px 25px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; background: var(--bg-sidebar); z-index: 10; backdrop-filter: blur(var(--glass-blur)); position: relative; gap: 10px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .header-bottom { display: flex; gap: 10px; width: 100%; align-items: center; }

    .search-bar { flex: 1; padding: 10px 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 30px; color: var(--text-main); outline: none; }
    .filter-pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
    .filter-pill { padding: 6px 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; font-size: 0.75rem; cursor: pointer; font-weight: bold; color: var(--text-muted); }
    .filter-pill.active { background: var(--accent); color: #000; border-color: var(--accent); }

    #posts { flex: 1; padding: 20px; padding-bottom: 100px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .post-card { background: var(--bg-card); padding: 25px; border-radius: 20px; width: 100%; max-width: 750px; position: relative; border: 1px solid var(--border); backdrop-filter: blur(var(--glass-blur)); box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
    .post-author { color: var(--accent); font-weight: 800; font-size: 0.95rem; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
    .post-content { white-space: pre-wrap; font-size: 1.05rem; margin-top: 12px; word-break: break-all; line-height: 1.5; }

    .settings-dropdown { position: relative; } 
    .gear-icon { font-size: 1.8rem; cursor: pointer; color: var(--text-muted); padding: 5px; transition: 0.3s; }
    .settings-menu { display: none; position: absolute; right: 0; top: 50px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; width: 240px; padding: 10px; z-index: 100; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
    .settings-menu.show { display: block; }

    .panel { display: none; position: fixed; bottom: 30px; right: 30px; width: 420px; background: var(--bg-card); border: 1px solid var(--border); padding: 25px; border-radius: 24px; z-index: 15000; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .admin-input { width: 100%; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: white; border-radius: 10px; margin-bottom: 12px; outline: none; }
    .admin-primary-btn { width: 100%; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    
    .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:50000; backdrop-filter: blur(8px); align-items:center; justify-content:center; }
    .modal-content { background: var(--bg-card); padding: 30px; border-radius: 24px; width: 90%; max-width: 400px; border: 1px solid var(--border); }
  </style>
</head>
<body>

<div class="particle-layer">
  <span></span><span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span><span></span>
</div>

<div id="toast"></div>
<div id="announcementBanner"></div>

<div id="selectionScreen">
  <div class="online-indicator">
    <div class="dot"></div>
    <span id="onlineCountMain">1</span> Online
  </div>
  <h1 style="color: var(--text-main); font-size: 2.5rem; margin-bottom: 8px; letter-spacing: -1px;">Eli's Proxies</h1>
  <p style="color: var(--text-muted); margin-bottom: 30px; font-size: 1rem; font-weight: 500;">Choose a filter to begin</p>
  <div class="blocker-grid" id="gridContainer"></div>
  <div class="blocker-card" style="margin-top:25px; width:100%; max-width:320px; background: rgba(255,255,255,0.1); border-color: var(--accent); color: var(--accent);" onclick="selectBlocker('All')">View All Proxies</div>
</div>

<div class="app-container" id="appContainer">
  <div class="header">
    <div class="header-top">
        <div style="display:flex; align-items:center; gap:15px;">
          <button onclick="goBackToSelection()" style="background:none; border:1px solid var(--border); color:var(--text-main); border-radius:25px; padding:8px 16px; cursor:pointer; font-weight:bold;">← Back</button>
          <div style="display:flex; flex-direction:column;">
            <h2 id="currentBlocker" style="font-size:1.2rem; margin:0; font-weight: 800;">Feed</h2>
            <span style="font-size:0.7rem; color:var(--green); font-weight:bold;"><span id="onlineCountHeader">1</span> users online</span>
          </div>
        </div>
        <div class="settings-dropdown">
          <div class="gear-icon" onclick="toggleSettings()">⚙</div>
          <div id="settingsMenu" class="settings-menu">
            <div onclick="location.reload()" style="padding:12px; cursor:pointer;">↻ Refresh Feed</div>
            <div onclick="document.getElementById('adminPanel').style.display='block'" style="padding:12px; cursor:pointer;">🔑 Admin Panel</div>
          </div>
        </div>
    </div>
    <div class="header-bottom">
        <input type="text" id="searchInput" class="search-bar" placeholder="Search for proxies...">
    </div>
  </div>
  <div id="posts"></div>
</div>

<div id="adminPanel" class="panel">
  <h3 style="margin-top:0;">Admin Access</h3>
  <input type="password" id="adminPassword" class="admin-input" placeholder="Password">
  <button class="admin-primary-btn" onclick="loginAction()">Authenticate</button>
  <button onclick="document.getElementById('adminPanel').style.display='none'" style="background:none; border:none; color:var(--text-muted); width:100%; margin-top:10px; cursor:pointer;">Close</button>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
const supabase = createClient('https://saauhuiruadqjogzughm.supabase.co', 'sb_publishable_u2yOKUXvz3qjRMOZt55-3Q_FGBN6b-F');

const blockers = ["Linewize", "Securly", "Palo_alto", "Blocksi", "Aristotle", "Lightspeed", "Contentkeeper", "Lanschool", "Goguardian", "Fortiguard", "Cisco_talos", "Deledao"];
let selectedBlocker = localStorage.getItem('eli_last_blocker') || null;

// --- REAL TIME ONLINE COUNTER LOGIC ---
const channel = supabase.channel('online-users', {
  config: { presence: { key: 'user' } }
});

channel
  .on('presence', { event: 'sync' }, () => {
    const state = channel.presenceState();
    const count = Object.keys(state).length;
    document.getElementById('onlineCountMain').textContent = count;
    document.getElementById('onlineCountHeader').textContent = count;
  })
  .subscribe(async (status) => {
    if (status === 'SUBSCRIBED') {
      await channel.track({ online_at: new Date().toISOString() });
    }
  });

// --- UI Logic ---
window.selectBlocker = (name) => {
  selectedBlocker = name;
  localStorage.setItem('eli_last_blocker', name);
  document.getElementById('selectionScreen').style.display = 'none';
  document.getElementById('appContainer').style.display = 'flex';
  document.getElementById('currentBlocker').textContent = name.replace(/_/g, ' ');
  fetchPosts();
};

window.goBackToSelection = () => {
    localStorage.removeItem('eli_last_blocker');
    document.getElementById('appContainer').style.display = 'none';
    document.getElementById('selectionScreen').style.display = 'flex';
};

window.toggleSettings = () => document.getElementById('settingsMenu').classList.toggle('show');

async function fetchPosts() {
  let query = supabase.from('posts').select('*').order('created_at', { ascending: false });
  if (selectedBlocker && selectedBlocker !== "All") query = query.eq('blocker', selectedBlocker);
  const { data } = await query;
  if (!data) return;

  document.getElementById('posts').innerHTML = data.map(p => `
    <div class="post-card">
      <div class="post-author">${p.author}</div>
      <div class="post-content">${p.content}</div>
    </div>
  `).join('');
}

// Init Grid
const grid = document.getElementById('gridContainer');
grid.innerHTML = blockers.map(b => `<div class="blocker-card" onclick="selectBlocker('${b}')">${b.replace(/_/g, ' ')}</div>`).join('');

if (selectedBlocker) selectBlocker(selectedBlocker);

// Particle Animation logic
const particles = document.querySelectorAll('.particle-layer span');
particles.forEach(p => {
  p.style.left = Math.random() * 100 + '%';
  p.style.top = Math.random() * 100 + '%';
  p.style.animationDuration = (Math.random() * 10 + 10) + 's';
  p.style.animationDelay = (Math.random() * -20) + 's';
});
</script>

</body>
</html>
