<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eli's Proxies</title>
<link rel="icon" type="image/png" href="https://elis-proxies.odoo.com/web/image/website/1/logo/Eli%27s%20Proxies?unique=7b51271.png">

<style>
  :root {
    --bg-dark: #1e1e2e;
    --bg-sidebar: #181825;
    --bg-card: #313244;
    --text-main: #cdd6f4;
    --text-muted: #a6adc8;
    --accent: #89b4fa;
    --accent-hover: #b4befe;
    --red: #f38ba8;
    --green: #a6e3a1;
  }

  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; background: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; }

  #toast {
    position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
    padding: 12px 25px; border-radius: 12px; color: #11111b; font-weight: bold;
    z-index: 9999; transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px;
  }
  #toast.show { top: 30px; }

  #selectionScreen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; background: radial-gradient(circle at center, #24273a 0%, #1e1e2e 100%);
    overflow-y: auto; padding: 40px 20px;
  }

  .blocker-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; max-width: 1000px; margin-top: 30px; }
  .blocker-card {
    background: var(--bg-card); border: 1px solid #45475a; padding: 25px;
    border-radius: 15px; cursor: pointer; transition: 0.3s; font-weight: bold;
    min-width: 160px; text-align: center; color: var(--text-main);
  }
  .blocker-card:hover { transform: translateY(-5px); background: var(--accent); color: var(--bg-dark); }
  
  .app-container { display: none; width: 100%; height: 100%; flex-direction: column; }
  main { flex: 1; display: flex; flex-direction: column; background: var(--bg-dark); position: relative; overflow: hidden; }

  .header { padding: 15px 40px; border-bottom: 1px solid #313244; display: flex; justify-content: space-between; align-items: center; background: var(--bg-sidebar); gap: 20px; z-index: 10; }
  .branding-area h2 { margin: 0; font-size: 1.4rem; color: white; white-space: nowrap; }
  
  .search-bar { 
    width: 100%; padding: 10px 15px; background: var(--bg-dark); 
    border: 1px solid #45475a; border-radius: 20px; color: white; outline: none;
  }

  .header-actions { display: flex; gap: 8px; }
  .btn-outline { background:none; border:2px solid var(--text-muted); color:var(--text-muted); border-radius:25px; padding:8px 18px; cursor:pointer; font-weight:bold; transition: 0.2s; white-space: nowrap; }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

  #posts { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .post-card { background: var(--bg-card); padding: 25px; border-radius: 16px; border-left: 6px solid var(--accent); width: 100%; max-width: 800px; }
  .post-author { color: var(--accent); font-weight: 800; }
  .post-content { white-space: pre-wrap; font-size: 1.1rem; margin-top: 10px; word-break: break-all; }
  .post-content a { color: var(--accent); text-decoration: underline; }

  #adminPanel { display: none; position: fixed; bottom: 30px; right: 30px; width: 450px; background: var(--bg-card); border: 1px solid #45475a; padding: 20px; border-radius: 20px; z-index: 5000; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
  .admin-input { width: 100%; padding: 12px; background: var(--bg-dark); border: 1px solid #45475a; color: white; border-radius: 10px; margin-bottom: 10px; font-size: 0.9rem; outline: none; }
  .admin-primary-btn { width: 100%; padding: 12px; background: var(--accent); color: var(--bg-dark); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
  
  .admin-tabs { display: flex; gap: 5px; margin-bottom: 15px; background: var(--bg-dark); padding: 5px; border-radius: 10px; }
  .admin-tab { flex: 1; padding: 8px; text-align: center; cursor: pointer; border-radius: 7px; font-size: 0.8rem; color: var(--text-muted); transition: 0.2s; }
  .admin-tab.active { background: var(--bg-card); color: var(--accent); font-weight: bold; }

  #adminBlockerButtons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 10px; }
  .admin-pill { padding: 6px 2px; border-radius: 6px; background: #1e1e2e; border: 1px solid #45475a; color: var(--text-muted); font-size: 0.7rem; cursor: pointer; text-align: center; }
  .admin-pill.selected { background: var(--accent); color: var(--bg-dark); border-color: var(--accent); }

  .log-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 6000; padding: 50px 20px; }
  .log-container { max-width: 600px; margin: 0 auto; background: var(--bg-sidebar); border-radius: 20px; padding: 30px; max-height: 80vh; overflow-y: auto; border: 1px solid #45475a; }
  
  .small-action { background: #1e1e2e; border: 1px solid #45475a; color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.75rem; margin-left: 5px; }
</style>
</head>
<body>

<div id="toast"></div>

<div id="selectionScreen">
  <h1 style="color: white; font-size: 2.2rem; margin-bottom: 10px;">Eli's Proxies</h1>
  <div class="blocker-grid" id="gridContainer"></div>
  <div class="blocker-card" style="margin-top:20px; width:300px;" onclick="selectBlocker('All')">All Proxies</div>
</div>

<div class="app-container" id="appContainer">
  <div class="header">
    <div class="branding-area">
      <h2 id="currentBlocker">Feed</h2>
      <button onclick="goBack()" class="btn-outline" style="font-size:0.7rem; padding:4px 10px;">← Back</button>
    </div>
    <input type="text" id="searchInput" class="search-bar" style="max-width:300px" placeholder="Search proxies...">
    <div class="header-actions">
      <button id="refreshBtn" class="btn-outline">↻</button>
      <button id="viewLogs" class="btn-outline">Logs</button>
      <button id="showAdmin" class="btn-outline">Admin</button>
    </div>
  </div>
  <div id="posts"></div>
</div>

<div id="logOverlay" class="log-overlay">
  <div class="log-container">
    <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
      <h2 style="margin:0">System Update Logs</h2>
      <button onclick="document.getElementById('logOverlay').style.display='none'" class="btn-outline">Close</button>
    </div>
    <div id="logList"></div>
  </div>
</div>

<div id="adminPanel">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <h3 style="margin:0; color:var(--accent);">Admin Panel</h3>
    <button onclick="document.getElementById('adminPanel').style.display='none'" style="background:none; border:none; color:white; cursor:pointer; font-size:1.5rem;">&times;</button>
  </div>

  <div id="loginSection">
    <input type="password" id="adminPassword" class="admin-input" placeholder="Enter Password">
    <button id="loginBtn" class="admin-primary-btn">Unlock Admin</button>
  </div>

  <div id="adminContent" style="display:none;">
    <div class="admin-tabs">
      <div class="admin-tab active" id="tabPost" onclick="switchTab('post')">Proxy Post</div>
      <div class="admin-tab" id="tabLog" onclick="switchTab('log')">System Log</div>
    </div>

    <div id="panePost">
      <input type="text" id="postAuthor" class="admin-input" placeholder="Author Name">
      <textarea id="postText" class="admin-input" rows="3" placeholder="Paste proxy link here..."></textarea>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span style="font-size:0.75rem; color:var(--text-muted)">Target Blockers:</span>
        <button onclick="selectAllBlockers()" style="background:none; border:none; color:var(--accent); cursor:pointer; font-size:0.7rem;">Select All</button>
      </div>
      <div id="adminBlockerButtons"></div>
      <button id="publishBtn" class="admin-primary-btn">Publish Everywhere</button>
      <button id="cancelEditBtn" class="admin-primary-btn" style="display:none; background:#45475a; margin-top:5px;">Cancel Edit</button>
    </div>

    <div id="paneLog" style="display:none;">
      <input type="text" id="logHeading" class="admin-input" placeholder="Log Version (e.g. V1.5)">
      <textarea id="logBody" class="admin-input" rows="4" placeholder="Update description..."></textarea>
      <button id="publishLogBtn" class="admin-primary-btn">Add Log Entry</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
const supabase = createClient('https://saauhuiruadqjogzughm.supabase.co', 'sb_publishable_u2yOKUXvz3qjRMOZt55-3Q_FGBN6b-F');

const blockers = ["Linewize", "Securly", "Palo_alto", "Blocksi", "Aristotle", "Lightspeed", "Contentkeeper", "Lanschool", "Goguardian", "Fortiguard", "Cisco_talos", "Deledao"];
let selectedBlocker = localStorage.getItem('eli_selected_blocker');
let isAdmin = false; 
let editingIds = [];

function showNotice(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = type === 'success' ? 'var(--green)' : 'var(--red)';
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
}

function linkify(text) {
  const urlPattern = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
  return text.replace(urlPattern, '<a href="$1" target="_blank">$1</a>');
}

// Build UI Elements
blockers.forEach(b => {
  const card = document.createElement('div');
  card.className = 'blocker-card'; card.textContent = b.replace(/_/g, ' ');
  card.onclick = () => selectBlocker(b);
  document.getElementById('gridContainer').appendChild(card);
  
  const pill = document.createElement('div');
  pill.className = 'admin-pill'; pill.textContent = b.replace(/_/g, ' ');
  pill.onclick = () => pill.classList.toggle('selected');
  pill.dataset.value = b;
  document.getElementById('adminBlockerButtons').appendChild(pill);
});

window.selectBlocker = (name) => {
  selectedBlocker = name;
  localStorage.setItem('eli_selected_blocker', name);
  document.getElementById('selectionScreen').style.display = 'none';
  document.getElementById('appContainer').style.display = 'flex';
  document.getElementById('currentBlocker').textContent = name === 'All' ? 'All Proxies' : name.replace(/_/g, ' ');
  fetchPosts();
};

window.goBack = () => {
  localStorage.removeItem('eli_selected_blocker');
  document.getElementById('selectionScreen').style.display = 'flex';
  document.getElementById('appContainer').style.display = 'none';
};

async function fetchPosts() {
  let query = supabase.from('posts').select('*');
  if (selectedBlocker && selectedBlocker !== "All") query = query.eq('blocker', selectedBlocker);
  const { data } = await query.order('created_at', { ascending: false });
  if (!data) return;

  const grouped = [];
  data.forEach(item => {
    const ex = grouped.find(g => g.content === item.content && g.author === item.author);
    if (ex) { ex.ids.push(item.id); }
    else { grouped.push({ ...item, ids: [item.id] }); }
  });

  document.getElementById('posts').innerHTML = grouped.map(p => `
    <div class="post-card">
      <div style="display:flex; justify-content:space-between">
        <span class="post-author">${p.author}</span>
        <span style="font-size:0.8rem; color:var(--text-muted)">${new Date(p.created_at).toLocaleDateString()}</span>
      </div>
      <div class="post-content">${linkify(p.content)}</div>
      ${isAdmin ? `<div style="margin-top:10px; text-align:right;">
        <button class="small-action" onclick="window.startEdit('${p.ids.join(',')}', \`${p.author}\`, \`${p.content}\`)">Edit</button>
        <button class="small-action" style="color:var(--red)" onclick="window.deletePost('${p.ids.join(',')}')">Delete</button>
      </div>` : ''}
    </div>
  `).join('');
}

window.switchTab = (tab) => {
  document.getElementById('panePost').style.display = tab === 'post' ? 'block' : 'none';
  document.getElementById('paneLog').style.display = tab === 'log' ? 'block' : 'none';
  document.getElementById('tabPost').classList.toggle('active', tab === 'post');
  document.getElementById('tabLog').classList.toggle('active', tab === 'log');
};

window.selectAllBlockers = () => {
  document.querySelectorAll('.admin-pill').forEach(p => p.classList.add('selected'));
};

// Admin Login
document.getElementById('adminPassword').addEventListener('keydown', (e) => { if(e.key === 'Enter') document.getElementById('loginBtn').click(); });
document.getElementById('loginBtn').onclick = () => {
  if (document.getElementById('adminPassword').value === 'EISisBetterForever') {
    isAdmin = true;
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('adminContent').style.display = 'block';
    showNotice("Logged in as Admin"); fetchPosts();
  } else showNotice("Wrong Password", "error");
};

// Post/Edit Actions
document.getElementById('publishBtn').onclick = async () => {
  const author = document.getElementById('postAuthor').value || 'Admin';
  const content = document.getElementById('postText').value;
  if (!content) return showNotice("Cannot post empty content", "error");

  if (editingIds.length > 0) {
    for (let id of editingIds) await supabase.from('posts').update({ author, content }).eq('id', id);
    showNotice("Proxy Updated Everywhere");
    window.cancelEdit();
  } else {
    const pills = document.querySelectorAll('.admin-pill.selected');
    if (pills.length === 0) return showNotice("Select a blocker first", "error");
    for (let p of pills) await supabase.from('posts').insert([{ blocker: p.dataset.value, author, content }]);
    showNotice("Proxy Published");
    document.getElementById('postText').value = '';
  }
  fetchPosts();
};

window.startEdit = (ids, author, content) => {
  editingIds = ids.split(',');
  document.getElementById('adminPanel').style.display = 'block';
  switchTab('post');
  document.getElementById('postAuthor').value = author;
  document.getElementById('postText').value = content;
  document.getElementById('publishBtn').textContent = "Save Updates";
  document.getElementById('cancelEditBtn').style.display = 'block';
};

window.cancelEdit = () => {
  editingIds = [];
  document.getElementById('postAuthor').value = '';
  document.getElementById('postText').value = '';
  document.getElementById('publishBtn').textContent = "Publish Everywhere";
  document.getElementById('cancelEditBtn').style.display = 'none';
};
document.getElementById('cancelEditBtn').onclick = window.cancelEdit;

window.deletePost = async (ids) => {
  for (let id of ids.split(',')) await supabase.from('posts').delete().eq('id', id);
  showNotice("Post Deleted"); fetchPosts();
};

// Log Actions
document.getElementById('publishLogBtn').onclick = async () => {
  const heading = document.getElementById('logHeading').value;
  const body = document.getElementById('logBody').value;
  if(!heading || !body) return showNotice("Fill all log fields", "error");
  await supabase.from('logs').insert([{ heading, body }]);
  showNotice("Log Added");
  document.getElementById('logHeading').value = ''; document.getElementById('logBody').value = '';
};

document.getElementById('viewLogs').onclick = async () => {
  document.getElementById('logOverlay').style.display = 'block';
  const { data } = await supabase.from('logs').select('*').order('created_at', { ascending: false });
  document.getElementById('logList').innerHTML = data.map(l => `
    <div style="border-bottom:1px solid #45475a; padding:15px 0;">
      <div style="display:flex; justify-content:space-between">
        <strong style="color:var(--accent)">${l.heading}</strong>
        ${isAdmin ? `<button class="small-action" style="color:var(--red)" onclick="window.deleteLog('${l.id}')">Delete</button>` : ''}
      </div>
      <p style="margin:5px 0; font-size:0.9rem; line-height:1.4;">${linkify(l.body)}</p>
    </div>
  `).join('');
};

window.deleteLog = async (id) => {
  await supabase.from('logs').delete().eq('id', id);
  document.getElementById('viewLogs').click(); 
};

// Header Actions
document.getElementById('refreshBtn').onclick = () => {
  fetchPosts();
  showNotice("Feed Refreshed");
};

document.getElementById('showAdmin').onclick = () => document.getElementById('adminPanel').style.display='block';

// Search
document.getElementById('searchInput').addEventListener('input', (e) => {
  const term = e.target.value.toLowerCase();
  document.querySelectorAll('.post-card').forEach(card => {
    card.style.display = card.innerText.toLowerCase().includes(term) ? 'block' : 'none';
  });
});

if (selectedBlocker) selectBlocker(selectedBlocker);
</script>
</body>
</html>
