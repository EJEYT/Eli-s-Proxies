<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eli's Proxies</title>
<link rel="icon" type="image/png" href="https://elis-proxies.odoo.com/web/image/website/1/logo/Eli%27s%20Proxies?unique=7b51271.png">

<style>
  :root {
    --bg-dark: #1e1e2e;
    --bg-sidebar: #181825;
    --bg-card: #313244;
    --text-main: #cdd6f4;
    --text-muted: #a6adc8;
    --accent: #89b4fa;
    --accent-hover: #b4befe;
    --red: #f38ba8;
    --green: #a6e3a1;
  }

  * { box-sizing: border-box; }

  body { 
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
    margin: 0; background-color: var(--bg-dark); color: var(--text-main);
    height: 100vh; overflow: hidden;
  }

  #selectionScreen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; width: 100%; padding: 20px; text-align: center;
    background: radial-gradient(circle at center, #24273a 0%, #1e1e2e 100%);
  }

  .blocker-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 15px; width: 100%; max-width: 900px; margin-top: 30px;
  }

  .blocker-card {
    background: var(--bg-card); border: 1px solid #45475a; padding: 25px;
    border-radius: 15px; cursor: pointer; transition: 0.3s; font-weight: bold;
    color: var(--text-main); font-size: 1.1rem;
  }

  .blocker-card:hover {
    transform: translateY(-5px); background: var(--accent); color: var(--bg-dark);
    box-shadow: 0 10px 20px rgba(137, 180, 250, 0.2);
  }

  .app-container { display: none; width: 100%; height: 100%; flex-direction: column; }

  main { flex: 1; display: flex; flex-direction: column; position: relative; background: var(--bg-dark); }

  .header {
    padding: 20px 40px; border-bottom: 1px solid #313244;
    display: flex; justify-content: space-between; align-items: center;
    background: var(--bg-sidebar);
  }

  .branding-area { display: flex; flex-direction: column; }
  .branding-area h1 { margin: 0; font-size: 0.9rem; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
  .branding-area h2 { margin: 0; font-size: 1.8rem; color: white; }
  
  .change-blocker-link {
    color: var(--text-muted); font-size: 0.8rem; text-decoration: underline; 
    cursor: pointer; margin-top: 5px; background: none; border: none; padding: 0;
  }

  .header-actions { display: flex; gap: 10px; }

  .btn-outline {
    background:none; border:2px solid var(--text-muted); color:var(--text-muted); 
    border-radius:25px; padding:8px 20px; cursor:pointer; font-weight:bold; transition: 0.2s;
  }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  
  #posts { 
    flex: 1; padding: 40px; overflow-y: auto; 
    display: flex; flex-direction: column; align-items: center; gap: 25px; 
  }

  .post-card {
    background-color: var(--bg-card); padding: 30px; border-radius: 16px;
    border-left: 6px solid var(--accent); position: relative;
    width: 100%; max-width: 900px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    animation: fadeIn 0.4s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .post-author { font-size: 0.9rem; color: var(--accent); font-weight: 800; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .post-content { white-space: pre-wrap; word-wrap: break-word; line-height: 1.6; font-size: 1.15rem; }
  .post-content a { color: var(--accent) !important; text-decoration: underline; }

  .delete-btn {
    position: absolute; top: 20px; right: 20px;
    background: rgba(243, 139, 168, 0.1); color: var(--red); border: 1px solid var(--red);
    width: 40px; height: 40px; border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  #adminPanel {
    display: none; position: fixed; bottom: 30px; right: 30px;
    width: 400px; background-color: var(--bg-card); border: 1px solid #45475a;
    padding: 30px; border-radius: 20px; z-index: 100; box-shadow: 0 10px 50px rgba(0,0,0,0.6);
  }

  #toast {
    position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
    padding: 15px 30px; border-radius: 10px; color: var(--bg-dark); font-weight: bold; z-index: 1000; display: none;
  }

  #confirmModal {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 2000;
  }
</style>
</head>
<body>

<div id="toast"></div>

<div id="selectionScreen">
  <h1 style="color: white; font-size: 2.5rem; margin-bottom: 10px;">Eli's Proxies</h1>
  <p style="color: var(--text-muted); font-size: 1.2rem;">Select your school's blocker to view the feed.</p>
  <div class="blocker-grid" id="gridContainer"></div>
</div>

<div class="app-container" id="appContainer">
  <main>
    <div class="header">
      <div class="branding-area">
        <h1>Eli's Proxies</h1>
        <h2 id="currentBlocker">Feed</h2>
        <button class="change-blocker-link" id="changeBlockerBtn">← Switch Blocker</button>
      </div>
      <div class="header-actions">
        <button id="refreshBtn" class="btn-outline">↻ Refresh</button>
        <button id="showAdmin" class="btn-outline">Admin Access</button>
      </div>
    </div>
    <div id="posts"></div>
  </main>
</div>

<div id="confirmModal">
  <div style="background: var(--bg-card); padding: 30px; border-radius: 20px; width: 350px; text-align: center; border: 1px solid #45475a;">
    <h2 style="margin-top:0">Delete Post?</h2>
    <div style="display:flex; gap:15px; margin-top:30px;">
      <button id="cancelDel" style="flex:1; padding:12px; border-radius:10px; border:none; background:#45475a; color:white; cursor:pointer;">Cancel</button>
      <button id="confirmDel" style="flex:1; padding:12px; border-radius:10px; border:none; background:var(--red); color:var(--bg-dark); font-weight:bold; cursor:pointer;">Delete</button>
    </div>
  </div>
</div>

<div id="adminPanel">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h3 style="margin:0; color:var(--accent);">Admin Tools</h3>
    <button id="closeAdmin" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:2rem;">&times;</button>
  </div>
  <div id="loginSection">
    <input type="password" id="adminPassword" style="width:100%; padding:15px; background:var(--bg-dark); border:1px solid #45475a; color:white; border-radius:10px; margin-bottom:15px;" placeholder="Password..."/>
    <button id="loginBtn" style="width:100%; padding:15px; background:var(--accent); border:none; border-radius:10px; font-weight:bold; cursor:pointer;">Login</button>
  </div>
  <div id="adminContent" style="display:none;">
    <input type="text" id="postAuthor" style="width:100%; padding:12px; background:var(--bg-dark); border:1px solid #45475a; color:white; border-radius:10px; margin-bottom:12px;" placeholder="Author Name">
    <textarea id="postText" rows="6" style="width:100%; padding:12px; background:var(--bg-dark); border:1px solid #45475a; color:white; border-radius:10px; margin-bottom:12px;" placeholder="Message..."></textarea>
    <div id="blockerCheckboxes" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: var(--bg-dark); padding: 15px; border-radius: 10px; max-height: 150px; overflow-y: auto; margin-bottom: 20px;"></div>
    <button id="publishBtn" style="width:100%; padding:15px; background:var(--accent); border:none; border-radius:10px; font-weight:bold; cursor:pointer;">Broadcast Message</button>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabaseUrl = 'https://saauhuiruadqjogzughm.supabase.co'
const supabaseKey = 'sb_publishable_u2yOKUXvz3qjRMOZt55-3Q_FGBN6b-F'
const supabase = createClient(supabaseUrl, supabaseKey)

const blockers = ["Linewize", "Securly", "Palo_alto", "Blocksi", "Aristotle", "Lightspeed", "Contentkeeper", "Lanschool", "Goguardian", "Fortiguard", "Cisco_talos", "Deledao"];

let selectedBlocker = localStorage.getItem('eli_selected_blocker');
let isAdmin = false; 
let pendingDeleteId = null;

const grid = document.getElementById('gridContainer');
const adminCheckboxes = document.getElementById('blockerCheckboxes');

blockers.forEach(b => {
  const card = document.createElement('div');
  card.className = 'blocker-card';
  card.textContent = b;
  card.onclick = () => selectBlocker(b);
  grid.appendChild(card);

  const label = document.createElement('label');
  label.innerHTML = `<input type="checkbox" value="${b}"> ${b}`;
  adminCheckboxes.appendChild(label);
});

function selectBlocker(name) {
  selectedBlocker = name;
  localStorage.setItem('eli_selected_blocker', name);
  showApp();
}

function showApp() {
  document.getElementById('selectionScreen').style.display = 'none';
  document.getElementById('appContainer').style.display = 'flex';
  document.getElementById('currentBlocker').textContent = selectedBlocker;
  
  // Persistent Admin Check: If already logged in, keep UI updated
  if (isAdmin) {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('adminContent').style.display = 'block';
  }
  
  fetchPosts();
}

// Swaps screens without a page refresh to keep Admin Session alive
document.getElementById('changeBlockerBtn').onclick = () => {
  localStorage.removeItem('eli_selected_blocker');
  selectedBlocker = null;
  document.getElementById('appContainer').style.display = 'none';
  document.getElementById('selectionScreen').style.display = 'flex';
};

async function fetchPosts() {
  if (!selectedBlocker) return;
  const { data, error } = await supabase.from('posts').select('*').eq('blocker', selectedBlocker).order('created_at', { ascending: false });
  if (error) return;
  
  const postsDiv = document.getElementById('posts');
  if (data.length === 0) {
      postsDiv.innerHTML = `<h3 style="color:var(--text-muted); margin-top: 50px;">No posts found for ${selectedBlocker}.</h3>`;
      return;
  }
  
  postsDiv.innerHTML = data.map(p => `
    <div class="post-card">
      <div class="post-author">By: ${p.author || 'Anonymous'}</div>
      <div class="post-content">${linkify(p.content)}</div>
      ${isAdmin ? `<button class="delete-btn" onclick="openDelModal(${p.id})">🗑</button>` : ''}
    </div>
  `).join('');
}

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.backgroundColor = type === 'success' ? 'var(--green)' : 'var(--red)';
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

function linkify(text) {
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  return text.replace(urlRegex, url => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
}

document.getElementById('refreshBtn').onclick = () => { fetchPosts(); showToast('Feed updated'); };
document.getElementById('showAdmin').onclick = () => document.getElementById('adminPanel').style.display = 'block';
document.getElementById('closeAdmin').onclick = () => document.getElementById('adminPanel').style.display = 'none';

document.getElementById('loginBtn').onclick = () => {
  if (document.getElementById('adminPassword').value === 'EISisBetterForever') {
    isAdmin = true;
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('adminContent').style.display = 'block';
    showToast('Admin Access Granted');
    fetchPosts(); // Reload current feed to show delete buttons
  } else { showToast('Invalid Password', 'error'); }
};

document.getElementById('publishBtn').onclick = async () => {
  const text = document.getElementById('postText').value;
  const author = document.getElementById('postAuthor').value.trim() || 'Anonymous';
  const checkboxes = document.querySelectorAll('#blockerCheckboxes input:checked');
  if (!text.trim() || checkboxes.length === 0) return showToast('Check your inputs!', 'error');

  for (const cb of checkboxes) {
    await supabase.from('posts').insert([{ blocker: cb.value, content: text, author: author }]);
  }
  document.getElementById('postText').value = '';
  showToast('Broadcast Sent');
  fetchPosts();
};

window.openDelModal = (id) => {
  pendingDeleteId = id;
  document.getElementById('confirmModal').style.display = 'flex';
};

document.getElementById('cancelDel').onclick = () => document.getElementById('confirmModal').style.display = 'none';
document.getElementById('confirmDel').onclick = async () => {
  // 1. First, find the content of the post we are about to delete
  const { data: postToMatch } = await supabase
    .from('posts')
    .select('content')
    .eq('id', pendingDeleteId)
    .single();

  if (postToMatch) {
    // 2. Delete EVERY post that has that exact same message content
    const { error } = await supabase
      .from('posts')
      .delete()
      .eq('content', postToMatch.content);

    document.getElementById('confirmModal').style.display = 'none';
    
    if (error) {
      showToast('Delete failed', 'error');
    } else {
      showToast('Message wiped from ALL blockers');
      fetchPosts();
    }
  }
};

if (selectedBlocker) {
  showApp();
}
</script>
</body>
</html>
