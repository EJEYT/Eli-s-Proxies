    [data-theme="emerald"] { --bg-dark: #06120e; --bg-sidebar: #0a1a15; --bg-card: #122a22; --text-main: #ecfdf5; --text-muted: #6ee7b7; --accent: #10b981; --border: #065f46; }
    [data-theme="rose"] { --bg-dark: #1a1012; --bg-sidebar: #24181a; --bg-card: #3d2b2e; --text-main: #fff1f2; --text-muted: #fda4af; --accent: #f43f5e; --border: #9f1239; }

    [data-theme="forest"] { --bg-dark: #0b120b; --bg-sidebar: #131d13; --bg-card: #1b2b1b; --text-main: #d4e4d4; --text-muted: #7da17d; --accent: #4caf50; --border: #2e442e; }
    [data-theme="lava"] { --bg-dark: #0d0000; --bg-sidebar: #1a0000; --bg-card: #2d0000; --text-main: #ffd1d1; --text-muted: #ff6b6b; --accent: #ff4500; --border: #4d0000; }
    [data-theme="dracula"] { --bg-dark: #282a36; --bg-sidebar: #1e1f29; --bg-card: #44475a; --text-main: #f8f8f2; --text-muted: #6272a4; --accent: #bd93f9; --border: #bd93f9; }
    [data-theme="sakura"] { --bg-dark: #fff5f7; --bg-sidebar: #ffe0e9; --bg-card: #ffffff; --text-main: #d01d56; --text-muted: #f1a7bb; --accent: #ff8fa3; --border: #ffcad4; }
    [data-theme="synthwave"] { --bg-dark: #241744; --bg-sidebar: #2d1b5a; --bg-card: #37246e; --text-main: #fede5d; --text-muted: #ff7edb; --accent: #2de2e6; --border: #72f1b8; }

    [data-theme="gold"] { --bg-dark: #0a0a0a; --bg-sidebar: #141414; --bg-card: #1a1a1a; --text-main: #ffffff; --text-muted: #888888; --accent: #d4af37; --border: #333333; }
    [data-theme="ocean"] { --bg-dark: #0f172a; --bg-sidebar: #1e293b; --bg-card: #334155; --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #38bdf8; --border: #475569; }

    [data-theme="nebula"] { --bg-dark: #09090b; --bg-sidebar: #18181b; --bg-card: #27272a; --text-main: #fafafa; --text-muted: #a1a1aa; --accent: #d946ef; --border: #3f3f46; }

      --bg-dark: linear-gradient(-45deg, #0f172a, #1e293b, #082f49, #0f172a); 
      --bg-animate: gradientMove 15s ease infinite;
      --bg-sidebar: rgba(255, 255, 255, 0.08);

    @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    * { box-sizing: border-box; transition: background 0.3s, color 0.3s, border 0.3s; }
    *::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }

    body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; background: var(--bg-dark); background-size: 400% 400%; animation: var(--bg-animate); color: var(--text-main); height: 100vh; overflow: hidden; position: relative; }

    /* Particles Canvas */
    #particleCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: 0.5; }

    #announcementBanner { background: var(--accent); color: #000; padding: 8px; text-align: center; font-weight: bold; font-size: 0.85rem; display: none; z-index: 100; position: relative; }

    #toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); padding: 12px 25px; border-radius: 12px; color: #11111b; font-weight: bold; z-index: 60000; transition: top 0.4s; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

    /* Draggable Window Container */

    .blocker-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.15); border-color: var(--accent); }
    
    .app-container { display: none; width: 100%; height: 100%; flex-direction: column; position: relative; z-index: 1; }
    .header { padding: 15px 25px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; background: var(--bg-sidebar); z-index: 10; backdrop-filter: blur(var(--glass-blur)); position: relative; gap: 10px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .header-bottom { display: flex; gap: 10px; width: 100%; align-items: center; }

    .search-bar { flex: 1; padding: 10px 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 30px; color: var(--text-main); outline: none; backdrop-filter: blur(var(--glass-blur)); }
    .filter-pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
    .filter-pill { padding: 6px 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; font-size: 0.75rem; cursor: pointer; white-space: nowrap; font-weight: bold; color: var(--text-muted); }

    .gear-icon:hover { color: var(--accent); transform: rotate(45deg); }
    
    /* Discord Nudge Tooltip */
    #discordNudge { position: absolute; right: 50px; top: 0; background: #5865F2; color: white; padding: 8px 15px; border-radius: 10px; font-size: 0.75rem; font-weight: bold; white-space: nowrap; display: none; opacity: 0; transition: opacity 0.5s; z-index: 100; }
    #discordNudge::after { content: ''; position: absolute; right: -8px; top: 12px; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-left: 8px solid #5865F2; }

    .settings-menu { display: none; position: absolute; right: 0; top: 50px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; width: 240px; padding: 10px; z-index: 100; box-shadow: 0 15px 35px rgba(0,0,0,0.4); backdrop-filter: blur(30px); max-height: 80vh; overflow-y: auto; }
    .settings-menu.show { display: block; }
    .menu-item { padding: 12px; border-radius: 10px; cursor: pointer; font-size: 0.9rem; font-weight: bold; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }
    .menu-item:hover { background: rgba(255,255,255,0.1); color: var(--accent); }
    
    /* Discord Button Highlighting */
    .discord-btn { border: 2px solid #5865F2; margin-top: 5px; animation: glowPulse 2s infinite; }
    @keyframes glowPulse { 0% { box-shadow: 0 0 5px #5865f2; } 50% { box-shadow: 0 0 15px #5865f2; } 100% { box-shadow: 0 0 5px #5865f2; } }

    .admin-input { width: 100%; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: white; border-radius: 10px; margin-bottom: 12px; outline: none; }
    .admin-primary-btn { width: 100%; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 8px; transition: 0.2s; }
    
    .vote-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-main); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; transition: 0.2s; user-select: none; }
    .vote-btn.active-like { border-color: var(--green); color: var(--green); background: rgba(166, 227, 161, 0.1); }

    .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:50000; backdrop-filter: blur(8px); align-items:center; justify-content:center; }
    .modal-content { background: var(--bg-card); padding: 30px; border-radius: 24px; width: 90%; max-width: 400px; border: 1px solid var(--border); }
    
    /* Confetti Styling */
    .confetti { position: fixed; width: 10px; height: 10px; top: -10px; z-index: 100000; pointer-events: none; }
  </style>
</head>
<body>

<canvas id="particleCanvas"></canvas>

<div id="requestModal" class="draggable-window" style="width: 400px; top: 20%; left: 30%;">

                <div onclick="setTheme('liquid')" style="padding:5px; cursor:pointer;">Liquid Glass</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
const supabase = createClient('https://saauhuiruadqjogzughm.supabase.co', 'sb_publishable_u2yOKUXvz3qjRMOZt55-3Q_FGBN6b-F');

const blockers = ["Linewize", "Securly", "Palo_alto", "Blocksi", "Aristotle", "Lightspeed", "Contentkeeper", "Lanschool", "Goguardian", "Fortiguard", "Cisco_talos", "Deledao"];
let selectedBlocker = null;
let currentSort = 'new';
let isAdmin = false;

// --- PARTICLE SYSTEM ---
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let particles = [];
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.onresize = resize; resize();

class Particle {
  constructor() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 2 + 1;
    this.speedX = Math.random() * 0.5 - 0.25;
    this.speedY = Math.random() * 0.5 - 0.25;
  }
  update() {
    this.x += this.speedX; this.y += this.speedY;
    if (this.x > canvas.width) this.x = 0; if (this.x < 0) this.x = canvas.width;
    if (this.y > canvas.height) this.y = 0; if (this.y < 0) this.y = canvas.height;
  }
  draw() {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent');
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
  }
}
for (let i = 0; i < 60; i++) particles.push(new Particle());
function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(animateParticles);
}
animateParticles();

// --- DRAGGABLE LOGIC ---
function makeDraggable(el) {
  let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
  const header = el.querySelector(".window-header");
  header.onmousedown = (e) => {
    e.preventDefault();
    pos3 = e.clientX; pos4 = e.clientY;
    document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
    document.onmousemove = (e) => {
      pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
      pos3 = e.clientX; pos4 = e.clientY;
      el.style.top = (el.offsetTop - pos2) + "px";
      el.style.left = (el.offsetLeft - pos1) + "px";
    };
  };
}
document.querySelectorAll(".draggable-window").forEach(makeDraggable);

// --- CONFETTI LOGIC ---
window.triggerConfetti = () => {
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = ['#89b4fa', '#f38ba8', '#a6e3a1', '#f9e2af'][Math.floor(Math.random()*4)];
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    const anim = c.animate([
      { top: '-10px', opacity: 1 },
      { top: '100vh', opacity: 0, transform: `rotate(${Math.random()*1000}deg)` }
    ], { duration: Math.random() * 2000 + 1000, easing: 'cubic-bezier(0,1,1,1)' });
    anim.onfinish = () => c.remove();
  }
};

// --- DISCORD NUDGE ---
setInterval(() => {
    const nudge = document.getElementById('discordNudge');
    nudge.style.display = 'block';
    setTimeout(() => nudge.style.opacity = '1', 10);
    setTimeout(() => {
        nudge.style.opacity = '0';
        setTimeout(() => nudge.style.display = 'none', 500);
    }, 6000);
}, 120000); // 2 Minutes

// --- CORE APP ---
window.setTheme = (t) => { document.documentElement.setAttribute('data-theme', t); localStorage.setItem('eli_theme', t); };
setTheme(localStorage.getItem('eli_theme') || 'dark');

window.toggleSettings = () => document.getElementById('settingsMenu').classList.toggle('show');
window.toggleThemeList = () => {
    const list = document.getElementById('themesSubList');
    list.style.display = list.style.display === 'none' ? 'block' : 'none';
};

window.voteProxy = async (id, type) => {
    if(localStorage.getItem(`voted_${id}`)) return;
    if(type === 'like') triggerConfetti();
    const { data } = await supabase.from('posts').select(type + 's').eq('id', id).single();
    await supabase.from('posts').update({ [type + 's']: (data[type + 's'] || 0) + 1 }).eq('id', id);
    localStorage.setItem(`voted_${id}`, true);
    fetchPosts(true);
};

window.fetchPosts = async (silent = false) => {
    let query = supabase.from('posts').select('*');
    if (selectedBlocker && selectedBlocker !== "All") query = query.eq('blocker', selectedBlocker);
    const { data } = await query;
    if(!data) return;

    if(currentSort === 'likes') data.sort((a,b) => (b.likes||0) - (a.likes||0));
    else data.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

    document.getElementById('posts').innerHTML = data.map(p => `
        <div class="post-card">
            <div class="post-author">${p.author}</div>
            <div class="post-content">${p.content}</div>
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button class="vote-btn" onclick="voteProxy('${p.id}', 'like')">👍 ${p.likes || 0}</button>
                <button class="vote-btn" onclick="voteProxy('${p.id}', 'dislike')">👎 ${p.dislikes || 0}</button>
            </div>
        </div>
    `).join('');
};

window.selectBlocker = (name) => {
  selectedBlocker = name;
  document.getElementById('selectionScreen').style.display = 'none';
  document.getElementById('appContainer').style.display = 'flex';
  document.getElementById('currentBlocker').textContent = name;
  fetchPosts();
};

window.goBackToSelection = () => {
    document.getElementById('appContainer').style.display = 'none';
    document.getElementById('selectionScreen').style.display = 'flex';
};

window.showLogs = async () => {
  const { data } = await supabase.from('logs').select('*').order('created_at', { ascending: false });
  document.getElementById('logList').innerHTML = data.map(l => `
    <div style="margin-bottom:15px; border-bottom:1px solid var(--border); padding-bottom:10px;">
      <strong style="color:var(--accent);">${l.heading}</strong>
      <p style="font-size:0.85rem; margin-top:5px;">${l.body}</p>
    </div>`).join('');
};

// Setup Grid
blockers.forEach(b => {
  const card = document.createElement('div');
  card.className = 'blocker-card'; card.textContent = b.replace(/_/g, ' ');
  card.onclick = () => selectBlocker(b);
  document.getElementById('gridContainer').appendChild(card);
});

window.loginAction = () => {
  if (document.getElementById('adminPassword').value === 'EISisBetterForever') {
    isAdmin = true; 
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('adminContent').style.display = 'block'; 
  }
};
</script>
</body>
</html>
