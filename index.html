<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blocker Posts</title>
<style>
  :root {
    --bg-dark: #1e1e2e;
    --bg-sidebar: #181825;
    --bg-card: #313244;
    --text-main: #cdd6f4;
    --text-muted: #a6adc8;
    --accent: #89b4fa;
    --accent-hover: #b4befe;
    --red: #f38ba8;
  }

  * { box-sizing: border-box; }

  body { 
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
    margin: 0; 
    background-color: var(--bg-dark); 
    color: var(--text-main);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  .app-container { display: flex; width: 100%; height: 100%; }

  aside {
    width: 260px;
    background-color: var(--bg-sidebar);
    display: flex;
    flex-direction: column;
    border-right: 1px solid #313244;
    padding: 20px;
    overflow-y: auto;
  }

  aside h2 {
    font-size: 1.2rem;
    color: var(--accent);
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  #blockerSelection { display: flex; flex-direction: column; gap: 10px; }

  #blockerSelection button {
    background: transparent;
    border: none;
    color: var(--text-muted);
    text-align: left;
    padding: 12px 15px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }

  #blockerSelection button:hover { background-color: var(--bg-card); color: var(--text-main); }

  main { flex: 1; display: flex; flex-direction: column; position: relative; }

  .header {
    padding: 20px 30px;
    border-bottom: 1px solid #313244;
    background-color: var(--bg-dark);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #posts {
    flex: 1;
    padding: 30px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  /* Post Card Styling */
  .post-card {
    background-color: var(--bg-card);
    padding: 15px 20px;
    border-radius: 12px;
    border-left: 4px solid var(--accent);
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }

  .post-author {
    font-size: 0.75rem;
    color: var(--accent);
    font-weight: bold;
    margin-bottom: 5px;
    text-transform: uppercase;
  }

  .post-content { line-height: 1.5; word-wrap: break-word; }
  
  /* Make links clickable and blue */
  .post-content a {
    color: var(--accent-hover);
    text-decoration: underline;
  }

  #showAdmin {
    background-color: transparent;
    border: 1px solid var(--text-muted);
    color: var(--text-muted);
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
  }

  /* Admin Panel Popup */
  #adminPanel {
    display: none;
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 350px;
    background-color: var(--bg-card);
    border: 1px solid #45475a;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    padding: 20px;
    border-radius: 12px;
    z-index: 100;
  }

  .admin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
  }

  .close-btn {
    background: none;
    border: none;
    color: var(--red);
    font-size: 1.5rem;
    cursor: pointer;
    line-height: 1;
  }

  #adminPanel input, #adminPanel textarea {
    width: 100%;
    background-color: var(--bg-dark);
    border: 1px solid #45475a;
    color: white;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 10px;
  }

  #loginBtn, #publishBtn {
    background-color: var(--accent);
    color: var(--bg-dark);
    border: none;
    padding: 10px;
    width: 100%;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }

  #blockerCheckboxes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
    margin: 10px 0;
    max-height: 100px;
    overflow-y: auto;
  }
</style>
</head>
<body>

<div class="app-container">
  <aside>
    <h2>Blockers</h2>
    <div id="blockerSelection">
      <button>Linewize</button>
      <button>Securly</button>
      <button>Palo_alto</button>
      <button>Blocksi</button>
      <button>Aristotle</button>
      <button>Lightspeed</button>
      <button>Contentkeeper</button>
      <button>Lanschool</button>
      <button>Goguardian</button>
      <button>Fortiguard</button>
      <button>Cisco_talos</button>
      <button>Deledao</button>
    </div>
  </aside>

  <main>
    <div class="header">
      <h2 id="currentBlocker">Select a Blocker</h2>
      <button id="showAdmin">Admin Access</button>
    </div>
    <div id="posts"></div>
  </main>
</div>

<div id="adminPanel">
  <div class="admin-header">
    <h3>Admin Control</h3>
    <button class="close-btn" id="closeAdmin">&times;</button>
  </div>
  
  <div id="loginSection">
    <input type="password" id="adminPassword" placeholder="Enter password"/>
    <button id="loginBtn">Login</button>
  </div>

  <div id="adminContent" style="display:none;">
    <input type="text" id="postAuthor" placeholder="By: (Name or Alias)">
    <textarea id="postText" rows="4" placeholder="Your message... (links work automatically)"></textarea>
    <div id="blockerCheckboxes">
      <label><input type="checkbox" value="Linewize"> Linewize</label>
      <label><input type="checkbox" value="Securly"> Securly</label>
      <label><input type="checkbox" value="Palo_alto"> Palo_alto</label>
      <label><input type="checkbox" value="Blocksi"> Blocksi</label>
      <label><input type="checkbox" value="Aristotle"> Aristotle</label>
      <label><input type="checkbox" value="Lightspeed"> Lightspeed</label>
      <label><input type="checkbox" value="Contentkeeper"> Contentkeeper</label>
      <label><input type="checkbox" value="Lanschool"> Lanschool</label>
      <label><input type="checkbox" value="Goguardian"> Goguardian</label>
      <label><input type="checkbox" value="Fortiguard"> Fortiguard</label>
      <label><input type="checkbox" value="Cisco_talos"> Cisco_talos</label>
      <label><input type="checkbox" value="Deledao"> Deledao</label>
    </div>
    <button id="publishBtn">Publish Post</button>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabaseUrl = 'https://saauhuiruadqjogzughm.supabase.co'
const supabaseKey = 'sb_publishable_u2yOKUXvz3qjRMOZt55-3Q_FGBN6b-F'
const supabase = createClient(supabaseUrl, supabaseKey)

let selectedBlocker = null

// Function to find URLs in text and turn them into <a> tags
function linkify(text) {
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  return text.replace(urlRegex, function(url) {
    return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
  });
}

// Blocker selection
document.querySelectorAll('#blockerSelection button').forEach(btn => {
  btn.addEventListener('click', () => {
    selectedBlocker = btn.textContent
    document.getElementById('currentBlocker').textContent = selectedBlocker + " Feed"
    fetchPosts()
  })
})

// Fetch posts
async function fetchPosts() {
  if (!selectedBlocker) return
  const { data, error } = await supabase
    .from('posts')
    .select('*')
    .eq('blocker', selectedBlocker)
    .order('created_at', { ascending: true })
  
  if (error) console.error(error)
  const postsDiv = document.getElementById('posts')
  
  postsDiv.innerHTML = data.map(p => `
    <div class="post-card">
      <div class="post-author">By: ${p.author || 'Anonymous'}</div>
      <div class="post-content">${linkify(p.content)}</div>
    </div>
  `).join('')
}

// Admin panel Toggle (Open)
document.getElementById('showAdmin').addEventListener('click', () => {
  document.getElementById('adminPanel').style.display = 'block'
})

// Admin panel Toggle (Close)
document.getElementById('closeAdmin').addEventListener('click', () => {
  document.getElementById('adminPanel').style.display = 'none'
})

// Admin login
document.getElementById('loginBtn').addEventListener('click', () => {
  const pw = document.getElementById('adminPassword').value
  if (pw === 'EISisBetterForever') {
    document.getElementById('loginSection').style.display = 'none'
    document.getElementById('adminContent').style.display = 'block'
  } else {
    alert('Wrong password')
  }
})

// Publish post
document.getElementById('publishBtn').addEventListener('click', async () => {
  const text = document.getElementById('postText').value.trim()
  const author = document.getElementById('postAuthor').value.trim() || 'Anonymous'
  
  if (!text) return alert('Post cannot be empty')
  const checkboxes = document.querySelectorAll('#blockerCheckboxes input[type="checkbox"]:checked')
  if (checkboxes.length === 0) return alert('Select at least one blocker')

  for (const cb of checkboxes) {
    const { error } = await supabase
        .from('posts')
        .insert([{ 
            blocker: cb.value, 
            content: text, 
            author: author 
        }])
    if (error) console.error(error)
  }
  
  document.getElementById('postText').value = ''
  fetchPosts()
  alert('Post published')
})

// Refresh
setInterval(fetchPosts, 5000)
</script>

</body>
</html>
