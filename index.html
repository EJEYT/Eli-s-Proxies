<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eli's Proxies</title>
  
  <style>
    /* --- ALL THEMES RESTORED --- */
    :root { 
      --bg-dark: #1e1e2e; --bg-sidebar: #181825; --bg-card: #313244;
      --text-main: #cdd6f4; --text-muted: #a6adc8; --accent: #89b4fa;
      --red: #f38ba8; --green: #a6e3a1; --border: #45475a; --glass-blur: 0px;
    }
    [data-theme="dark"] { --bg-dark: #121212; --bg-sidebar: #1e1e1e; --bg-card: #242424; --text-main: #e0e0e0; --accent: #bb86fc; --border: #333; }
    [data-theme="oled"] { --bg-dark: #000; --bg-sidebar: #000; --bg-card: #111; --text-main: #fff; --accent: #fff; --border: #222; }
    [data-theme="cyberpunk"] { --bg-dark: #000b1e; --bg-sidebar: #00162d; --bg-card: #002244; --text-main: #00ffcc; --accent: #ff007f; --border: #00ffcc; }
    [data-theme="emerald"] { --bg-dark: #06120e; --bg-sidebar: #0a1a15; --bg-card: #122a22; --text-main: #ecfdf5; --accent: #10b981; --border: #065f46; }
    [data-theme="liquid"] { 
      --bg-dark: linear-gradient(-45deg, #0f172a, #1e293b, #082f49, #0f172a); 
      --bg-sidebar: rgba(255, 255, 255, 0.08); --bg-card: rgba(255, 255, 255, 0.05); 
      --accent: #ffffff; --border: rgba(255, 255, 255, 0.2); --glass-blur: 16px;
    }
    [data-theme="dracula"] { --bg-dark: #282a36; --bg-sidebar: #1e1f29; --bg-card: #44475a; --text-main: #f8f8f2; --accent: #bd93f9; --border: #bd93f9; }
    [data-theme="synthwave"] { --bg-dark: #241744; --bg-sidebar: #2d1b5a; --bg-card: #37246e; --text-main: #fede5d; --accent: #2de2e6; --border: #72f1b8; }
    [data-theme="gold"] { --bg-dark: #0a0a0a; --bg-sidebar: #141414; --bg-card: #1a1a1a; --text-main: #fff; --accent: #d4af37; --border: #333; }

    * { box-sizing: border-box; transition: background 0.3s, color 0.3s; }
    body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; }

    /* Background Particles */
    #particleCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: 0.6; }

    /* Draggable Windows */
    .draggable-window { position: fixed; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; z-index: 1000; box-shadow: 0 20px 50px rgba(0,0,0,0.5); backdrop-filter: blur(25px); display: none; min-width: 350px; }
    .window-header { padding: 12px 20px; background: rgba(255,255,255,0.05); cursor: move; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); border-radius: 20px 20px 0 0; }
    .close-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.5rem; }

    /* Selection Screen */
    #selectionScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; position: relative; z-index: 1; padding: 20px; overflow-y: auto; }
    .blocker-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; width: 100%; max-width: 900px; }
    .blocker-card { background: var(--bg-card); border: 1px solid var(--border); padding: 25px; border-radius: 15px; cursor: pointer; text-align: center; font-weight: bold; transition: 0.3s; }
    .blocker-card:hover { transform: translateY(-5px); border-color: var(--accent); background: rgba(255,255,255,0.1); }

    /* App Layout */
    .app-container { display: none; flex-direction: column; height: 100vh; position: relative; z-index: 1; }
    .header { padding: 15px 25px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); backdrop-filter: blur(10px); }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .search-bar { width: 100%; padding: 10px 20px; margin-top: 10px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 25px; color: white; outline: none; }

    /* Settings & Discord Nudge */
    .settings-dropdown { position: relative; }
    .gear-icon { font-size: 1.8rem; cursor: pointer; transition: 0.3s; }
    .gear-icon:hover { color: var(--accent); transform: rotate(45deg); }
    
    #discordNudge { 
      position: absolute; right: 50px; top: 5px; background: #5865F2; color: white; padding: 6px 12px; 
      border-radius: 8px; font-size: 0.7rem; font-weight: bold; white-space: nowrap; 
      display: none; pointer-events: none; z-index: 2000; 
    }
    #discordNudge::after { content: ''; position: absolute; right: -6px; top: 8px; border-left: 6px solid #5865F2; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }

    .settings-menu { display: none; position: absolute; right: 0; top: 45px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; width: 220px; padding: 10px; z-index: 100; }
    .settings-menu.show { display: block; }
    .menu-item { padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: bold; }
    .menu-item:hover { background: rgba(255,255,255,0.1); }
    
    .discord-btn-highlight { border: 2px solid #5865F2; animation: pulseDiscord 2s infinite; }
    @keyframes pulseDiscord { 0% { box-shadow: 0 0 0px #5865F2; } 50% { box-shadow: 0 0 10px #5865F2; } 100% { box-shadow: 0 0 0px #5865F2; } }

    /* Feed */
    #posts { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .post-card { background: var(--bg-card); padding: 20px; border-radius: 15px; width: 100%; max-width: 600px; border: 1px solid var(--border); }
    
    /* Admin Tabs Restored */
    .admin-tabs { display: flex; gap: 5px; margin-bottom: 15px; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 10px; }
    .admin-tab { flex: 1; padding: 8px; text-align: center; cursor: pointer; border-radius: 6px; font-size: 0.8rem; }
    .admin-tab.active { background: var(--accent); color: #000; font-weight: bold; }

    .admin-input { width: 100%; padding: 10px; margin-bottom: 10px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: white; border-radius: 8px; }
    .admin-btn { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .confetti { position: fixed; width: 8px; height: 8px; z-index: 10000; pointer-events: none; }
  </style>
</head>
<body>

<canvas id="particleCanvas"></canvas>

<div id="adminPanel" class="draggable-window" style="top: 10%; right: 10%;">
  <div class="window-header">
    <span style="font-weight: bold;">🔑 Admin Dashboard</span>
    <button class="close-btn" onclick="closeWindow('adminPanel')">&times;</button>
  </div>
  <div style="padding: 20px;">
    <div id="loginSection">
      <input type="password" id="adminPassword" class="admin-input" placeholder="Password">
      <button class="admin-btn" onclick="loginAction()">Login</button>
    </div>
    <div id="adminContent" style="display:none;">
      <div class="admin-tabs">
        <div class="admin-tab active" id="tabPost" onclick="switchTab('post')">Post</div>
        <div class="admin-tab" id="tabLog" onclick="switchTab('log')">Log</div>
        <div class="admin-tab" id="tabBanner" onclick="switchTab('banner')">Banner</div>
      </div>
      <div id="panePost">
        <input type="text" id="postAuthor" class="admin-input" placeholder="Author">
        <textarea id="postText" class="admin-input" placeholder="Proxy URL..."></textarea>
        <button class="admin-btn" onclick="publishPost()">Publish</button>
      </div>
      <div id="paneLog" style="display:none;">
        <input type="text" id="logTitle" class="admin-input" placeholder="Update Title">
        <textarea id="logDesc" class="admin-input" placeholder="Details..."></textarea>
        <button class="admin-btn" onclick="publishLog()">Add Log</button>
      </div>
      <div id="paneBanner" style="display:none;">
        <textarea id="bannerInput" class="admin-input" placeholder="Announcement..."></textarea>
        <button class="admin-btn" onclick="updateBanner()">Set Banner</button>
      </div>
    </div>
  </div>
</div>

<div id="logWindow" class="draggable-window" style="top: 15%; left: 15%; width: 450px;">
  <div class="window-header">
    <span style="font-weight: bold;">📜 Change Logs</span>
    <button class="close-btn" onclick="closeWindow('logWindow')">&times;</button>
  </div>
  <div id="logList" style="padding: 20px; max-height: 400px; overflow-y: auto;"></div>
</div>

<div id="selectionScreen">
  <h1>Eli's Proxies</h1>
  <div class="blocker-grid" id="grid"></div>
  <div class="blocker-card" style="margin-top: 20px; width: 100%; max-width: 300px;" onclick="selectBlocker('All')">View All</div>
</div>

<div class="app-container" id="app">
  <div class="header">
    <div class="header-top">
      <button onclick="location.reload()" style="background:none; border:1px solid var(--border); color:white; padding:5px 15px; border-radius:15px; cursor:pointer;">← Back</button>
      <div class="settings-dropdown">
        <div id="discordNudge">Join the Discord!</div>
        <div class="gear-icon" onclick="toggleSettings()">⚙</div>
        <div id="settingsMenu" class="settings-menu">
          <div class="menu-item" onclick="openWindow('logWindow'); showLogs();">📜 Logs</div>
          <div class="menu-item" onclick="toggleThemes()">🎨 Themes</div>
          <div id="themeList" style="display:none; padding:5px; border-left: 2px solid var(--border); margin-bottom:10px;">
              <div class="menu-item" onclick="setTheme('liquid')">Liquid Glass</div>
              <div class="menu-item" onclick="setTheme('cyberpunk')">Cyberpunk</div>
              <div class="menu-item" onclick="setTheme('gold')">Gold</div>
              <div class="menu-item" onclick="setTheme('dracula')">Dracula</div>
              <div class="menu-item" onclick="setTheme('dark')">Dark</div>
          </div>
          <div class="menu-item" onclick="openWindow('adminPanel')">🔑 Admin</div>
          <a href="https://discord.gg/hns6EJVZ3k" target="_blank">
            <div class="menu-item discord-btn-highlight">💬 Join Discord</div>
          </a>
        </div>
      </div>
    </div>
    <input type="text" id="search" class="search-bar" placeholder="Search proxies...">
  </div>
  <div id="posts"></div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
  const supabase = createClient('https://saauhuiruadqjogzughm.supabase.co', 'sb_publishable_u2yOKUXvz3qjRMOZt55-3Q_FGBN6b-F');

  // --- PARTICLE BACKGROUND ---
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.onresize = resize; resize();

  class Particle {
    constructor() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.size = Math.random() * 2 + 1;
      this.speedX = Math.random() * 1 - 0.5;
      this.speedY = Math.random() * 1 - 0.5;
    }
    update() {
      this.x += this.speedX; this.y += this.speedY;
      if (this.x > canvas.width) this.x = 0; if (this.x < 0) this.x = canvas.width;
      if (this.y > canvas.height) this.y = 0; if (this.y < 0) this.y = canvas.height;
    }
    draw() {
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent');
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
    }
  }
  for(let i=0; i<70; i++) particles.push(new Particle());
  function animate() {
    ctx.clearRect(0,0,canvas.width, canvas.height);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animate);
  }
  animate();

  // --- DRAGGABLE ENGINE ---
  window.openWindow = (id) => document.getElementById(id).style.display = 'block';
  window.closeWindow = (id) => document.getElementById(id).style.display = 'none';

  document.querySelectorAll(".draggable-window").forEach(win => {
    let pos1=0, pos2=0, pos3=0, pos4=0;
    const header = win.querySelector(".window-header");
    header.onmousedown = (e) => {
      pos3 = e.clientX; pos4 = e.clientY;
      document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
      document.onmousemove = (e) => {
        pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
        pos3 = e.clientX; pos4 = e.clientY;
        win.style.top = (win.offsetTop - pos2) + "px";
        win.style.left = (win.offsetLeft - pos1) + "px";
      };
    };
  });

  // --- UI EXTRAS ---
  window.toggleSettings = () => document.getElementById('settingsMenu').classList.toggle('show');
  window.toggleThemes = () => {
    const tl = document.getElementById('themeList');
    tl.style.display = tl.style.display === 'none' ? 'block' : 'none';
  };
  window.setTheme = (t) => { document.documentElement.setAttribute('data-theme', t); localStorage.setItem('theme', t); };
  setTheme(localStorage.getItem('theme') || 'dark');

  // Discord Nudge (2 min)
  setInterval(() => {
    const nudge = document.getElementById('discordNudge');
    nudge.style.display = 'block';
    setTimeout(() => nudge.style.display = 'none', 5000);
  }, 120000);

  // Confetti
  window.triggerConfetti = () => {
    for(let i=0; i<40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.top = '-10px';
      c.style.backgroundColor = ['#ff007f','#00ffcc','#89b4fa','#f9e2af'][Math.floor(Math.random()*4)];
      document.body.appendChild(c);
      c.animate([{top:'-10px'}, {top:'100vh', transform:`rotate(${Math.random()*360}deg)`}], {duration: 2000});
      setTimeout(() => c.remove(), 2000);
    }
  };

  // --- APP LOGIC ---
  const blockers = ["Linewize", "Securly", "Palo_alto", "Blocksi", "Goguardian", "Fortiguard"];
  let activeBlocker = null;

  blockers.forEach(b => {
    const div = document.createElement('div');
    div.className = 'blocker-card';
    div.textContent = b.replace('_', ' ');
    div.onclick = () => selectBlocker(b);
    document.getElementById('grid').appendChild(div);
  });

  window.selectBlocker = (b) => {
    activeBlocker = b;
    document.getElementById('selectionScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    fetchPosts();
  }

  window.fetchPosts = async () => {
    let q = supabase.from('posts').select('*');
    if(activeBlocker !== 'All') q = q.eq('blocker', activeBlocker);
    const { data } = await q.order('created_at', {ascending: false});
    document.getElementById('posts').innerHTML = data.map(p => `
      <div class="post-card">
        <div style="color:var(--accent); font-weight:bold;">${p.author}</div>
        <div style="margin:10px 0;">${p.content}</div>
        <button onclick="likePost('${p.id}')" style="background:none; border:1px solid var(--border); color:white; cursor:pointer; border-radius:10px; padding:5px 10px;">👍 ${p.likes || 0}</button>
      </div>
    `).join('');
  }

  window.likePost = async (id) => {
    triggerConfetti();
    const { data } = await supabase.from('posts').select('likes').eq('id', id).single();
    await supabase.from('posts').update({likes: (data.likes || 0) + 1}).eq('id', id);
    fetchPosts();
  }

  // --- ADMIN RESTORED ---
  window.switchTab = (t) => {
    document.querySelectorAll('.admin-tab').forEach(el => el.classList.remove('active'));
    document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active');
    ['panePost', 'paneLog', 'paneBanner'].forEach(p => document.getElementById(p).style.display = 'none');
    document.getElementById('pane'+t.charAt(0).toUpperCase()+t.slice(1)).style.display = 'block';
  }

  window.loginAction = () => {
    if(document.getElementById('adminPassword').value === 'EISisBetterForever') {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('adminContent').style.display = 'block';
    }
  }

  window.showLogs = async () => {
    const { data } = await supabase.from('logs').select('*').order('created_at', {ascending: false});
    document.getElementById('logList').innerHTML = data.map(l => `
      <div style="margin-bottom:15px; border-bottom:1px solid var(--border); padding-bottom:5px;">
        <div style="color:var(--accent); font-weight:bold;">${l.heading}</div>
        <div style="font-size:0.85rem;">${l.body}</div>
      </div>
    `).join('');
  }
</script>
</body>
</html>
