<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eli's Proxies</title>
<link rel="icon" type="image/png" href="https://elis-proxies.odoo.com/web/image/website/1/logo/Eli%27s%20Proxies?unique=7b51271.png">

<style>
  :root {
    --bg-dark: #1e1e2e;
    --bg-sidebar: #181825;
    --bg-card: #313244;
    --text-main: #cdd6f4;
    --text-muted: #a6adc8;
    --accent: #89b4fa;
    --accent-hover: #b4befe;
    --red: #f38ba8;
    --green: #a6e3a1;
    --yellow: #f9e2af;
  }

  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; background: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; }

  /* Toast Notification */
  #toast {
    position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
    padding: 12px 25px; border-radius: 12px; color: #11111b; font-weight: bold;
    z-index: 9999; transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px;
  }
  #toast.show { top: 30px; }

  #selectionScreen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; background: radial-gradient(circle at center, #24273a 0%, #1e1e2e 100%);
  }

  .blocker-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; max-width: 1000px; margin-top: 30px; }
  .blocker-card {
    background: var(--bg-card); border: 1px solid #45475a; padding: 25px;
    border-radius: 15px; cursor: pointer; transition: 0.3s; font-weight: bold;
    min-width: 160px; text-align: center;
  }
  .blocker-card.all-card { border: 2px solid var(--accent); color: var(--accent); }
  .blocker-card:hover { transform: translateY(-5px); background: var(--accent); color: var(--bg-dark); }

  .app-container { display: none; width: 100%; height: 100%; flex-direction: column; }
  main { flex: 1; display: flex; flex-direction: column; background: var(--bg-dark); position: relative; }

  .header { padding: 20px 40px; border-bottom: 1px solid #313244; display: flex; justify-content: space-between; align-items: center; background: var(--bg-sidebar); }
  .branding-area h1 { margin: 0; font-size: 0.8rem; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
  .branding-area h2 { margin: 0; font-size: 1.6rem; color: white; }
  .change-blocker-link { color: var(--text-muted); font-size: 0.75rem; text-decoration: underline; cursor: pointer; background: none; border: none; margin-top: 5px; }

  .header-actions { display: flex; gap: 10px; }
  .btn-outline { background:none; border:2px solid var(--text-muted); color:var(--text-muted); border-radius:25px; padding:8px 18px; cursor:pointer; font-weight:bold; transition: 0.2s; }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

  #posts { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .post-card { background: var(--bg-card); padding: 25px; border-radius: 16px; border-left: 6px solid var(--accent); width: 100%; max-width: 800px; position: relative; }

  .post-meta { margin-bottom: 12px; }
  .meta-top { display: flex; justify-content: space-between; font-size: 0.85rem; }
  .post-author { color: var(--accent); font-weight: 800; }
  .post-unblocked-list { font-size: 0.75rem; color: var(--green); margin-top: 5px; font-weight: 600; font-family: monospace; }
  .post-content { white-space: pre-wrap; line-height: 1.5; font-size: 1.1rem; margin-bottom: 10px; }

  /* Admin Buttons - Moved to bottom right */
  .admin-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; border-top: 1px solid #45475a; padding-top: 10px; }
  .small-action { background: #1e1e2e; border: 1px solid #45475a; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
  .small-action:hover { border-color: var(--accent); background: #313244; }
  .del-action:hover { border-color: var(--red); color: var(--red); }

  /* Admin Panel */
  #adminPanel { display: none; position: fixed; bottom: 30px; right: 30px; width: 450px; background: var(--bg-card); border: 1px solid #45475a; padding: 25px; border-radius: 20px; z-index: 5000; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
  .admin-tabs { display: flex; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid #45475a; }
  .tab-btn { background: none; border: none; color: var(--text-muted); padding: 10px; cursor: pointer; font-weight: bold; }
  .tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
  input, textarea { width: 100%; padding: 12px; background: var(--bg-dark); border: 1px solid #45475a; color: white; border-radius: 8px; margin-bottom: 10px; font-family: inherit; }

  #adminBlockerButtons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 15px; }
  .admin-pill { padding: 8px 2px; border-radius: 6px; background: #45475a; color: var(--text-muted); font-size: 0.7rem; cursor: pointer; text-align: center; }
  .admin-pill.selected { background: var(--accent); color: var(--bg-dark); }

  /* Log Viewer */
  .log-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; z-index: 2000; overflow-y: auto; padding: 60px 20px; }
  .log-container { max-width: 600px; margin: 0 auto; background: var(--bg-sidebar); border-radius: 20px; padding: 30px; border: 1px solid #45475a; position: relative; }
  .log-entry { border-bottom: 1px solid #313244; padding: 20px 0; position: relative; }
  .log-entry h4 { color: var(--accent); margin: 0 0 5px 0; }
</style>
</head>
<body>

<div id="toast"></div>

<div id="selectionScreen">
  <h1 style="color: white; font-size: 2.2rem; margin-bottom: 10px;">Eli's Proxies</h1>
  <div class="blocker-grid" id="gridContainer"></div>
</div>

<div class="app-container" id="appContainer">
  <main>
    <div class="header">
      <div class="branding-area">
        <h1>Eli's Proxies</h1>
        <h2 id="currentBlocker">Feed</h2>
        <button class="change-blocker-link" id="changeBlockerBtn">← Change Blocker</button>
      </div>
      <div class="header-actions">
        <button id="viewLogs" class="btn-outline">Update Log</button>
        <button id="refreshBtn" class="btn-outline">↻ Refresh</button>
        <button id="showAdmin" class="btn-outline">Admin</button>
      </div>
    </div>
    <div id="posts"></div>
  </main>
</div>

<div id="logOverlay" class="log-overlay">
  <div class="log-container">
    <button onclick="document.getElementById('logOverlay').style.display='none'" style="float:right; background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">&times;</button>
    <h2 style="margin-top:0">System Logs</h2>
    <div id="logList"></div>
  </div>
</div>

<div id="adminPanel">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <h3 id="adminPanelTitle" style="margin:0; color:var(--accent);">Admin Panel</h3>
    <button id="closeAdmin" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:1.5rem;">&times;</button>
  </div>

  <div id="loginSection">
    <input type="password" id="adminPassword" placeholder="Enter Admin Password">
    <button id="loginBtn" style="width:100%; padding:12px; background:var(--accent); border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Unlock</button>
  </div>

  <div id="adminContent" style="display:none;">
    <div class="admin-tabs">
      <button class="tab-btn active" id="tabPostsBtn">New Post</button>
      <button class="tab-btn" id="tabLogsBtn">New Log</button>
    </div>

    <div id="adminTabPosts">
      <input type="text" id="postAuthor" placeholder="Author">
      <textarea id="postText" rows="3" placeholder="Message content..."></textarea>
      <div id="adminBlockerButtons"></div>
      <button id="publishBtn" style="width:100%; padding:12px; background:var(--accent); border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Post Everywhere</button>
    </div>

    <div id="adminTabLogs" style="display:none;">
      <input type="text" id="logHeading" placeholder="Log Title">
      <textarea id="logBody" rows="4" placeholder="Update description..."></textarea>
      <button id="publishLogBtn" style="width:100%; padding:12px; background:var(--green); border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Add to Logs</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient('https://saauhuiruadqjogzughm.supabase.co', 'sb_publishable_u2yOKUXvz3qjRMOZt55-3Q_FGBN6b-F');

const blockers = ["Linewize", "Securly", "Palo_alto", "Blocksi", "Aristotle", "Lightspeed", "Contentkeeper", "Lanschool", "Goguardian", "Fortiguard", "Cisco_talos", "Deledao"];
let selectedBlocker = localStorage.getItem('eli_selected_blocker');
let isAdmin = false;

function showNotice(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = type === 'success' ? 'var(--green)' : 'var(--red)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

const grid = document.getElementById('gridContainer');
const adminPills = document.getElementById('adminBlockerButtons');

const allBtn = document.createElement('div');
allBtn.className = 'blocker-card all-card';
allBtn.textContent = 'All Blockers';
allBtn.onclick = () => selectBlocker('All');
grid.appendChild(allBtn);

blockers.forEach(b => {
  const card = document.createElement('div');
  card.className = 'blocker-card'; card.textContent = b; card.onclick = () => selectBlocker(b);
  grid.appendChild(card);
  const pill = document.createElement('div');
  pill.className = 'admin-pill'; pill.textContent = b; pill.onclick = () => pill.classList.toggle('selected');
  pill.dataset.value = b; adminPills.appendChild(pill);
});

function selectBlocker(name) {
  selectedBlocker = name;
  localStorage.setItem('eli_selected_blocker', name);
  document.getElementById('selectionScreen').style.display = 'none';
  document.getElementById('appContainer').style.display = 'flex';
  document.getElementById('currentBlocker').textContent = name;
  fetchPosts();
}

async function fetchPosts() {
  const postsDiv = document.getElementById('posts');
  let query = supabase.from('posts').select('*');
  if (selectedBlocker !== "All") query = query.eq('blocker', selectedBlocker);
  const { data } = await query.order('created_at', { ascending: false });
  if (!data) return;

  const grouped = [];
  data.forEach(item => {
    const ex = grouped.find(g => g.content === item.content && g.author === item.author);
    if (ex) { if (!ex.blockers.includes(item.blocker)) ex.blockers.push(item.blocker); }
    else { grouped.push({ ...item, blockers: [item.blocker] }); }
  });

  postsDiv.innerHTML = grouped.map(p => {
    const list = p.blockers.map(b => b.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())).join(', ');
    const label = (selectedBlocker === "All") ? `<div class="post-unblocked-list">Unblocked for: ${list}</div>` : '';
    const adminControls = isAdmin ? `<div class="admin-btns">
      <button class="small-action" onclick="editPost('${p.content.replace(/'/g, "\\'")}')">✎ Edit</button>
      <button class="small-action del-action" onclick="deletePost('${p.content.replace(/'/g, "\\'")}')">🗑 Delete</button>
    </div>` : '';
    return `<div class="post-card">
      <div class="post-meta"><div class="meta-top"><div class="post-author">By: ${p.author}</div><div>${new Date(p.created_at).toLocaleDateString()}</div></div>${label}</div>
      <div class="post-content">${p.content}</div>
      ${adminControls}
    </div>`;
  }).join('');
}

async function fetchLogs() {
  const { data } = await supabase.from('logs').select('*').order('created_at', { ascending: false });
  const list = document.getElementById('logList');
  list.innerHTML = data.map(l => `
    <div class="log-entry">
      <h4>${l.heading}</h4><p>${l.body}</p>
      ${isAdmin ? `<div class="admin-btns" style="border:none; padding:0; margin-top:5px;"><button class="small-action del-action" onclick="deleteLog(${l.id})">🗑 Delete Log</button></div>` : ''}
    </div>
  `).join('');
}

window.deletePost = async (content) => {
  const { error } = await supabase.from('posts').delete().eq('content', content);
  if (!error) { showNotice("Post Wiped Everywhere"); fetchPosts(); }
};

window.editPost = (content) => {
  document.getElementById('adminPanel').style.display='block';
  document.getElementById('postText').value = content;
  document.getElementById('tabPostsBtn').click();
  showNotice("Content loaded into editor");
};

window.deleteLog = async (id) => {
  const { error } = await supabase.from('logs').delete().eq('id', id);
  if (!error) { showNotice("Log Deleted"); fetchLogs(); }
};

const attemptLogin = () => {
  if (document.getElementById('adminPassword').value === 'EISisBetterForever') {
    isAdmin = true;
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('adminContent').style.display = 'block';
    showNotice("Admin Mode On"); fetchPosts();
  } else { showNotice("Invalid Password", "error"); }
};

document.getElementById('loginBtn').onclick = attemptLogin;
document.getElementById('adminPassword').onkeypress = (e) => { if(e.key==='Enter') attemptLogin(); };

document.getElementById('publishBtn').onclick = async () => {
  const text = document.getElementById('postText').value;
  const pills = document.querySelectorAll('.admin-pill.selected');
  if(!text || pills.length === 0) return showNotice("Missing fields", "error");
  for (const p of pills) await supabase.from('posts').insert([{ blocker: p.dataset.value, content: text, author: document.getElementById('postAuthor').value || 'Admin' }]);
  document.getElementById('postText').value = ''; showNotice("Success"); fetchPosts();
};

document.getElementById('publishLogBtn').onclick = async () => {
  const heading = document.getElementById('logHeading').value;
  const body = document.getElementById('logBody').value;
  if(!heading || !body) return showNotice("Fill logs", "error");
  await supabase.from('logs').insert([{ heading, body }]);
  document.getElementById('logHeading').value = ''; document.getElementById('logBody').value = '';
  showNotice("Update Published"); fetchLogs();
};

document.getElementById('tabPostsBtn').onclick = () => {
  document.getElementById('adminTabPosts').style.display='block'; document.getElementById('adminTabLogs').style.display='none';
  document.getElementById('tabPostsBtn').classList.add('active'); document.getElementById('tabLogsBtn').classList.remove('active');
};
document.getElementById('tabLogsBtn').onclick = () => {
  document.getElementById('adminTabPosts').style.display='none'; document.getElementById('adminTabLogs').style.display='block';
  document.getElementById('tabLogsBtn').classList.add('active'); document.getElementById('tabPostsBtn').classList.remove('active');
};

document.getElementById('showAdmin').onclick = () => document.getElementById('adminPanel').style.display='block';
document.getElementById('closeAdmin').onclick = () => document.getElementById('adminPanel').style.display='none';
document.getElementById('viewLogs').onclick = () => { document.getElementById('logOverlay').style.display='block'; fetchLogs(); };
document.getElementById('changeBlockerBtn').onclick = () => { localStorage.removeItem('eli_selected_blocker'); location.reload(); };
document.getElementById('refreshBtn').onclick = () => { fetchPosts(); showNotice("Refreshed"); };

if (selectedBlocker) selectBlocker(selectedBlocker);
</script>
</body>
</html>
