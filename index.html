<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blocker Posts</title>
<style>
  :root {
    --bg-dark: #1e1e2e;
    --bg-sidebar: #181825;
    --bg-card: #313244;
    --text-main: #cdd6f4;
    --text-muted: #a6adc8;
    --accent: #89b4fa;
    --accent-hover: #b4befe;
    --red: #f38ba8;
    --red-hover: #e06c75;
  }

  * { box-sizing: border-box; }

  body { 
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
    margin: 0; background-color: var(--bg-dark); color: var(--text-main);
    display: flex; height: 100vh; overflow: hidden;
  }

  .app-container { display: flex; width: 100%; height: 100%; }

  aside {
    width: 260px; background-color: var(--bg-sidebar); border-right: 1px solid #313244;
    padding: 20px; display: flex; flex-direction: column; overflow-y: auto;
  }

  #blockerSelection { display: flex; flex-direction: column; gap: 8px; }

  #blockerSelection button {
    background: transparent; border: none; color: var(--text-muted);
    text-align: left; padding: 10px 15px; border-radius: 8px; cursor: pointer;
    transition: 0.2s;
  }

  #blockerSelection button:hover { background-color: var(--bg-card); color: var(--text-main); }
  #blockerSelection button:focus { background-color: var(--accent); color: var(--bg-dark); font-weight: bold; }

  main { flex: 1; display: flex; flex-direction: column; position: relative; }

  .header {
    padding: 15px 30px; border-bottom: 1px solid #313244;
    display: flex; justify-content: space-between; align-items: center;
    background: var(--bg-dark); z-index: 10;
  }

  #posts { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }

  .post-card {
    background-color: var(--bg-card); padding: 15px 20px; border-radius: 12px;
    border-left: 4px solid var(--accent); position: relative;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }

  .post-author { font-size: 0.75rem; color: var(--accent); font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }

  /* CRITICAL: This allows multi-line text to display correctly */
  .post-content { 
    white-space: pre-wrap; 
    word-wrap: break-word; 
    line-height: 1.5;
  }

  .delete-btn {
    position: absolute; top: 12px; right: 12px;
    background: rgba(243, 139, 168, 0.1); color: var(--red); border: 1px solid var(--red);
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: 0.2s; font-size: 1.1rem;
  }

  .delete-btn:hover { background: var(--red); color: var(--bg-dark); }

  #adminPanel {
    display: none; position: fixed; bottom: 20px; right: 20px;
    width: 380px; background-color: var(--bg-card); border: 1px solid #45475a;
    padding: 25px; border-radius: 16px; z-index: 100; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  #adminPanel input, #adminPanel textarea {
    width: 100%; background-color: var(--bg-dark); border: 1px solid #45475a;
    color: white; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-family: inherit;
  }

  #blockerCheckboxes {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    background: var(--bg-dark); padding: 10px; border-radius: 8px;
    max-height: 120px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #45475a;
  }

  #blockerCheckboxes label { font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; }
  #blockerCheckboxes input { width: auto !important; margin-right: 8px !important; margin-bottom: 0 !important; }

  .btn-primary {
    width: 100%; padding: 12px; background: var(--accent); border: none; 
    border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s;
  }
  .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
</style>
</head>
<body>

<div class="app-container">
  <aside>
    <h2 style="color: var(--accent); font-size: 1rem; letter-spacing: 2px; text-align: center;">BLOCKERS</h2>
    <div id="blockerSelection">
      <button>Linewize</button><button>Securly</button><button>Palo_alto</button>
      <button>Blocksi</button><button>Aristotle</button><button>Lightspeed</button>
      <button>Contentkeeper</button><button>Lanschool</button><button>Goguardian</button>
      <button>Fortiguard</button><button>Cisco_talos</button><button>Deledao</button>
    </div>
  </aside>

  <main>
    <div class="header">
      <h2 id="currentBlocker" style="margin:0;">Select a Feed</h2>
      <button id="showAdmin" style="background:none; border:1px solid var(--text-muted); color:var(--text-muted); border-radius:20px; padding:6px 18px; cursor:pointer; font-size: 0.8rem;">Admin Panel</button>
    </div>
    <div id="posts"></div>
  </main>
</div>

<div id="adminPanel">
  <div style="display:flex; justify-content:space-between; align-items: center; margin-bottom:20px;">
    <h3 style="margin:0; color:var(--accent);">Admin Tools</h3>
    <button id="closeAdmin" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:1.5rem;">&times;</button>
  </div>
  
  <div id="loginSection">
    <input type="password" id="adminPassword" placeholder="Enter Password..."/>
    <button id="loginBtn" class="btn-primary">Unlock</button>
  </div>

  <div id="adminContent" style="display:none;">
    <input type="text" id="postAuthor" placeholder="By: (Name)">
    <textarea id="postText" rows="5" placeholder="Write message... (Enter works for new lines)"></textarea>
    <div id="blockerCheckboxes">
      <label><input type="checkbox" value="Linewize"> Linewize</label>
      <label><input type="checkbox" value="Securly"> Securly</label>
      <label><input type="checkbox" value="Palo_alto"> Palo_alto</label>
      <label><input type="checkbox" value="Blocksi"> Blocksi</label>
      <label><input type="checkbox" value="Aristotle"> Aristotle</label>
      <label><input type="checkbox" value="Lightspeed"> Lightspeed</label>
      <label><input type="checkbox" value="Contentkeeper"> Contentkeeper</label>
      <label><input type="checkbox" value="Lanschool"> Lanschool</label>
      <label><input type="checkbox" value="Goguardian"> Goguardian</label>
      <label><input type="checkbox" value="Fortiguard"> Fortiguard</label>
      <label><input type="checkbox" value="Cisco_talos"> Cisco_talos</label>
      <label><input type="checkbox" value="Deledao"> Deledao</label>
    </div>
    <button id="publishBtn" class="btn-primary">Broadcast Post</button>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabaseUrl = 'https://saauhuiruadqjogzughm.supabase.co'
const supabaseKey = 'sb_publishable_u2yOKUXvz3qjRMOZt55-3Q_FGBN6b-F'
const supabase = createClient(supabaseUrl, supabaseKey)

let selectedBlocker = null;
let isAdmin = false;

function linkify(text) {
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  return text.replace(urlRegex, url => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
}

document.getElementById('adminPassword').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});

document.querySelectorAll('#blockerSelection button').forEach(btn => {
  btn.addEventListener('click', () => {
    selectedBlocker = btn.textContent;
    document.getElementById('currentBlocker').textContent = selectedBlocker + " Feed";
    fetchPosts();
  });
});

async function fetchPosts() {
  if (!selectedBlocker) return;
  const { data, error } = await supabase.from('posts').select('*').eq('blocker', selectedBlocker).order('created_at', { ascending: true });
  if (error) console.error(error);
  
  const postsDiv = document.getElementById('posts');
  postsDiv.innerHTML = data.map(p => `
    <div class="post-card">
      <div class="post-author">By: ${p.author || 'Anonymous'}</div>
      <div class="post-content">${linkify(p.content)}</div>
      ${isAdmin ? `<button class="delete-btn" title="Delete Post" onclick="deletePost(${p.id})">🗑</button>` : ''}
    </div>
  `).join('');
}

window.deletePost = async (id) => {
  if (!confirm('Permanently delete this post?')) return;
  const { error } = await supabase.from('posts').delete().eq('id', id);
  if (error) alert('Delete failed.');
  else fetchPosts();
};

document.getElementById('showAdmin').addEventListener('click', () => document.getElementById('adminPanel').style.display = 'block');
document.getElementById('closeAdmin').addEventListener('click', () => document.getElementById('adminPanel').style.display = 'none');

document.getElementById('loginBtn').addEventListener('click', () => {
  if (document.getElementById('adminPassword').value === 'EISisBetterForever') {
    isAdmin = true;
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('adminContent').style.display = 'block';
    fetchPosts(); 
  } else {
    alert('Invalid Credentials');
  }
});

document.getElementById('publishBtn').addEventListener('click', async () => {
  const text = document.getElementById('postText').value; // Keep original formatting
  const author = document.getElementById('postAuthor').value.trim() || 'Anonymous';
  const checkboxes = document.querySelectorAll('#blockerCheckboxes input:checked');
  
  if (!text.trim() || checkboxes.length === 0) return alert('Fill fields first.');

  for (const cb of checkboxes) {
    await supabase.from('posts').insert([{ blocker: cb.value, content: text, author: author }]);
  }
  document.getElementById('postText').value = '';
  fetchPosts();
});

setInterval(fetchPosts, 5000);
</script>

</body>
</html>
