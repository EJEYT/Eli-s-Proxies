    [data-theme="light"] { --bg-dark: #eff1f5; --bg-sidebar: #e6e9ef; --bg-card: #ffffff; --text-main: #4c4f69; --text-muted: #6c6f85; --accent: #1e66f5; --border: #ccd0da; }
    [data-theme="emerald"] { --bg-dark: #06120e; --bg-sidebar: #0a1a15; --bg-card: #122a22; --text-main: #ecfdf5; --text-muted: #6ee7b7; --accent: #10b981; --border: #065f46; }
    [data-theme="rose"] { --bg-dark: #1a1012; --bg-sidebar: #24181a; --bg-card: #3d2b2e; --text-main: #fff1f2; --text-muted: #fda4af; --accent: #f43f5e; --border: #9f1239; }
    [data-theme="cyberpunk"] { --bg-dark: #000b1e; --bg-sidebar: #00162d; --bg-card: #002244; --text-main: #00ffcc; --text-muted: #fdee00; --accent: #ff007f; --border: #00ffcc; }
    [data-theme="forest"] { --bg-dark: #0b120b; --bg-sidebar: #131d13; --bg-card: #1b2b1b; --text-main: #d4e4d4; --text-muted: #7da17d; --accent: #4caf50; --border: #2e442e; }
    [data-theme="lava"] { --bg-dark: #0d0000; --bg-sidebar: #1a0000; --bg-card: #2d0000; --text-main: #ffd1d1; --text-muted: #ff6b6b; --accent: #ff4500; --border: #4d0000; }
    [data-theme="dracula"] { --bg-dark: #282a36; --bg-sidebar: #1e1f29; --bg-card: #44475a; --text-main: #f8f8f2; --text-muted: #6272a4; --accent: #bd93f9; --border: #bd93f9; }
    [data-theme="sakura"] { --bg-dark: #fff5f7; --bg-sidebar: #ffe0e9; --bg-card: #ffffff; --text-main: #d01d56; --text-muted: #f1a7bb; --accent: #ff8fa3; --border: #ffcad4; }
    [data-theme="synthwave"] { --bg-dark: #241744; --bg-sidebar: #2d1b5a; --bg-card: #37246e; --text-main: #fede5d; --text-muted: #ff7edb; --accent: #2de2e6; --border: #72f1b8; }
    [data-theme="ghost"] { --bg-dark: #f0f2f5; --bg-sidebar: #ffffff; --bg-card: #ffffff; --text-main: #2c3e50; --text-muted: #95a5a6; --accent: #34495e; --border: #dcdde1; }
    [data-theme="gold"] { --bg-dark: #0a0a0a; --bg-sidebar: #141414; --bg-card: #1a1a1a; --text-main: #ffffff; --text-muted: #888888; --accent: #d4af37; --border: #333333; }
    [data-theme="ocean"] { --bg-dark: #0f172a; --bg-sidebar: #1e293b; --bg-card: #334155; --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #38bdf8; --border: #475569; }
    [data-theme="midnight"] { --bg-dark: #020617; --bg-sidebar: #0f172a; --bg-card: #1e293b; --text-main: #f1f5f9; --text-muted: #64748b; --accent: #6366f1; --border: #334155; }
    [data-theme="coffee"] { --bg-dark: #1c1917; --bg-sidebar: #292524; --bg-card: #44403c; --text-main: #fafaf9; --text-muted: #a8a29e; --accent: #d97706; --border: #57534e; }
    [data-theme="nebula"] { --bg-dark: #09090b; --bg-sidebar: #18181b; --bg-card: #27272a; --text-main: #fafafa; --text-muted: #a1a1aa; --accent: #d946ef; --border: #3f3f46; }

    [data-theme="liquid"] { 
      --bg-dark: linear-gradient(-45deg, #0f172a, #1e293b, #082f49, #0f172a); 
      --bg-animate: gradientMove 15s ease infinite;
      --bg-sidebar: rgba(255, 255, 255, 0.08);

    @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    * { box-sizing: border-box; transition: background 0.3s, color 0.3s, border 0.3s; }
    *::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }

    body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; background: var(--bg-dark); background-size: 400% 400%; animation: var(--bg-animate); color: var(--text-main); height: 100vh; overflow: hidden; }

    /* Particles Background */

    .header { padding: 15px 25px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; background: var(--bg-sidebar); z-index: 10; backdrop-filter: blur(var(--glass-blur)); position: relative; gap: 10px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .header-bottom { display: flex; gap: 10px; width: 100%; align-items: center; }

    .search-bar { flex: 1; padding: 10px 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 30px; color: var(--text-main); outline: none; backdrop-filter: blur(var(--glass-blur)); }

    .filter-pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
    .filter-pill { padding: 6px 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; font-size: 0.75rem; cursor: pointer; white-space: nowrap; font-weight: bold; color: var(--text-muted); }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

    .gear-icon:hover { color: var(--accent); transform: rotate(45deg); }
    
    /* Discord Nudge Style */
    #discordNudge { position: absolute; right: 45px; top: 5px; background: #5865F2; color: white; padding: 8px 14px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; white-space: nowrap; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1000; }

    .settings-menu { display: none; position: absolute; right: 0; top: 50px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; width: 240px; padding: 10px; z-index: 100; box-shadow: 0 15px 35px rgba(0,0,0,0.4); backdrop-filter: blur(30px); max-height: 80vh; overflow-y: auto; }
    .settings-menu.show { display: block; }
    .menu-item { padding: 12px; border-radius: 10px; cursor: pointer; font-size: 0.9rem; font-weight: bold; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }
    .menu-item:hover { background: rgba(255,255,255,0.1); color: var(--accent); }
    
    /* Join Discord Button Glow */

    @keyframes discordPulse { 0% { box-shadow: 0 0 0px #5865F2; } 50% { box-shadow: 0 0 12px #5865F2; } 100% { box-shadow: 0 0 0px #5865F2; } }

    /* Draggable Logic Helpers */

    .panel { display: none; position: fixed; bottom: 30px; right: 30px; width: 420px; max-width: calc(100% - 60px); background: var(--bg-card); border: 1px solid var(--border); padding: 25px; border-radius: 24px; z-index: 15000; box-shadow: 0 20px 50px rgba(0,0,0,0.5); backdrop-filter: blur(40px); }

    .admin-primary-btn { width: 100%; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 8px; transition: 0.2s; }

    .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:50000; backdrop-filter: blur(8px); align-items:center; justify-content:center; }
    .modal-content { background: var(--bg-card); padding: 30px; border-radius: 24px; width: 90%; max-width: 400px; border: 1px solid var(--border); }
  </style>
</head>
<body>

<canvas id="particleCanvas"></canvas>
<div id="toast"></div>
<div id="announcementBanner"></div>

<div id="requestModal" class="modal-overlay">
  <div class="modal-content" id="requestModalContent" style="position: relative;">

      <div id="adminBlockerButtons" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px;"></div>

<div id="selectionScreen">
  <h1 style="color: var(--text-main); font-size: 2.5rem; margin-bottom: 8px; letter-spacing: -1px;">Eli's Proxies</h1>

<div class="app-container" id="appContainer">
  <div class="header">

        <div style="display:flex; align-items:center; gap:15px;">
          <button onclick="goBackToSelection()" style="background:none; border:1px solid var(--border); color:var(--text-main); border-radius:25px; padding:8px 16px; cursor:pointer; font-weight:bold;">← Back</button>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
const supabase = createClient('https://saauhuiruadqjogzughm.supabase.co', 'sb_publishable_u2yOKUXvz3qjRMOZt55-3Q_FGBN6b-F');

// --- PARTICLE BACKGROUND ---
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let particles = [];
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.onresize = resize; resize();

class Particle {
  constructor() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 2 + 1;
    this.speedX = Math.random() * 1 - 0.5;
    this.speedY = Math.random() * 1 - 0.5;
  }
  update() {
    this.x += this.speedX; this.y += this.speedY;
    if (this.x > canvas.width) this.x = 0; if (this.x < 0) this.x = canvas.width;
    if (this.y > canvas.height) this.y = 0; if (this.y < 0) this.y = canvas.height;
  }
  draw() {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent');
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
  }
}
for(let i=0; i<70; i++) particles.push(new Particle());
function animate() {
  ctx.clearRect(0,0,canvas.width, canvas.height);
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(animate);
}
animate();

// --- DRAGGABLE ENGINE ---
function dragElement(elmnt) {
  let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
  const header = elmnt.querySelector(".draggable-header");
  if (header) { header.onmousedown = dragMouseDown; } else { elmnt.onmousedown = dragMouseDown; }

  function dragMouseDown(e) {
    e.preventDefault();
    pos3 = e.clientX; pos4 = e.clientY;
    document.onmouseup = closeDragElement;
    document.onmousemove = elementDrag;
  }

  function elementDrag(e) {
    e.preventDefault();
    pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
    pos3 = e.clientX; pos4 = e.clientY;
    elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
    elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
    elmnt.style.bottom = "auto"; elmnt.style.right = "auto";
  }

  function closeDragElement() {
    document.onmouseup = null;
    document.onmousemove = null;
  }
}
dragElement(document.getElementById("adminPanel"));
dragElement(document.getElementById("requestModalContent").parentElement);

// --- CONFETTI ENGINE ---
window.triggerConfetti = () => {
    for(let i=0; i<50; i++) {
        const c = document.createElement('div');
        c.className = 'confetti-piece';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.top = '-10px';
        c.style.backgroundColor = ['#89b4fa','#f38ba8','#a6e3a1','#f9e2af'][Math.floor(Math.random()*4)];
        document.body.appendChild(c);
        const anim = c.animate([{ top: '-10px', opacity: 1 }, { top: '100vh', opacity: 0, transform: `rotate(${Math.random()*360}deg)` }], { duration: Math.random() * 2000 + 1000 });
        anim.onfinish = () => c.remove();
    }
};

// --- DISCORD NUDGE ---
setInterval(() => {
    const nudge = document.getElementById('discordNudge');
    nudge.style.display = 'block';
    setTimeout(() => { nudge.style.display = 'none'; }, 6000);
}, 120000);

// --- THEMES & UI ---
window.setTheme = (t) => { document.documentElement.setAttribute('data-theme', t); localStorage.setItem('eli_theme', t); };
setTheme(localStorage.getItem('eli_theme') || 'dark');
window.toggleSettings = () => document.getElementById('settingsMenu').classList.toggle('show');
window.toggleThemeList = () => {
    const l = document.getElementById('themesSubList');
    l.style.display = l.style.display === 'none' ? 'flex' : 'none';
};

// --- DATABASE & LOGIC ---
const blockers = ["Linewize", "Securly", "Goguardian", "Fortiguard", "Blocksi"];
blockers.forEach(b => {
    const d = document.createElement('div');
    d.className = 'blocker-card'; d.textContent = b;
    d.onclick = () => selectBlocker(b);
    document.getElementById('gridContainer').appendChild(d);
});

window.selectBlocker = (name) => {
    document.getElementById('selectionScreen').style.display = 'none';
    document.getElementById('appContainer').style.display = 'flex';
    document.getElementById('currentBlocker').textContent = name;
    fetchPosts();
};

window.goBackToSelection = () => {
    document.getElementById('appContainer').style.display = 'none';
    document.getElementById('selectionScreen').style.display = 'flex';
};

window.fetchPosts = async () => {
    const { data } = await supabase.from('posts').select('*').order('created_at', {ascending: false});
    document.getElementById('posts').innerHTML = data.map(p => `
      <div class="post-card">
        <div class="post-author">${p.author}</div>
        <div class="post-content">${p.content}</div>
        <div style="margin-top:15px;">
            <button onclick="voteProxy('${p.id}')" style="background:none; border:1px solid var(--border); color:white; cursor:pointer; border-radius:15px; padding:5px 12px;">👍 ${p.likes || 0}</button>
        </div>
      </div>
    `).join('');
};

window.voteProxy = async (id) => {
    triggerConfetti();
    const { data } = await supabase.from('posts').select('likes').eq('id', id).single();
    await supabase.from('posts').update({ likes: (data.likes || 0) + 1 }).eq('id', id);
    fetchPosts();
};
</script>
</body>
</html>
