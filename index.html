<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eli's Proxies</title>
<link rel="icon" type="image/png" href="https://elis-proxies.odoo.com/web/image/website/1/logo/Eli%27s%20Proxies?unique=7b51271.png">

<style>
  :root {
    --bg-dark: #1e1e2e;
    --bg-sidebar: #181825;
    --bg-card: #313244;
    --text-main: #cdd6f4;
    --text-muted: #a6adc8;
    --accent: #89b4fa;
    --accent-hover: #b4befe;
    --red: #f38ba8;
    --green: #a6e3a1;
  }

  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; background: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; }

  #toast {
    position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
    padding: 12px 25px; border-radius: 12px; color: #11111b; font-weight: bold;
    z-index: 9999; transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px;
  }
  #toast.show { top: 30px; }

  #selectionScreen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; background: radial-gradient(circle at center, #24273a 0%, #1e1e2e 100%);
    overflow-y: auto; padding: 40px 20px;
  }

  .blocker-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; max-width: 1000px; margin-top: 30px; }
  .blocker-card {
    background: var(--bg-card); border: 1px solid #45475a; padding: 25px;
    border-radius: 15px; cursor: pointer; transition: 0.3s; font-weight: bold;
    min-width: 160px; text-align: center; color: var(--text-main);
  }
  .blocker-card:hover { transform: translateY(-5px); background: var(--accent); color: var(--bg-dark); }
  
  .all-card-wrapper { width: 100%; display: flex; justify-content: center; margin-top: 25px; }
  .all-card { min-width: 280px; font-size: 1.3rem; border: 1px solid #45475a; padding: 30px; }

  .app-container { display: none; width: 100%; height: 100%; flex-direction: column; }
  main { flex: 1; display: flex; flex-direction: column; background: var(--bg-dark); position: relative; overflow: hidden; }

  .header { padding: 15px 40px; border-bottom: 1px solid #313244; display: flex; justify-content: space-between; align-items: center; background: var(--bg-sidebar); gap: 20px; z-index: 10; }
  .branding-area { min-width: 150px; }
  .branding-area h1 { margin: 0; font-size: 0.75rem; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
  .branding-area h2 { margin: 0; font-size: 1.4rem; color: white; white-space: nowrap; }
  
  .search-container { flex: 1; max-width: 500px; position: relative; }
  .search-bar { 
    width: 100%; padding: 12px 15px 12px 45px; background: var(--bg-dark); 
    border: 1px solid #45475a; border-radius: 25px; color: white; 
    outline: none; transition: 0.3s; font-size: 1rem;
  }
  .search-bar:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }

  .header-actions { display: flex; gap: 10px; align-items: center; }
  .btn-outline { background:none; border:2px solid var(--text-muted); color:var(--text-muted); border-radius:25px; padding:8px 18px; cursor:pointer; font-weight:bold; transition: 0.2s; white-space: nowrap; }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

  #posts { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 20px; height: 100%; }
  .post-card { background: var(--bg-card); padding: 25px; border-radius: 16px; border-left: 6px solid var(--accent); width: 100%; max-width: 800px; position: relative; flex-shrink: 0; }
  .post-meta { margin-bottom: 12px; }
  .meta-top { display: flex; justify-content: space-between; font-size: 0.85rem; }
  .post-author { color: var(--accent); font-weight: 800; }
  .post-unblocked-list { font-size: 0.75rem; color: var(--green); margin-top: 5px; font-weight: 600; font-family: monospace; }
  .post-content { white-space: pre-wrap; line-height: 1.5; font-size: 1.1rem; margin-bottom: 10px; overflow-wrap: break-word; }
  .post-content a { color: var(--accent); text-decoration: underline; font-weight: 600; }

  .log-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 6000; overflow-y: auto; padding: 50px 20px; }
  .log-container { max-width: 600px; margin: 0 auto; background: var(--bg-sidebar); border-radius: 20px; padding: 30px; border: 1px solid #45475a; }

  #adminPanel { display: none; position: fixed; bottom: 30px; right: 30px; width: 450px; background: var(--bg-card); border: 1px solid #45475a; padding: 25px; border-radius: 20px; z-index: 5000; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
  .admin-input { width: 100%; padding: 14px; background: var(--bg-dark); border: 1px solid #45475a; color: white; border-radius: 10px; margin-bottom: 12px; font-family: inherit; font-size: 0.95rem; outline: none; }
  .admin-primary-btn { width: 100%; padding: 14px; background: var(--accent); color: var(--bg-dark); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem; margin-top: 5px; }

  #adminBlockerButtons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 15px; }
  .admin-pill { padding: 10px 2px; border-radius: 8px; background: #1e1e2e; border: 1px solid #45475a; color: var(--text-muted); font-size: 0.75rem; cursor: pointer; text-align: center; }
  .admin-pill.selected { background: var(--accent); color: var(--bg-dark); border-color: var(--accent); }

  .small-action { background: #1e1e2e; border: 1px solid #45475a; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
</style>
</head>
<body>

<div id="toast"></div>

<div id="selectionScreen">
  <h1 style="color: white; font-size: 2.2rem; margin-bottom: 10px;">Eli's Proxies</h1>
  <div class="blocker-grid" id="gridContainer"></div>
  <div class="all-card-wrapper">
    <div class="blocker-card all-card" onclick="selectBlocker('All')">All Proxies</div>
  </div>
</div>

<div class="app-container" id="appContainer">
  <main>
    <div class="header">
      <div class="branding-area">
        <h1>Eli's Proxies</h1>
        <h2 id="currentBlocker">Feed</h2>
        <button onclick="goBack()" class="btn-outline" style="font-size: 0.7rem; padding: 5px 12px; margin-top: 5px;">← Back</button>
      </div>
      <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-bar" placeholder="Search proxies or authors...">
      </div>
      <div class="header-actions">
        <button id="viewLogs" class="btn-outline">Update Log</button>
        <button id="refreshBtn" class="btn-outline">↻</button>
        <button id="showAdmin" class="btn-outline">Admin</button>
      </div>
    </div>
    <div id="posts"></div>
  </main>
</div>

<div id="logOverlay" class="log-overlay">
  <div class="log-container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h2 style="margin:0">System Logs</h2>
      <button onclick="document.getElementById('logOverlay').style.display='none'" class="btn-outline">Close</button>
    </div>
    <div id="logList">
      <p style="color:var(--text-muted)">Loading update history...</p>
    </div>
  </div>
</div>

<div id="adminPanel">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <h3 style="margin:0; color:var(--accent);" id="adminPanelTitle">Admin Panel</h3>
    <button id="closeAdmin" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:1.5rem;">&times;</button>
  </div>
  
  <div id="loginSection">
    <input type="password" id="adminPassword" class="admin-input" placeholder="Admin Password">
    <button id="loginBtn" class="admin-primary-btn">Unlock Admin</button>
  </div>

  <div id="adminContent" style="display:none;">
    <input type="text" id="postAuthor" class="admin-input" placeholder="Author Name">
    <textarea id="postText" class="admin-input" rows="4" placeholder="Proxy link..."></textarea>
    <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:8px;">Target Blockers:</div>
    <div id="adminBlockerButtons"></div>
    <button id="publishBtn" class="admin-primary-btn">Post Everywhere</button>
    <button id="cancelEditBtn" class="admin-primary-btn" style="display:none; background:#45475a; color:white; margin-top:10px;">Cancel Edit</button>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
const supabase = createClient('https://saauhuiruadqjogzughm.supabase.co', 'sb_publishable_u2yOKUXvz3qjRMOZt55-3Q_FGBN6b-F');

const blockers = ["Linewize", "Securly", "Palo_alto", "Blocksi", "Aristotle", "Lightspeed", "Contentkeeper", "Lanschool", "Goguardian", "Fortiguard", "Cisco_talos", "Deledao"];
let selectedBlocker = localStorage.getItem('eli_selected_blocker');

// SESSION STORAGE: Stays while navigating, dies on page refresh
let isAdmin = sessionStorage.getItem('eli_is_admin') === 'true'; 

let editingPostIds = [];

function showNotice(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = type === 'success' ? 'var(--green)' : 'var(--red)';
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
}

function linkify(text) {
  const urlPattern = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
  return text.replace(urlPattern, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
}

const grid = document.getElementById('gridContainer');
blockers.forEach(b => {
  const card = document.createElement('div');
  card.className = 'blocker-card';
  card.textContent = b.replace(/_/g, ' ');
  card.onclick = () => selectBlocker(b);
  grid.appendChild(card);
  
  const pill = document.createElement('div');
  pill.className = 'admin-pill'; pill.textContent = b.replace(/_/g, ' '); pill.onclick = () => pill.classList.toggle('selected');
  pill.dataset.value = b; document.getElementById('adminBlockerButtons').appendChild(pill);
});

window.selectBlocker = (name) => {
  selectedBlocker = name;
  localStorage.setItem('eli_selected_blocker', name);
  document.getElementById('selectionScreen').style.display = 'none';
  document.getElementById('appContainer').style.display = 'flex';
  document.getElementById('currentBlocker').textContent = name === 'All' ? 'All Proxies' : name.replace(/_/g, ' ');
  
  if(isAdmin) {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('adminContent').style.display = 'block';
  }
  
  fetchPosts();
};

window.goBack = () => {
  // Navigation back to selection screen doesn't count as a refresh, so session stays.
  localStorage.removeItem('eli_selected_blocker');
  location.reload(); 
}

async function fetchPosts() {
  let query = supabase.from('posts').select('*');
  if (selectedBlocker && selectedBlocker !== "All") query = query.eq('blocker', selectedBlocker);
  const { data } = await query.order('created_at', { ascending: false });
  if (!data) return;

  const grouped = [];
  data.forEach(item => {
    const ex = grouped.find(g => g.content === item.content && g.author === item.author);
    if (ex) { 
        if (!ex.blockers.includes(item.blocker)) ex.blockers.push(item.blocker);
        ex.ids.push(item.id);
    }
    else { grouped.push({ ...item, blockers: [item.blocker], ids: [item.id] }); }
  });

  renderPosts(grouped);
}

function renderPosts(posts) {
  const postsDiv = document.getElementById('posts');
  postsDiv.innerHTML = posts.map(p => {
    const list = p.blockers.map(b => b.replace(/_/g, ' ')).join(', ');
    const label = (selectedBlocker === "All") ? `<div class="post-unblocked-list">Unblocked for: ${list}</div>` : '';
    const adminControls = isAdmin ? `<div style="display:flex; gap:8px; margin-top:10px; border-top:1px solid #45475a; padding-top:10px; justify-content:flex-end;">
      <button class="small-action" onclick="startEdit('${p.ids.join(',')}', '${p.author.replace(/'/g, "\\'")}', '${p.content.replace(/'/g, "\\'")}')">✎ Edit</button>
      <button class="small-action" style="color:var(--red);" onclick="deleteGroup('${p.ids.join(',')}')">🗑 Delete</button>
    </div>` : '';

    return `<div class="post-card">
      <div class="post-meta"><div class="meta-top"><div class="post-author">By: ${p.author}</div><div>${new Date(p.created_at).toLocaleDateString()}</div></div>${label}</div>
      <div class="post-content">${linkify(p.content)}</div>
      ${adminControls}
    </div>`;
  }).join('');
}

window.startEdit = (ids, author, content) => {
  editingPostIds = ids.split(',');
  document.getElementById('adminPanel').style.display = 'block';
  document.getElementById('postAuthor').value = author;
  document.getElementById('postText').value = content;
  document.getElementById('publishBtn').textContent = "Update All Instances";
  document.getElementById('cancelEditBtn').style.display = "block";
  document.getElementById('adminPanelTitle').textContent = "Editing Post...";
};

document.getElementById('cancelEditBtn').onclick = () => {
  editingPostIds = [];
  document.getElementById('postAuthor').value = '';
  document.getElementById('postText').value = '';
  document.getElementById('publishBtn').textContent = "Post Everywhere";
  document.getElementById('cancelEditBtn').style.display = "none";
  document.getElementById('adminPanelTitle').textContent = "Admin Panel";
};

document.getElementById('publishBtn').onclick = async () => {
  const author = document.getElementById('postAuthor').value || 'Admin';
  const content = document.getElementById('postText').value;
  const pills = document.querySelectorAll('.admin-pill.selected');

  if (!content) return showNotice("Post cannot be empty", "error");

  if (editingPostIds.length > 0) {
    for (let id of editingPostIds) {
      await supabase.from('posts').update({ author, content }).eq('id', id);
    }
    showNotice("All instances updated");
    document.getElementById('cancelEditBtn').click();
  } else {
    if (pills.length === 0) return showNotice("Select at least one blocker", "error");
    for (const p of pills) {
      await supabase.from('posts').insert([{ blocker: p.dataset.value, author, content }]);
    }
    showNotice("Broadcasted Successfully");
    document.getElementById('postText').value = '';
  }
  fetchPosts();
};

window.deleteGroup = async (ids) => {
  const idArray = ids.split(',');
  for (let id of idArray) await supabase.from('posts').delete().eq('id', id);
  showNotice("Post Removed Everywhere"); fetchPosts();
};

document.getElementById('adminPassword').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    document.getElementById('loginBtn').click();
  }
});

document.getElementById('loginBtn').onclick = () => {
  if (document.getElementById('adminPassword').value === 'EISisBetterForever') {
    isAdmin = true;
    sessionStorage.setItem('eli_is_admin', 'true'); // SESSION ONLY
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('adminContent').style.display = 'block';
    showNotice("Admin Mode Activated"); fetchPosts();
  } else showNotice("Invalid Password", "error");
};

document.getElementById('viewLogs').onclick = async () => {
  document.getElementById('logOverlay').style.display = 'block';
  const { data } = await supabase.from('logs').select('*').order('created_at', { ascending: false });
  if (data) {
    document.getElementById('logList').innerHTML = data.map(l => `
      <div style="border-bottom:1px solid #313244; padding:15px 0;">
        <h4 style="margin:0; color:var(--accent)">${l.heading}</h4>
        <p style="margin:5px 0; font-size:0.9rem;">${linkify(l.body)}</p>
      </div>
    `).join('') || '<p>No updates yet.</p>';
  }
};

document.getElementById('showAdmin').onclick = () => document.getElementById('adminPanel').style.display='block';
document.getElementById('closeAdmin').onclick = () => document.getElementById('adminPanel').style.display='none';

document.getElementById('refreshBtn').onclick = () => {
    fetchPosts();
    showNotice("Posts Refreshed");
};

if (selectedBlocker) selectBlocker(selectedBlocker);
</script>
</body>
</html>
