<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Eli's Proxies</title>
  <meta name="title" content="Eli's Proxies | Start your unblocking journey">
  <meta name="description" content="The ultimate destination for unblocked links and proxy feeds.">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://elis-proxies.com/"> 
  <meta property="og:title" content="Eli's Proxies | Start your unblocking journey">
  <meta property="og:description" content="Get the latest unblocked links for Linewize, Securly, GoGuardian, and more.">
  <meta property="og:image" content="https://elis-proxies.odoo.com/web/image/website/1/logo/Eli%27s%20Proxies?unique=7b51271.png">

  <link rel="icon" type="image/png" href="https://elis-proxies.odoo.com/web/image/website/1/logo/Eli%27s%20Proxies?unique=7b51271.png">

  <style>
    /* CSS Root & Themes */
    :root { 
      --bg-dark: #1e1e2e; --bg-sidebar: #181825; --bg-card: #313244;
      --text-main: #cdd6f4; --text-muted: #a6adc8; --accent: #89b4fa;
      --red: #f38ba8; --green: #a6e3a1; --border: #45475a; --overlay: rgba(0,0,0,0.7);
      --glass-blur: 0px; --bg-animate: none;
    }
    [data-theme="dark"] { --bg-dark: #121212; --bg-sidebar: #1e1e1e; --bg-card: #242424; --text-main: #e0e0e0; --text-muted: #909090; --accent: #bb86fc; --border: #333333; }
    [data-theme="oled"] { --bg-dark: #000000; --bg-sidebar: #000000; --bg-card: #111111; --text-main: #ffffff; --text-muted: #888888; --accent: #ffffff; --border: #222222; }
    [data-theme="light"] { --bg-dark: #eff1f5; --bg-sidebar: #e6e9ef; --bg-card: #ffffff; --text-main: #4c4f69; --text-muted: #6c6f85; --accent: #1e66f5; --border: #ccd0da; }
    [data-theme="emerald"] { --bg-dark: #06120e; --bg-sidebar: #0a1a15; --bg-card: #122a22; --text-main: #ecfdf5; --text-muted: #6ee7b7; --accent: #10b981; --border: #065f46; }
    [data-theme="rose"] { --bg-dark: #1a1012; --bg-sidebar: #24181a; --bg-card: #3d2b2e; --text-main: #fff1f2; --text-muted: #fda4af; --accent: #f43f5e; --border: #9f1239; }
    [data-theme="cyberpunk"] { --bg-dark: #000b1e; --bg-sidebar: #00162d; --bg-card: #002244; --text-main: #00ffcc; --text-muted: #fdee00; --accent: #ff007f; --border: #00ffcc; }
    [data-theme="lava"] { --bg-dark: #0d0000; --bg-sidebar: #1a0000; --bg-card: #2d0000; --text-main: #ffd1d1; --text-muted: #ff6b6b; --accent: #ff4500; --border: #4d0000; }
    [data-theme="gold"] { --bg-dark: #0a0a0a; --bg-sidebar: #141414; --bg-card: #1a1a1a; --text-main: #ffffff; --text-muted: #888888; --accent: #d4af37; --border: #333333; }
    [data-theme="liquid"] { 
      --bg-dark: linear-gradient(-45deg, #0f172a, #1e293b, #082f49, #0f172a); 
      --bg-animate: gradientMove 15s ease infinite;
      --bg-sidebar: rgba(255, 255, 255, 0.08); 
      --bg-card: rgba(255, 255, 255, 0.05); 
      --text-main: #ffffff; --text-muted: rgba(255, 255, 255, 0.6); 
      --accent: #ffffff; --border: rgba(255, 255, 255, 0.2); --glass-blur: 16px;
    }

    @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    * { box-sizing: border-box; transition: background 0.3s, color 0.3s, border 0.3s; }
    *::-webkit-scrollbar { display: none; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; background: var(--bg-dark); background-size: 400% 400%; animation: var(--bg-animate); color: var(--text-main); height: 100vh; overflow: hidden; position: relative; }

    /* Particles Background */
    #particleCanvas { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; opacity: 0.5; }

    #announcementBanner { background: var(--accent); color: #000; padding: 8px; text-align: center; font-weight: bold; font-size: 0.85rem; display: none; z-index: 100; position: relative; }
    #toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); padding: 12px 25px; border-radius: 12px; color: #11111b; font-weight: bold; z-index: 60000; transition: top 0.4s; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    #toast.show { top: 20px; }

    /* Selection Screen */
    #selectionScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; position: relative; z-index:1; overflow-y: auto; }
    .blocker-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; width: 100%; max-width: 1000px; margin-top: 20px; }
    .blocker-card { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 18px; cursor: pointer; transition: 0.3s; font-weight: bold; text-align: center; display: flex; align-items: center; justify-content: center; min-height: 80px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .blocker-card:hover { transform: translateY(-5px); border-color: var(--accent); background: rgba(255,255,255,0.05); }

    /* App Container */
    .app-container { display: none; width: 100%; height: 100%; flex-direction: column; position: relative; z-index:1; }
    .header { padding: 15px 25px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; background: var(--bg-sidebar); gap: 10px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-bottom { display: flex; gap: 10px; align-items: center; }

    .search-bar { flex: 1; padding: 10px 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 30px; color: var(--text-main); outline: none; }
    .search-bar:focus { border-color: var(--accent); }

    #posts { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .post-card { background: var(--bg-card); padding: 25px; border-radius: 20px; width: 100%; max-width: 750px; border: 1px solid var(--border); box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
    .post-author { color: var(--accent); font-weight: 800; font-size: 0.95rem; margin-bottom: 8px; }
    .post-content { white-space: pre-wrap; font-size: 1rem; line-height: 1.5; word-break: break-all; }
    
    .vote-container { display: flex; gap: 10px; margin-top: 15px; align-items: center; }
    .vote-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-main); padding: 6px 12px; border-radius: 15px; cursor: pointer; font-size: 0.85rem; }
    .copy-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--accent); padding: 6px 12px; border-radius: 15px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
    .report-btn { border: 1px solid var(--red); color: var(--red); background: transparent; padding: 6px 12px; border-radius: 15px; cursor: pointer; font-size: 0.85rem; }

    /* Modals & Dragging */
    .drag-handle { cursor: move; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 20px 20px 0 0; border-bottom: 1px solid var(--border); margin: -25px -25px 15px -25px; display: flex; justify-content: space-between; align-items: center; user-select: none; }
    .panel { display: none; position: fixed; bottom: 30px; right: 30px; width: 400px; background: var(--bg-card); border: 1px solid var(--border); padding: 25px; border-radius: 24px; z-index: 15000; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:50000; backdrop-filter: blur(5px); align-items:center; justify-content:center; }
    .modal-content { background: var(--bg-card); padding: 25px; border-radius: 24px; width: 90%; max-width: 400px; border: 1px solid var(--border); position: relative; }

    /* Settings */
    .settings-dropdown { position: relative; }
    .gear-icon { font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }
    .settings-menu { display: none; position: absolute; right: 0; top: 40px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; width: 220px; padding: 10px; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .settings-menu.show { display: block; }
    .menu-item { padding: 10px; cursor: pointer; border-radius: 8px; font-size: 0.9rem; }
    .menu-item:hover { background: rgba(255,255,255,0.1); color: var(--accent); }

    .admin-input { width: 100%; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: white; border-radius: 8px; margin-bottom: 10px; outline: none; }
    .admin-primary-btn { width: 100%; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    .btn-outline { background:none; border:1px solid var(--border); color:var(--text-main); border-radius:20px; padding:6px 12px; cursor:pointer; }
  </style>
</head>
<body>

<canvas id="particleCanvas"></canvas>
<div id="toast"></div>
<div id="announcementBanner"></div>

<div id="reportModal" class="modal-overlay">
  <div class="modal-content" id="reportWin">
    <div class="drag-handle" data-target="reportWin">
      <h3 style="margin:0; color:var(--red); font-size: 1rem;">Report Proxy</h3>
    </div>
    <textarea id="reportInput" class="admin-input" rows="4" placeholder="Reason for reporting..."></textarea>
    <div style="display:flex; gap:10px;">
        <button id="sendReportBtn" class="admin-primary-btn" style="background:var(--red); color:white;">Send Report</button>
        <button onclick="document.getElementById('reportModal').style.display='none'" class="admin-primary-btn" style="background:transparent; border:1px solid var(--border); color:var(--text-main);">Cancel</button>
    </div>
  </div>
</div>

<div id="requestModal" class="modal-overlay">
  <div class="modal-content" id="requestWin">
    <div class="drag-handle" data-target="requestWin">
      <h3 style="margin:0; color:var(--accent); font-size: 1rem;">Request Proxy</h3>
    </div>
    <textarea id="requestInput" class="admin-input" rows="4" placeholder="What proxy do you need?"></textarea>
    <div style="display:flex; gap:10px;">
        <button id="sendRequestBtn" class="admin-primary-btn">Send Request</button>
        <button onclick="document.getElementById('requestModal').style.display='none'" class="admin-primary-btn" style="background:transparent; border:1px solid var(--border); color:var(--text-main);">Cancel</button>
    </div>
  </div>
</div>

<div id="selectionScreen">
  <h1 style="color: var(--text-main); font-size: 2.5rem; margin-bottom: 5px;">Eli's Proxies</h1>
  <p style="color: var(--text-muted); margin-bottom: 25px;">Select a blocker to see links</p>
  <div class="blocker-grid" id="gridContainer"></div>
  <div class="blocker-card" style="margin-top:20px; width:100%; max-width:300px; color:var(--accent);" onclick="selectBlocker('All')">View All</div>
</div>

<div class="app-container" id="appContainer">
  <div class="header">
    <div class="header-top">
        <div style="display:flex; align-items:center; gap:15px;">
          <button onclick="goBack()" class="btn-outline">← Back</button>
          <h2 id="currentBlocker" style="margin:0; font-size: 1.1rem;">Feed</h2>
        </div>
        <div class="settings-dropdown">
          <div class="gear-icon" onclick="toggleSettings()">⚙</div>
          <div id="settingsMenu" class="settings-menu">
            <div class="menu-item" onclick="location.reload()">↻ Refresh</div>
            <div class="menu-item" onclick="openRequestModal()">📥 Request Proxy</div>
            <div class="menu-item" onclick="document.getElementById('adminPanel').style.display='block'">🔑 Admin</div>
            <a href="https://discord.gg/hns6EJVZ3k" target="_blank" style="text-decoration:none; color:inherit;"><div class="menu-item">💬 Discord</div></a>
          </div>
        </div>
    </div>
    <div class="header-bottom">
        <input type="text" id="searchInput" class="search-bar" placeholder="Search...">
    </div>
  </div>
  <div id="posts"></div>
</div>

<div id="adminPanel" class="panel">
  <div class="drag-handle" data-target="adminPanel">
    <h3 style="margin:0; color:var(--accent); font-size: 1rem;">Admin Panel</h3>
    <button onclick="document.getElementById('adminPanel').style.display='none'" style="background:none; border:none; color:white; cursor:pointer;">&times;</button>
  </div>
  <div id="loginSection">
    <input type="password" id="adminPassword" class="admin-input" placeholder="Password">
    <button class="admin-primary-btn" onclick="loginAction()">Login</button>
  </div>
  <div id="adminContent" style="display:none;">
    <input type="text" id="postAuthor" class="admin-input" placeholder="Author">
    <textarea id="postText" class="admin-input" rows="3" placeholder="Content (Links)"></textarea>
    <select id="blockerSelect" class="admin-input"></select>
    <button class="admin-primary-btn" id="publishBtn">Post Proxy</button>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
const supabase = createClient('https://saauhuiruadqjogzughm.supabase.co', 'sb_publishable_u2yOKUXvz3qjRMOZt55-3Q_FGBN6b-F');

const blockers = ["Linewize", "Securly", "Palo_alto", "Blocksi", "Aristotle", "Lightspeed", "Contentkeeper", "Lanschool", "Goguardian", "Fortiguard", "Cisco_talos", "Deledao"];
let selectedBlocker = localStorage.getItem('eli_last_blocker') || null;

const REPORT_WEBHOOK = 'https://discord.com/api/webhooks/1474238339811905662/pPriqbRbPjky3JzVqKl8AXDHZCMrS0uZmOMlxrmy-q0-mfLKJ-eABDhYc8Fi9jpGpL-r';
const REQUEST_WEBHOOK = 'https://discord.com/api/webhooks/1474498106195181811/Gdd0aDSE8htLTf9cHAd6eEUR30fgnm3YI-rUgdRODWZXhdz_r-vLaMO75mH2xRre-OhZ';

// --- CORE LOGIC ---
function linkify(text) {
  const urlPattern = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%?=~_|])/ig;
  return text.replace(urlPattern, '<a href="$1" target="_blank" style="color:var(--accent); text-decoration:none;">$1</a>');
}

window.loginAction = async () => {
    const pass = document.getElementById('adminPassword').value;
    const { data } = await supabase.from('admin_config').select('value').eq('key', 'admin_password').single();
    if(data && pass === data.value) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        showNotice("Logged in");
    } else {
        showNotice("Wrong Password", "error");
    }
};

window.copyLinks = (btn, text) => {
    const urls = text.match(/(https?:\/\/[^\s]+)/gi);
    if (urls) {
        navigator.clipboard.writeText(urls.join('\n'));
        btn.textContent = "Copied!";
        setTimeout(() => btn.textContent = "Copy Links", 2000);
    }
};

window.vote = async (id, type) => {
    const key = `voted_${id}`;
    if(localStorage.getItem(key)) return showNotice("Already voted", "error");
    const col = type === 'like' ? 'likes' : 'dislikes';
    const { data: cur } = await supabase.from('posts').select(col).eq('id', id).single();
    await supabase.from('posts').update({ [col]: (cur[col] || 0) + 1 }).eq('id', id);
    localStorage.setItem(key, type);
    fetchPosts();
};

window.openReportModal = (author, content) => {
    document.getElementById('reportModal').style.display='flex';
    document.getElementById('sendReportBtn').onclick = async () => {
        const msg = document.getElementById('reportInput').value;
        await fetch(REPORT_WEBHOOK, { 
            method: 'POST', 
            headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify({ content: `🚨 **REPORT**\n**Author:** ${author}\n**Content:** ${content}\n**Reason:** ${msg}` }) 
        });
        document.getElementById('reportModal').style.display='none';
        showNotice("Report Sent");
    };
};

window.openRequestModal = () => {
    document.getElementById('requestModal').style.display='flex';
    document.getElementById('sendRequestBtn').onclick = async () => {
        const msg = document.getElementById('requestInput').value;
        await fetch(REQUEST_WEBHOOK, { 
            method: 'POST', 
            headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify({ content: `📥 **REQUEST:** ${msg}` }) 
        });
        document.getElementById('requestModal').style.display='none';
        showNotice("Request Sent");
    };
};

async function fetchPosts() {
  let query = supabase.from('posts').select('*');
  if (selectedBlocker && selectedBlocker !== "All") query = query.eq('blocker', selectedBlocker);
  const { data } = await query;
  if (!data) return;

  document.getElementById('posts').innerHTML = data.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(p => `
    <div class="post-card">
      <div class="post-author">${p.author}</div>
      <div class="post-content">${linkify(p.content)}</div>
      <div class="vote-container">
         <button class="vote-btn" onclick="vote('${p.id}','like')">👍 ${p.likes||0}</button>
         <button class="vote-btn" onclick="vote('${p.id}','dislike')">👎 ${p.dislikes||0}</button>
         <button class="copy-btn" onclick="copyLinks(this, \`${p.content}\`)">Copy Links</button>
         <button class="report-btn" onclick="openReportModal('${p.author}', \`${p.content}\`)">Report</button>
      </div>
    </div>
  `).join('');
}

window.selectBlocker = (name) => {
  selectedBlocker = name; localStorage.setItem('eli_last_blocker', name);
  document.getElementById('selectionScreen').style.display = 'none';
  document.getElementById('appContainer').style.display = 'flex';
  document.getElementById('currentBlocker').textContent = name.replace(/_/g, ' ');
  fetchPosts();
};

window.goBack = () => {
    localStorage.removeItem('eli_last_blocker');
    document.getElementById('appContainer').style.display = 'none';
    document.getElementById('selectionScreen').style.display = 'flex';
};

window.toggleSettings = () => document.getElementById('settingsMenu').classList.toggle('show');

function showNotice(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = type === 'success' ? '#a6e3a1' : '#f38ba8';
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
}

// --- ADMIN POSTING ---
document.getElementById('publishBtn').onclick = async () => {
    const author = document.getElementById('postAuthor').value;
    const content = document.getElementById('postText').value;
    const blocker = document.getElementById('blockerSelect').value;
    if(!author || !content) return showNotice("Fill all fields", "error");
    const { error } = await supabase.from('posts').insert([{ author, content, blocker, likes: 0, dislikes: 0 }]);
    if(!error) { showNotice("Posted!"); fetchPosts(); }
};

// --- DRAGGABLE ENGINE ---
function makeDraggable() {
  document.querySelectorAll('.drag-handle').forEach(handle => {
    const target = document.getElementById(handle.getAttribute('data-target'));
    let isDragging = false, startX, startY, initialX, initialY;
    handle.onmousedown = (e) => {
      isDragging = true; startX = e.clientX; startY = e.clientY;
      const rect = target.getBoundingClientRect();
      initialX = rect.left; initialY = rect.top;
      target.style.zIndex = 100000;
    };
    document.onmousemove = (e) => {
      if (!isDragging) return;
      target.style.left = `${initialX + (e.clientX - startX)}px`;
      target.style.top = `${initialY + (e.clientY - startY)}px`;
      target.style.bottom = 'auto'; target.style.right = 'auto';
    };
    document.onmouseup = () => isDragging = false;
  });
}

// --- PARTICLE ENGINE ---
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let particles = [];
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.onresize = resize; resize();
class Particle {
  constructor() { this.init(); }
  init() {
    this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
    this.vx = (Math.random() - 0.5) * 0.5; this.vy = (Math.random() - 0.5) * 0.5;
    this.size = Math.random() * 2;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    if(this.x < 0 || this.x > canvas.width) this.vx *= -1;
    if(this.y < 0 || this.y > canvas.height) this.vy *= -1;
  }
  draw() {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent');
    ctx.globalAlpha = 0.3; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
  }
}
for(let i=0; i<50; i++) particles.push(new Particle());
function loop() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(loop);
}

// Initialization
loop();
makeDraggable();
const grid = document.getElementById('gridContainer');
const sel = document.getElementById('blockerSelect');
blockers.forEach(b => {
    const card = document.createElement('div');
    card.className = 'blocker-card';
    card.textContent = b.replace(/_/g, ' ');
    card.onclick = () => selectBlocker(b);
    grid.appendChild(card);
    const opt = document.createElement('option');
    opt.value = b; opt.textContent = b;
    sel.appendChild(opt);
});
if (selectedBlocker) selectBlocker(selectedBlocker);
</script>
</body>
</html>
