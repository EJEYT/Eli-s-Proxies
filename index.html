<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Eli's Proxies</title>
  <meta name="title" content="Eli's Proxies | Start your unblocking journey">
  <meta name="description" content="The ultimate destination for unblocked links and proxy feeds.">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://elis-proxies.com/"> 
  <meta property="og:title" content="Eli's Proxies | Start your unblocking journey">
  <meta property="og:description" content="Get the latest unblocked links for Linewize, Securly, GoGuardian, and more.">
  <meta property="og:image" content="https://elis-proxies.odoo.com/web/image/website/1/logo/Eli%27s%20Proxies?unique=7b51271.png">

  <link rel="icon" type="image/png" href="https://elis-proxies.odoo.com/web/image/website/1/logo/Eli%27s%20Proxies?unique=7b51271.png">

  <style>
    /* Themes */
    :root { 
      --bg-dark: #1e1e2e; --bg-sidebar: #181825; --bg-card: #313244;
      --text-main: #cdd6f4; --text-muted: #a6adc8; --accent: #89b4fa;
      --red: #f38ba8; --green: #a6e3a1; --border: #45475a; --overlay: rgba(0,0,0,0.7);
      --glass-blur: 0px; --bg-animate: none;
    }
    [data-theme="dark"] { --bg-dark: #121212; --bg-sidebar: #1e1e1e; --bg-card: #242424; --text-main: #e0e0e0; --text-muted: #909090; --accent: #bb86fc; --border: #333333; }
    [data-theme="oled"] { --bg-dark: #000000; --bg-sidebar: #000000; --bg-card: #111111; --text-main: #ffffff; --text-muted: #888888; --accent: #ffffff; --border: #222222; }
    [data-theme="light"] { --bg-dark: #eff1f5; --bg-sidebar: #e6e9ef; --bg-card: #ffffff; --text-main: #4c4f69; --text-muted: #6c6f85; --accent: #1e66f5; --border: #ccd0da; }
    [data-theme="emerald"] { --bg-dark: #06120e; --bg-sidebar: #0a1a15; --bg-card: #122a22; --text-main: #ecfdf5; --text-muted: #6ee7b7; --accent: #10b981; --border: #065f46; }
    [data-theme="rose"] { --bg-dark: #1a1012; --bg-sidebar: #24181a; --bg-card: #3d2b2e; --text-main: #fff1f2; --text-muted: #fda4af; --accent: #f43f5e; --border: #9f1239; }
    
    [data-theme="liquid"] { 
      --bg-dark: linear-gradient(-45deg, #0f172a, #1e293b, #082f49, #0f172a); 
      --bg-animate: gradientMove 15s ease infinite;
      --bg-sidebar: rgba(255, 255, 255, 0.08); 
      --bg-card: rgba(255, 255, 255, 0.05); 
      --text-main: #ffffff; --text-muted: rgba(255, 255, 255, 0.6); 
      --accent: #ffffff; --border: rgba(255, 255, 255, 0.2); --glass-blur: 16px;
    }

    @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    * { box-sizing: border-box; transition: background 0.3s, color 0.3s, border 0.3s; }
    *::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }

    body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; background: var(--bg-dark); background-size: 400% 400%; animation: var(--bg-animate); color: var(--text-main); height: 100vh; overflow: hidden; }

    #announcementBanner { background: var(--accent); color: #000; padding: 8px; text-align: center; font-weight: bold; font-size: 0.85rem; display: none; z-index: 100; }
    a { color: var(--accent) !important; text-decoration: underline; }

    #toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); padding: 12px 25px; border-radius: 12px; color: #11111b; font-weight: bold; z-index: 60000; transition: top 0.4s; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    #toast.show { top: 20px; }

    #selectionScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: transparent; overflow-y: auto; padding: 20px; }
    .blocker-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; width: 100%; max-width: 1000px; margin-top: 20px; }
    .blocker-card { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 18px; cursor: pointer; transition: 0.3s; font-weight: bold; text-align: center; display: flex; align-items: center; justify-content: center; min-height: 80px; backdrop-filter: blur(var(--glass-blur)); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .blocker-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.15); border-color: var(--accent); }
    
    .app-container { display: none; width: 100%; height: 100%; flex-direction: column; }
    .header { padding: 15px 25px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--bg-sidebar); z-index: 10; backdrop-filter: blur(var(--glass-blur)); }
    .search-bar { flex: 0.6; padding: 12px 25px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 30px; color: var(--text-main); outline: none; margin: 0 15px; backdrop-filter: blur(var(--glass-blur)); }
    .search-bar:focus { border-color: var(--accent); background: rgba(255,255,255,0.1); }
    
    #posts { flex: 1; padding: 20px; padding-bottom: 100px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .post-card { background: var(--bg-card); padding: 25px; border-radius: 20px; width: 100%; max-width: 750px; position: relative; border: 1px solid var(--border); backdrop-filter: blur(var(--glass-blur)); box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
    .post-author { color: var(--accent); font-weight: 800; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .post-content { white-space: pre-wrap; font-size: 1.05rem; margin-top: 12px; word-break: break-all; line-height: 1.5; }

    .settings-dropdown { position: relative; }
    .gear-icon { font-size: 1.5rem; cursor: pointer; color: var(--text-muted); padding: 5px; }
    .settings-menu { display: none; position: absolute; right: 0; top: 45px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; width: 240px; padding: 10px; z-index: 100; box-shadow: 0 15px 35px rgba(0,0,0,0.4); backdrop-filter: blur(30px); }
    .settings-menu.show { display: block; }
    .menu-item { padding: 12px; border-radius: 10px; cursor: pointer; font-size: 0.9rem; font-weight: bold; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }
    .menu-item:hover { background: rgba(255,255,255,0.1); color: var(--accent); }
    .themes-sub-list { display: none; flex-direction: column; padding-left: 15px; margin-top: 5px; border-left: 2px solid var(--border); }
    .themes-sub-list.open { display: flex; }
    .theme-opt { padding: 8px 12px; font-size: 0.8rem; cursor: pointer; border-radius: 6px; }
    .theme-opt:hover { background: rgba(255,255,255,0.1); color: var(--accent); }

    .panel { display: none; position: fixed; bottom: 30px; right: 30px; width: 420px; max-width: calc(100% - 60px); background: var(--bg-card); border: 1px solid var(--border); padding: 25px; border-radius: 24px; z-index: 15000; box-shadow: 0 20px 50px rgba(0,0,0,0.5); backdrop-filter: blur(40px); }
    
    #editPanel { position: fixed; left: -450px; top: 0; width: 420px; height: 100vh; background: var(--bg-sidebar); border-right: 1px solid var(--border); z-index: 30000; padding: 40px 30px; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 20px 0 60px rgba(0,0,0,0.6); backdrop-filter: blur(40px); }
    #editPanel.open { left: 0; }

    .admin-input { width: 100%; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: white; border-radius: 10px; margin-bottom: 12px; outline: none; }
    .admin-input:focus { border-color: var(--accent); }
    .admin-primary-btn { width: 100%; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 8px; transition: 0.2s; }
    .admin-primary-btn:hover { opacity: 0.9; transform: scale(0.98); }
    
    .admin-tabs { display: flex; gap: 8px; margin-bottom: 20px; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 12px; }
    .admin-tab { flex: 1; padding: 8px; text-align: center; cursor: pointer; border-radius: 8px; font-size: 0.75rem; color: var(--text-muted); }
    .admin-tab.active { background: var(--bg-card); color: var(--accent); font-weight: bold; }
    
    .blocker-pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
    .admin-pill { padding: 6px; border-radius: 8px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: var(--text-muted); font-size: 0.7rem; cursor: pointer; text-align: center; }
    .admin-pill.selected { background: var(--accent); color: #000; }

    .btn-outline { background:none; border:1px solid var(--border); color:var(--text-main); border-radius:25px; padding:8px 16px; cursor:pointer; font-weight:bold; font-size: 0.85rem; }
    .btn-outline:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); }
    .copy-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--accent); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }
    .report-btn { color: var(--red); border: 1px solid var(--red); background: transparent; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 0.75rem; margin-left: 8px; }

    .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:50000; backdrop-filter: blur(8px); align-items:center; justify-content:center; }
    .modal-content { background: var(--bg-card); padding: 30px; border-radius: 24px; width: 90%; max-width: 400px; border: 1px solid var(--border); }
  </style>
</head>
<body>

<div id="toast"></div>
<div id="announcementBanner"></div>

<div id="reportModal" class="modal-overlay">
  <div class="modal-content">
    <h3 style="margin-top:0; color:var(--red);">Report Proxy</h3>
    <textarea id="reportInput" class="admin-input" rows="4" placeholder="Why are you reporting this?"></textarea>
    <div style="display:flex; gap:10px;">
        <button id="sendReportBtn" class="admin-primary-btn" style="background:var(--red); color:white;">Send Report</button>
        <button onclick="document.getElementById('reportModal').style.display='none'" class="admin-primary-btn" style="background:transparent; border:1px solid var(--border); color:var(--text-main);">Cancel</button>
    </div>
  </div>
</div>

<div id="editPanel">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
    <h3 id="editTitle" style="margin:0; color:var(--accent); font-size: 1.4rem;">Edit Item</h3>
    <button onclick="closeEditPanel()" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:2rem;">&times;</button>
  </div>
  
  <div id="editPostFields">
    <label style="font-size:0.8rem; color:var(--text-muted); margin-bottom:8px; display:block;">Author</label>
    <input type="text" id="editAuthor" class="admin-input">
    <label style="font-size:0.8rem; color:var(--text-muted); margin-bottom:8px; display:block;">Content</label>
    <textarea id="editContent" class="admin-input" rows="6"></textarea>
    <button id="saveEditBtn" class="admin-primary-btn">Apply Changes</button>
  </div>

  <div id="editLogFields" style="display:none;">
    <label style="font-size:0.8rem; color:var(--text-muted); margin-bottom:8px; display:block;">Heading</label>
    <input type="text" id="editLogHeading" class="admin-input">
    <label style="font-size:0.8rem; color:var(--text-muted); margin-bottom:8px; display:block;">Update Details</label>
    <textarea id="editLogBody" class="admin-input" rows="10"></textarea>
    <button id="saveLogEditBtn" class="admin-primary-btn">Update Log</button>
  </div>
</div>

<div id="selectionScreen">
  <h1 style="color: var(--text-main); font-size: 2.5rem; margin-bottom: 8px; letter-spacing: -1px;">Eli's Proxies</h1>
  <p style="color: var(--text-muted); margin-bottom: 30px; font-size: 1rem; font-weight: 500;">Choose a filter to begin</p>
  <div class="blocker-grid" id="gridContainer"></div>
  <div class="blocker-card" style="margin-top:25px; width:100%; max-width:320px; background: rgba(255,255,255,0.1); border-color: var(--accent); color: var(--accent);" onclick="selectBlocker('All')">View All Proxies</div>
</div>

<div class="app-container" id="appContainer">
  <div class="header">
    <div style="display:flex; align-items:center; gap:15px;">
      <button onclick="goBackToSelection()" class="btn-outline">← Back</button>
      <h2 id="currentBlocker" style="font-size:1.2rem; margin:0; font-weight: 800;">Feed</h2>
    </div>
    <input type="text" id="searchInput" class="search-bar" placeholder="Search for proxies...">
    <div class="settings-dropdown">
      <div class="gear-icon" onclick="toggleSettings()">⚙</div>
      <div id="settingsMenu" class="settings-menu">
        <div class="menu-item" onclick="refreshNow()">↻ Refresh Feed</div>
        <div class="menu-item" onclick="toggleThemeList()">🎨 Themes <span id="themeArrow">▼</span></div>
        <div id="themesSubList" class="themes-sub-list">
            <div class="theme-opt" onclick="setTheme('liquid')" style="color:#0ea5e9; font-weight: bold;">Liquid Glass ✨</div>
            <div class="theme-opt" onclick="setTheme('catppuccin')">Original</div>
            <div class="theme-opt" onclick="setTheme('dark')">Dark</div>
            <div class="theme-opt" onclick="setTheme('oled')">OLED</div>
            <div class="theme-opt" onclick="setTheme('light')">Light</div>
            <div class="theme-opt" onclick="setTheme('emerald')" style="color:#10b981">Emerald</div>
            <div class="theme-opt" onclick="setTheme('rose')" style="color:#f43f5e">Rose</div>
        </div>
        <div class="menu-item" onclick="showLogs()">📜 View Logs</div>
        <div class="menu-item" onclick="document.getElementById('adminPanel').style.display='block'">🔑 Admin Panel</div>
      </div>
    </div>
  </div>
  <div id="posts"></div>
</div>

<div id="logOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:35000; padding:20px; backdrop-filter: blur(10px);">
  <div style="max-width:650px; margin:40px auto; background:var(--bg-sidebar); border-radius:24px; padding:30px; max-height:85vh; overflow-y:auto; border:1px solid var(--border); box-shadow: 0 30px 60px rgba(0,0,0,0.5);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
      <h2 style="margin:0; font-weight: 800;">Update History</h2>
      <button onclick="document.getElementById('logOverlay').style.display='none'" class="btn-outline">Close</button>
    </div>
    <div id="logList"></div>
  </div>
</div>

<div id="adminPanel" class="panel">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h3 style="margin:0; color:var(--accent); font-size: 1.2rem; font-weight: 800;">Admin Dashboard</h3>
    <button onclick="document.getElementById('adminPanel').style.display='none'" style="background:none; border:none; color:white; cursor:pointer; font-size:1.8rem;">&times;</button>
  </div>
  <div id="loginSection">
    <input type="password" id="adminPassword" class="admin-input" placeholder="Password" onkeydown="if(event.key === 'Enter') loginAction()">
    <button id="loginBtn" class="admin-primary-btn" onclick="loginAction()">Authenticate</button>
  </div>
  <div id="adminContent" style="display:none;">
    <div class="admin-tabs">
      <div class="admin-tab active" id="tabPost" onclick="switchTab('post')">New Proxy</div>
      <div class="admin-tab" id="tabLog" onclick="switchTab('log')">New Log</div>
      <div class="admin-tab" id="tabBanner" onclick="switchTab('banner')">Banner</div>
    </div>
    <div id="panePost">
      <input type="text" id="postAuthor" class="admin-input" placeholder="Author Name">
      <textarea id="postText" class="admin-input" rows="3" placeholder="Proxy link / description..."></textarea>
      <div id="adminBlockerButtons" class="blocker-pills"></div>
      <button id="publishBtn" class="admin-primary-btn">Publish to Feed</button>
    </div>
    <div id="paneLog" style="display:none;">
      <input type="text" id="logHeading" class="admin-input" placeholder="Update Title">
      <textarea id="logBody" class="admin-input" rows="4" placeholder="Log details..."></textarea>
      <button id="publishLogBtn" class="admin-primary-btn">Add Log Entry</button>
    </div>
    <div id="paneBanner" style="display:none;">
      <textarea id="bannerTextInput" class="admin-input" rows="3" placeholder="Global announcement text..."></textarea>
      <button id="updateBannerBtn" class="admin-primary-btn">Update Banner</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
const supabase = createClient('https://saauhuiruadqjogzughm.supabase.co', 'sb_publishable_u2yOKUXvz3qjRMOZt55-3Q_FGBN6b-F');

const blockers = ["Linewize", "Securly", "Palo_alto", "Blocksi", "Aristotle", "Lightspeed", "Contentkeeper", "Lanschool", "Goguardian", "Fortiguard", "Cisco_talos", "Deledao"];
let selectedBlocker = localStorage.getItem('eli_last_blocker') || null;
let isAdmin = false; 

const WEBHOOK_URL = 'https://discord.com/api/webhooks/1474238339811905662/pPriqbRbPjky3JzVqKl8AXDHZCMrS0uZmOMlxrmy-q0-mfLKJ-eABDhYc8Fi9jpGpL-r';

// --- THEMES ---
window.setTheme = (t) => { document.documentElement.setAttribute('data-theme', t); localStorage.setItem('eli_theme', t); };
setTheme(localStorage.getItem('eli_theme') || 'catppuccin');

// --- UI ---
window.toggleSettings = () => document.getElementById('settingsMenu').classList.toggle('show');
window.toggleThemeList = () => {
    const list = document.getElementById('themesSubList');
    const arrow = document.getElementById('themeArrow');
    list.classList.toggle('open');
    arrow.textContent = list.classList.contains('open') ? '▲' : '▼';
};
window.closeEditPanel = () => document.getElementById('editPanel').classList.remove('open');
window.onclick = (e) => { 
    if (!e.target.closest('.settings-dropdown')) {
        document.getElementById('settingsMenu').classList.remove('show');
        document.getElementById('themesSubList').classList.remove('open');
    }
};

function showNotice(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = type === 'success' ? '#a6e3a1' : '#f38ba8';
  t.style.color = '#111';
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
}

function linkify(text) {
  const urlPattern = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
  return text.replace(urlPattern, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

// --- FEATURES ---

window.copyLinksFromPost = (text) => {
    const urlPattern = /(https?:\/\/[^\s]+)/gi;
    const matches = text.match(urlPattern);
    if (matches) {
        navigator.clipboard.writeText(matches.join('\n')).then(() => showNotice(`Copied ${matches.length} links`));
    } else showNotice("No links found", "error");
}

window.openReportModal = (postId, author, content) => {
    document.getElementById('reportModal').style.display = 'flex';
    document.getElementById('sendReportBtn').onclick = async () => {
        const msg = document.getElementById('reportInput').value;
        if(!msg) return showNotice("Enter a reason", "error");
        
        const payload = {
            embeds: [{
                title: "🚨 New Proxy Report",
                color: 15548997, 
                fields: [
                    { name: "Reason", value: msg },
                    { name: "Proxy Author", value: author, inline: true },
                    { name: "Post ID", value: postId, inline: true },
                    { name: "Content", value: content }
                ],
                timestamp: new Date().toISOString()
            }]
        };

        try {
            const resp = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            if (resp.ok) {
                document.getElementById('reportModal').style.display = 'none';
                document.getElementById('reportInput').value = '';
                showNotice("Report Sent to Discord");
            } else throw new Error();
        } catch (e) { showNotice("Discord Error", "error"); }
    };
}

// --- CORE ---
window.selectBlocker = (name) => {
  selectedBlocker = name;
  localStorage.setItem('eli_last_blocker', name);
  document.getElementById('selectionScreen').style.display = 'none';
  document.getElementById('appContainer').style.display = 'flex';
  document.getElementById('currentBlocker').textContent = name === 'All' ? 'All Proxies' : name.replace(/_/g, ' ');
  syncBanner(); fetchPosts();
};

window.goBackToSelection = () => {
    localStorage.removeItem('eli_last_blocker');
    document.getElementById('appContainer').style.display = 'none';
    document.getElementById('selectionScreen').style.display = 'flex';
};

window.refreshNow = () => {
    document.getElementById('settingsMenu').classList.remove('show');
    fetchPosts(false);
}

async function syncBanner() {
  const { data } = await supabase.from('settings').select('content').eq('id', 'announcement_banner').single();
  if (data && data.content.trim() !== "") {
    const banner = document.getElementById('announcementBanner');
    banner.textContent = data.content;
    banner.style.display = 'block';
  }
}

async function fetchPosts(silent = true) {
  let query = supabase.from('posts').select('*');
  if (selectedBlocker && selectedBlocker !== "All") query = query.eq('blocker', selectedBlocker);
  const { data } = await query.order('created_at', { ascending: false });
  if (!data) return;
  const grouped = [];
  data.forEach(item => {
    const existing = grouped.find(g => g.content === item.content && g.author === item.author);
    if (existing) { existing.ids.push(item.id); }
    else { grouped.push({ ...item, ids: [item.id] }); }
  });
  document.getElementById('posts').innerHTML = grouped.map(p => `
    <div class="post-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="post-author">${p.author}</span>
        <span style="font-size:0.75rem; color:var(--text-muted); opacity:0.7;">${new Date(p.created_at).toLocaleDateString()}</span>
      </div>
      <div class="post-content">${linkify(p.content)}</div>
      <div style="margin-top:15px; display:flex; justify-content:space-between; align-items:center;">
        <div>
            <button class="copy-btn" onclick="window.copyLinksFromPost(\`${p.content}\`)">Copy Link(s)</button>
            <button class="report-btn" onclick="window.openReportModal('${p.ids[0]}', \`${p.author}\`, \`${p.content}\`)">Report</button>
        </div>
        ${isAdmin ? `
            <div>
                <button class="btn-outline" style="padding: 4px 12px; font-size: 0.75rem; margin-right:5px;" onclick="window.openEditProxy('${p.ids.join(',')}', \`${p.author}\`, \`${p.content}\`)">Edit</button>
                <button class="btn-outline" style="padding: 4px 12px; font-size: 0.75rem; color:var(--red); border-color:var(--red);" onclick="window.deleteProxy('${p.ids.join(',')}')">Delete</button>
            </div>
        ` : ''}
      </div>
    </div>`).join('');
  if(!silent) showNotice("Feed Refreshed");
}

window.openEditProxy = (ids, author, content) => {
    document.getElementById('editTitle').textContent = "Edit Proxy";
    document.getElementById('editPostFields').style.display = 'block';
    document.getElementById('editLogFields').style.display = 'none';
    document.getElementById('editAuthor').value = author;
    document.getElementById('editContent').value = content;
    document.getElementById('editPanel').classList.add('open');
    document.getElementById('saveEditBtn').onclick = async () => {
        for(let id of ids.split(',')) await supabase.from('posts').update({ author: document.getElementById('editAuthor').value, content: document.getElementById('editContent').value }).eq('id', id);
        showNotice("Updated!"); closeEditPanel(); fetchPosts();
    };
};

window.deleteProxy = async (ids) => {
    if(!confirm("Delete permanently?")) return;
    for(let id of ids.split(',')) await supabase.from('posts').delete().eq('id', id);
    showNotice("Deleted"); fetchPosts();
};

window.loginAction = () => {
  if (document.getElementById('adminPassword').value === 'EISisBetterForever') {
    isAdmin = true; 
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('adminContent').style.display = 'block'; 
    showNotice("Admin Active"); fetchPosts();
  } else showNotice("Wrong Pass", "error");
};

blockers.forEach(b => {
  const card = document.createElement('div');
  card.className = 'blocker-card'; card.textContent = b.replace(/_/g, ' ');
  card.onclick = () => selectBlocker(b);
  document.getElementById('gridContainer').appendChild(card);
  const pill = document.createElement('div');
  pill.className = 'admin-pill'; pill.textContent = b.replace(/_/g, ' ');
  pill.onclick = () => pill.classList.toggle('selected');
  pill.dataset.value = b;
  document.getElementById('adminBlockerButtons').appendChild(pill);
});

if (selectedBlocker) selectBlocker(selectedBlocker);

window.showLogs = async () => {
  document.getElementById('logOverlay').style.display = 'block';
  const { data } = await supabase.from('logs').select('*').order('created_at', { ascending: false });
  document.getElementById('logList').innerHTML = data.map(l => `
    <div style="border-bottom:1px solid var(--border); padding:20px 0;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong style="color:var(--accent); font-size:1.1rem;">${l.heading}</strong>
      </div>
      <p style="font-size:0.95rem; margin-top:10px;">${linkify(l.body)}</p>
    </div>`).join('');
};

window.switchTab = (t) => {
  ['panePost', 'paneLog', 'paneBanner'].forEach(p => document.getElementById(p).style.display = 'none');
  ['tabPost', 'tabLog', 'tabBanner'].forEach(b => document.getElementById(b).classList.remove('active'));
  document.getElementById('pane' + t.charAt(0).toUpperCase() + t.slice(1)).style.display = 'block';
  document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.add('active');
};

document.getElementById('publishBtn').onclick = async () => {
  const author = document.getElementById('postAuthor').value || 'Admin';
  const content = document.getElementById('postText').value;
  const pills = document.querySelectorAll('#adminPanel .admin-pill.selected');
  for(let p of pills) await supabase.from('posts').insert([{ blocker: p.dataset.value, author, content }]);
  showNotice("Proxy Added!"); fetchPosts();
};

document.getElementById('publishLogBtn').onclick = async () => {
    await supabase.from('logs').insert([{ heading: document.getElementById('logHeading').value, body: document.getElementById('logBody').value }]);
    showNotice("Log Added");
};

document.getElementById('updateBannerBtn').onclick = async () => {
  await supabase.from('settings').update({ content: document.getElementById('bannerTextInput').value }).eq('id', 'announcement_banner');
  showNotice("Banner Updated"); syncBanner();
};

document.getElementById('searchInput').oninput = (e) => {
  const term = e.target.value.toLowerCase();
  document.querySelectorAll('.post-card').forEach(card => card.style.display = card.innerText.toLowerCase().includes(term) ? 'block' : 'none');
};
</script>
</body>
</html>
