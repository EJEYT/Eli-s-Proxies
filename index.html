<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eli's Proxies</title>
<link rel="icon" type="image/png" href="https://elis-proxies.odoo.com/web/image/website/1/logo/Eli%27s%20Proxies?unique=7b51271.png">

<style>
  :root {
    --bg-dark: #1e1e2e;
    --bg-sidebar: #181825;
    --bg-card: #313244;
    --text-main: #cdd6f4;
    --text-muted: #a6adc8;
    --accent: #89b4fa;
    --accent-hover: #b4befe;
    --red: #f38ba8;
    --green: #a6e3a1;
    --yellow: #f9e2af;
  }

  * { box-sizing: border-box; }

  body { 
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
    margin: 0; background-color: var(--bg-dark); color: var(--text-main);
    height: 100vh; overflow: hidden;
  }

  #selectionScreen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; width: 100%; padding: 20px; text-align: center;
    background: radial-gradient(circle at center, #24273a 0%, #1e1e2e 100%);
  }

  .blocker-grid {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; 
    width: 100%; max-width: 1000px; margin-top: 30px;
  }

  .blocker-card {
    background: var(--bg-card); border: 1px solid #45475a; padding: 25px;
    border-radius: 15px; cursor: pointer; transition: 0.3s; font-weight: bold;
    color: var(--text-main); font-size: 1.1rem; min-width: 160px; flex: 0 1 auto; text-align: center;
  }

  .blocker-card.all-card { border: 2px solid var(--accent); color: var(--accent); }
  .blocker-card:hover { transform: translateY(-5px); background: var(--accent); color: var(--bg-dark); box-shadow: 0 10px 20px rgba(137, 180, 250, 0.2); }

  .app-container { display: none; width: 100%; height: 100%; flex-direction: column; }
  main { flex: 1; display: flex; flex-direction: column; position: relative; background: var(--bg-dark); }

  .header {
    padding: 20px 40px; border-bottom: 1px solid #313244;
    display: flex; justify-content: space-between; align-items: center; background: var(--bg-sidebar);
  }

  .branding-area { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .branding-area h1 { margin: 0; font-size: 0.9rem; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
  .branding-area h2 { margin: 0; font-size: 1.8rem; color: white; line-height: 1.2; }
  
  .change-blocker-link {
    color: var(--text-muted); font-size: 0.8rem; text-decoration: underline; 
    cursor: pointer; margin-top: 5px; background: none; border: none; padding: 0;
  }

  .header-actions { display: flex; gap: 10px; }
  .btn-outline {
    background:none; border:2px solid var(--text-muted); color:var(--text-muted); 
    border-radius:25px; padding:8px 20px; cursor:pointer; font-weight:bold; transition: 0.2s;
  }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  
  #posts { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 25px; }

  .post-card {
    background-color: var(--bg-card); padding: 30px; border-radius: 16px;
    border-left: 6px solid var(--accent); position: relative;
    width: 100%; max-width: 900px; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    animation: fadeIn 0.4s ease-out;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

  .post-meta { display: flex; flex-direction: column; margin-bottom: 15px; }
  .meta-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
  .post-author { font-size: 0.9rem; color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
  .post-date { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }
  .post-unblocked-list { font-size: 0.75rem; color: var(--green); margin-top: 6px; font-weight: 600; font-family: monospace; }

  .post-content { white-space: pre-wrap; word-wrap: break-word; line-height: 1.6; font-size: 1.15rem; }

  /* Admin Panel Styling */
  #adminPanel {
    display: none; position: fixed; bottom: 30px; right: 30px;
    width: 480px; background-color: var(--bg-card); border: 1px solid #45475a;
    padding: 25px; border-radius: 20px; z-index: 100; box-shadow: 0 10px 50px rgba(0,0,0,0.6);
  }

  .admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #45475a; padding-bottom: 10px; }
  .tab-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-weight: bold; padding: 5px 15px; font-size: 0.9rem; }
  .tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

  #adminBlockerButtons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; background: var(--bg-dark); padding: 15px; border-radius: 12px; }
  .admin-pill { padding: 10px 5px; border-radius: 8px; background: #45475a; color: var(--text-muted); font-size: 0.75rem; font-weight: bold; cursor: pointer; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .admin-pill.selected { background: var(--accent); color: var(--bg-dark); }

  input, textarea { width: 100%; padding: 12px; background: var(--bg-dark); border: 1px solid #45475a; color: white; border-radius: 10px; margin-bottom: 12px; font-family: inherit; }

  /* Log Overlay */
  .log-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 3000; overflow-y: auto; padding: 50px 20px; }
  .log-container { max-width: 700px; margin: 0 auto; background: var(--bg-sidebar); border-radius: 20px; padding: 40px; border: 1px solid #45475a; position: relative; }
  .log-entry { border-bottom: 1px solid #313244; padding: 20px 0; }
  .log-entry h4 { color: var(--accent); margin: 0 0 10px 0; font-size: 1.3rem; }
  .log-entry p { margin: 0; color: var(--text-main); line-height: 1.5; }
  .log-entry .log-date { font-size: 0.8rem; color: var(--text-muted); margin-top: 10px; }

  #toast { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); padding: 15px 30px; border-radius: 10px; color: var(--bg-dark); font-weight: bold; z-index: 5000; display: none; }
</style>
</head>
<body>

<div id="toast"></div>

<div id="selectionScreen">
  <h1 style="color: white; font-size: 2.5rem; margin-bottom: 10px;">Eli's Proxies</h1>
  <p style="color: var(--text-muted); font-size: 1.2rem;">Select your school's blocker to view the feed.</p>
  <div class="blocker-grid" id="gridContainer"></div>
</div>

<div class="app-container" id="appContainer">
  <main>
    <div class="header">
      <div class="branding-area">
        <h1>Eli's Proxies</h1>
        <h2 id="currentBlocker">Feed</h2>
        <button class="change-blocker-link" id="changeBlockerBtn">← Switch Blocker</button>
      </div>
      <div class="header-actions">
        <button id="viewLogs" class="btn-outline">Update Log</button>
        <button id="refreshBtn" class="btn-outline">↻ Refresh</button>
        <button id="showAdmin" class="btn-outline">Admin Access</button>
      </div>
    </div>
    <div id="posts"></div>
  </main>
</div>

<div id="logOverlay" class="log-overlay">
  <div class="log-container">
    <button onclick="document.getElementById('logOverlay').style.display='none'" style="position:absolute; top:20px; right:20px; background:none; border:none; color:white; font-size:2rem; cursor:pointer;">&times;</button>
    <h2 style="margin-top:0; border-bottom: 2px solid var(--accent); padding-bottom:10px;">System Update Logs</h2>
    <div id="logList"></div>
  </div>
</div>

<div id="adminPanel">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <h3 style="margin:0; color:var(--accent);">Admin Dashboard</h3>
    <button id="closeAdmin" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:1.5rem;">&times;</button>
  </div>

  <div id="loginSection">
    <input type="password" id="adminPassword" placeholder="Password..."/>
    <button id="loginBtn" style="width:100%; padding:15px; background:var(--accent); border:none; border-radius:10px; font-weight:bold; cursor:pointer;">Login</button>
  </div>

  <div id="adminContent" style="display:none;">
    <div class="admin-tabs">
      <button class="tab-btn active" id="tabPostsBtn">Posts</button>
      <button class="tab-btn" id="tabLogsBtn">Log</button>
    </div>

    <div id="adminTabPosts">
      <input type="text" id="postAuthor" placeholder="Author Name">
      <textarea id="postText" rows="3" placeholder="Proxy/Message..."></textarea>
      <div id="adminBlockerButtons"></div>
      <button id="publishBtn" style="width:100%; padding:15px; background:var(--accent); border:none; border-radius:10px; font-weight:bold; cursor:pointer;">Broadcast Post</button>
    </div>

    <div id="adminTabLogs" style="display:none;">
      <input type="text" id="logHeading" placeholder="Update Heading (e.g. v2.1 Patch)">
      <textarea id="logBody" rows="5" placeholder="Log details..."></textarea>
      <button id="publishLogBtn" style="width:100%; padding:15px; background:var(--green); color:var(--bg-dark); border:none; border-radius:10px; font-weight:bold; cursor:pointer;">Post Update Log</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabaseUrl = 'https://saauhuiruadqjogzughm.supabase.co'
const supabaseKey = 'sb_publishable_u2yOKUXvz3qjRMOZt55-3Q_FGBN6b-F'
const supabase = createClient(supabaseUrl, supabaseKey)

const blockers = ["Linewize", "Securly", "Palo_alto", "Blocksi", "Aristotle", "Lightspeed", "Contentkeeper", "Lanschool", "Goguardian", "Fortiguard", "Cisco_talos", "Deledao"];
let selectedBlocker = localStorage.getItem('eli_selected_blocker');
let isAdmin = false;

// UI Setup
const grid = document.getElementById('gridContainer');
const adminPills = document.getElementById('adminBlockerButtons');

const allCard = document.createElement('div');
allCard.className = 'blocker-card all-card';
allCard.textContent = "All Blockers";
allCard.onclick = () => selectBlocker("All");
grid.appendChild(allCard);

blockers.forEach(b => {
  const card = document.createElement('div');
  card.className = 'blocker-card';
  card.textContent = b;
  card.onclick = () => selectBlocker(b);
  grid.appendChild(card);

  const pill = document.createElement('div');
  pill.className = 'admin-pill';
  pill.textContent = b;
  pill.dataset.value = b;
  pill.onclick = () => pill.classList.toggle('selected');
  adminPills.appendChild(pill);
});

function selectBlocker(name) {
  selectedBlocker = name;
  localStorage.setItem('eli_selected_blocker', name);
  showApp();
}

function showApp() {
  document.getElementById('selectionScreen').style.display = 'none';
  document.getElementById('appContainer').style.display = 'flex';
  document.getElementById('currentBlocker').textContent = selectedBlocker;
  fetchPosts();
}

// Data Fetching
async function fetchPosts() {
  const postsDiv = document.getElementById('posts');
  let query = supabase.from('posts').select('*');
  if (selectedBlocker !== "All") query = query.eq('blocker', selectedBlocker);
  
  const { data } = await query.order('created_at', { ascending: false });
  if (!data) return;

  const grouped = [];
  data.forEach(item => {
    const ex = grouped.find(g => g.content === item.content && g.author === item.author);
    if (ex) { if (!ex.blockers.includes(item.blocker)) ex.blockers.push(item.blocker); }
    else { grouped.push({ ...item, blockers: [item.blocker] }); }
  });

  postsDiv.innerHTML = grouped.map(p => {
    const formatted = p.blockers.map(b => b.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())).join(', ');
    const unblocked = (selectedBlocker === "All") ? `<div class="post-unblocked-list">Unblocked for: ${formatted}</div>` : '';
    return `<div class="post-card">
      <div class="post-meta"><div class="meta-top"><div class="post-author">By: ${p.author}</div><div class="post-date">${new Date(p.created_at).toLocaleDateString()}</div></div>${unblocked}</div>
      <div class="post-content">${p.content}</div>
    </div>`;
  }).join('');
}

async function fetchLogs() {
  const logList = document.getElementById('logList');
  const { data } = await supabase.from('logs').select('*').order('created_at', { ascending: false });
  if (!data) return;
  logList.innerHTML = data.map(l => `
    <div class="log-entry">
      <h4>${l.heading}</h4>
      <p>${l.body}</p>
      <div class="log-date">Released: ${new Date(l.created_at).toLocaleString()}</div>
    </div>
  `).join('');
}

// Admin Logic
document.getElementById('loginBtn').onclick = () => {
  if (document.getElementById('adminPassword').value === 'EISisBetterForever') {
    isAdmin = true;
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('adminContent').style.display = 'block';
  }
};
document.getElementById('adminPassword').onkeypress = (e) => { if(e.key==='Enter') document.getElementById('loginBtn').click(); };

// Tab Switching
document.getElementById('tabPostsBtn').onclick = () => {
  document.getElementById('adminTabPosts').style.display = 'block';
  document.getElementById('adminTabLogs').style.display = 'none';
  document.getElementById('tabPostsBtn').classList.add('active');
  document.getElementById('tabLogsBtn').classList.remove('active');
};
document.getElementById('tabLogsBtn').onclick = () => {
  document.getElementById('adminTabPosts').style.display = 'none';
  document.getElementById('adminTabLogs').style.display = 'block';
  document.getElementById('tabLogsBtn').classList.add('active');
  document.getElementById('tabPostsBtn').classList.remove('active');
};

// Publishing
document.getElementById('publishBtn').onclick = async () => {
  const text = document.getElementById('postText').value;
  const author = document.getElementById('postAuthor').value || 'Anonymous';
  const selected = document.querySelectorAll('.admin-pill.selected');
  for (const p of selected) {
    await supabase.from('posts').insert([{ blocker: p.dataset.value, content: text, author: author }]);
  }
  document.getElementById('postText').value = '';
  fetchPosts();
};

document.getElementById('publishLogBtn').onclick = async () => {
  const heading = document.getElementById('logHeading').value;
  const body = document.getElementById('logBody').value;
  if(!heading || !body) return;
  await supabase.from('logs').insert([{ heading, body }]);
  document.getElementById('logHeading').value = '';
  document.getElementById('logBody').value = '';
  alert('Update Log Published!');
};

// UI Toggles
document.getElementById('viewLogs').onclick = () => { document.getElementById('logOverlay').style.display='block'; fetchLogs(); };
document.getElementById('showAdmin').onclick = () => { document.getElementById('adminPanel').style.display='block'; document.getElementById('adminPassword').focus(); };
document.getElementById('closeAdmin').onclick = () => document.getElementById('adminPanel').style.display='none';
document.getElementById('changeBlockerBtn').onclick = () => { localStorage.removeItem('eli_selected_blocker'); location.reload(); };
document.getElementById('refreshBtn').onclick = () => fetchPosts();

if (selectedBlocker) showApp();
</script>
</body>
</html>
