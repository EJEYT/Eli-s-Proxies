<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eli's Proxies</title>
<link rel="icon" type="image/png" href="https://elis-proxies.odoo.com/web/image/website/1/logo/Eli%27s%20Proxies?unique=7b51271.png">

<style>
  :root {
    --bg-dark: #1e1e2e;
    --bg-sidebar: #181825;
    --bg-card: #313244;
    --text-main: #cdd6f4;
    --text-muted: #a6adc8;
    --accent: #89b4fa;
    --accent-hover: #b4befe;
    --red: #f38ba8;
    --green: #a6e3a1;
    --yellow: #f9e2af;
  }

  * { box-sizing: border-box; }

  body { 
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
    margin: 0; background-color: var(--bg-dark); color: var(--text-main);
    height: 100vh; overflow: hidden;
  }

  #selectionScreen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; width: 100%; padding: 20px; text-align: center;
    background: radial-gradient(circle at center, #24273a 0%, #1e1e2e 100%);
  }

  .blocker-grid {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; 
    width: 100%; max-width: 1000px; margin-top: 30px;
  }

  .blocker-card {
    background: var(--bg-card); border: 1px solid #45475a; padding: 25px;
    border-radius: 15px; cursor: pointer; transition: 0.3s; font-weight: bold;
    color: var(--text-main); font-size: 1.1rem; min-width: 160px; flex: 0 1 auto; text-align: center;
  }

  .blocker-card:hover {
    transform: translateY(-5px); background: var(--accent); color: var(--bg-dark);
    box-shadow: 0 10px 20px rgba(137, 180, 250, 0.2);
  }

  .app-container { display: none; width: 100%; height: 100%; flex-direction: column; }
  main { flex: 1; display: flex; flex-direction: column; position: relative; background: var(--bg-dark); }

  .header {
    padding: 20px 40px; border-bottom: 1px solid #313244;
    display: flex; justify-content: space-between; align-items: center; background: var(--bg-sidebar);
  }

  .branding-area { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .branding-area h1 { margin: 0; font-size: 0.9rem; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
  .branding-area h2 { margin: 0; font-size: 1.8rem; color: white; line-height: 1.2; }
  
  .change-blocker-link {
    color: var(--text-muted); font-size: 0.8rem; text-decoration: underline; 
    cursor: pointer; margin-top: 5px; background: none; border: none; padding: 0;
    width: fit-content; display: block;
  }

  .header-actions { display: flex; gap: 10px; }
  .btn-outline {
    background:none; border:2px solid var(--text-muted); color:var(--text-muted); 
    border-radius:25px; padding:8px 20px; cursor:pointer; font-weight:bold; transition: 0.2s;
  }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  
  #posts { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 25px; }

  .post-card {
    background-color: var(--bg-card); padding: 30px; border-radius: 16px;
    border-left: 6px solid var(--accent); position: relative;
    width: 100%; max-width: 900px; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    animation: fadeIn 0.4s ease-out;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

  .post-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-right: 10px; }
  .post-author { font-size: 0.9rem; color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
  .post-date { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }

  .post-content { white-space: pre-wrap; word-wrap: break-word; line-height: 1.6; font-size: 1.15rem; }
  .post-content a { color: var(--accent) !important; text-decoration: underline; }

  /* Adjusted Admin Actions position to avoid date overlap */
  .admin-actions { 
    position: absolute; 
    top: 50px; /* Moved down from 20px */
    right: 20px; 
    display: flex; 
    gap: 10px; 
    z-index: 5;
  }

  .action-btn {
    background: var(--bg-sidebar); border: 1px solid #45475a;
    width: 35px; height: 35px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 1rem; transition: 0.2s;
    color: var(--text-main);
  }
  .edit-btn:hover { border-color: var(--yellow); color: var(--yellow); background: #3e405a; }
  .delete-btn:hover { border-color: var(--red); color: var(--red); background: #3e405a; }

  #adminPanel {
    display: none; position: fixed; bottom: 30px; right: 30px;
    width: 440px; background-color: var(--bg-card); border: 1px solid #45475a;
    padding: 30px; border-radius: 20px; z-index: 100; box-shadow: 0 10px 50px rgba(0,0,0,0.6);
  }

  #toast {
    position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
    padding: 15px 30px; border-radius: 10px; color: var(--bg-dark); font-weight: bold; z-index: 1000; display: none;
  }

  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 2000;
  }

  .modal-box {
    background: var(--bg-card); padding: 30px; border-radius: 20px; width: 450px; 
    text-align: center; border: 1px solid #45475a; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  textarea.modal-input {
    width: 100%; background: var(--bg-dark); border: 1px solid #45475a; color: white;
    border-radius: 10px; padding: 15px; margin: 20px 0; font-family: inherit; font-size: 1rem; resize: vertical;
  }

  #adminBlockerButtons {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px;
    background: var(--bg-dark); padding: 15px; border-radius: 12px;
  }

  .admin-pill {
    padding: 8px 12px; border-radius: 8px; background: #45475a; color: var(--text-muted);
    font-size: 0.85rem; font-weight: bold; cursor: pointer; border: 1px solid transparent;
    transition: 0.2s; user-select: none; flex: 1 1 calc(33.33% - 8px); text-align: center;
  }

  .admin-pill.selected {
    background: var(--accent); color: var(--bg-dark); border-color: white;
  }

  .select-all-btn {
    width: 100%; margin-bottom: 10px; padding: 6px; background: transparent;
    border: 1px dashed var(--text-muted); color: var(--text-muted); border-radius: 8px;
    cursor: pointer; font-size: 0.8rem;
  }
</style>
</head>
<body>

<div id="toast"></div>

<div id="selectionScreen">
  <h1 style="color: white; font-size: 2.5rem; margin-bottom: 10px;">Eli's Proxies</h1>
  <p style="color: var(--text-muted); font-size: 1.2rem;">Select your school's blocker to view the feed.</p>
  <div class="blocker-grid" id="gridContainer"></div>
</div>

<div class="app-container" id="appContainer">
  <main>
    <div class="header">
      <div class="branding-area">
        <h1>Eli's Proxies</h1>
        <h2 id="currentBlocker">Feed</h2>
        <button class="change-blocker-link" id="changeBlockerBtn">← Switch Blocker</button>
      </div>
      <div class="header-actions">
        <button id="refreshBtn" class="btn-outline">↻ Refresh</button>
        <button id="showAdmin" class="btn-outline">Admin Access</button>
      </div>
    </div>
    <div id="posts"></div>
  </main>
</div>

<div id="confirmModal" class="modal-overlay">
  <div class="modal-box">
    <h2 style="margin-top:0">Delete Post?</h2>
    <p style="color: var(--text-muted)">This will wipe this message from ALL blockers.</p>
    <div style="display:flex; gap:15px; margin-top:30px;">
      <button id="cancelDel" style="flex:1; padding:12px; border-radius:10px; border:none; background:#45475a; color:white; cursor:pointer;">Cancel</button>
      <button id="confirmDel" style="flex:1; padding:12px; border-radius:10px; border:none; background:var(--red); color:var(--bg-dark); font-weight:bold; cursor:pointer;">Delete Everywhere</button>
    </div>
  </div>
</div>

<div id="editModal" class="modal-overlay">
  <div class="modal-box">
    <h2 style="margin-top:0; color: var(--yellow);">Edit Post</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem;">Changes will apply to all blockers this was sent to.</p>
    <textarea id="editPostText" rows="5" class="modal-input"></textarea>
    <div style="display:flex; gap:15px;">
      <button id="cancelEdit" style="flex:1; padding:12px; border-radius:10px; border:none; background:#45475a; color:white; cursor:pointer;">Cancel</button>
      <button id="confirmEdit" style="flex:1; padding:12px; border-radius:10px; border:none; background:var(--yellow); color:var(--bg-dark); font-weight:bold; cursor:pointer;">Update Everywhere</button>
    </div>
  </div>
</div>

<div id="adminPanel">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h3 style="margin:0; color:var(--accent);">Admin Panel</h3>
    <button id="closeAdmin" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:2rem;">&times;</button>
  </div>
  <div id="loginSection">
    <input type="password" id="adminPassword" style="width:100%; padding:15px; background:var(--bg-dark); border:1px solid #45475a; color:white; border-radius:10px; margin-bottom:15px;" placeholder="Password..."/>
    <button id="loginBtn" style="width:100%; padding:15px; background:var(--accent); border:none; border-radius:10px; font-weight:bold; cursor:pointer;">Login</button>
  </div>
  <div id="adminContent" style="display:none;">
    <input type="text" id="postAuthor" style="width:100%; padding:12px; background:var(--bg-dark); border:1px solid #45475a; color:white; border-radius:10px; margin-bottom:12px;" placeholder="Author Name">
    <textarea id="postText" rows="4" style="width:100%; padding:12px; background:var(--bg-dark); border:1px solid #45475a; color:white; border-radius:10px; margin-bottom:12px;" placeholder="Message..."></textarea>
    
    <label style="display:block; font-size:0.8rem; color:var(--text-muted); margin-bottom:8px;">Broadcast to:</label>
    <button class="select-all-btn" id="selectAllAdmin">Select All Blockers</button>
    <div id="adminBlockerButtons"></div>

    <button id="publishBtn" style="width:100%; padding:15px; background:var(--accent); border:none; border-radius:10px; font-weight:bold; cursor:pointer;">Broadcast Message</button>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabaseUrl = 'https://saauhuiruadqjogzughm.supabase.co'
const supabaseKey = 'sb_publishable_u2yOKUXvz3qjRMOZt55-3Q_FGBN6b-F'
const supabase = createClient(supabaseUrl, supabaseKey)

const blockers = ["Linewize", "Securly", "Palo_alto", "Blocksi", "Aristotle", "Lightspeed", "Contentkeeper", "Lanschool", "Goguardian", "Fortiguard", "Cisco_talos", "Deledao"];

let selectedBlocker = localStorage.getItem('eli_selected_blocker');
let isAdmin = false; 
let pendingActionId = null;
let originalContentToMatch = "";

const grid = document.getElementById('gridContainer');
const adminPillsContainer = document.getElementById('adminBlockerButtons');

blockers.forEach(b => {
  const card = document.createElement('div');
  card.className = 'blocker-card';
  card.textContent = b;
  card.onclick = () => selectBlocker(b);
  grid.appendChild(card);

  const pill = document.createElement('div');
  pill.className = 'admin-pill';
  pill.textContent = b;
  pill.dataset.value = b;
  pill.onclick = () => pill.classList.toggle('selected');
  adminPillsContainer.appendChild(pill);
});

function selectBlocker(name) {
  selectedBlocker = name;
  localStorage.setItem('eli_selected_blocker', name);
  document.getElementById('posts').innerHTML = '';
  showApp();
}

function showApp() {
  document.getElementById('selectionScreen').style.display = 'none';
  document.getElementById('appContainer').style.display = 'flex';
  document.getElementById('currentBlocker').textContent = selectedBlocker;
  if (isAdmin) {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('adminContent').style.display = 'block';
  }
  fetchPosts();
}

document.getElementById('changeBlockerBtn').onclick = () => {
  localStorage.removeItem('eli_selected_blocker');
  selectedBlocker = null;
  document.getElementById('appContainer').style.display = 'none';
  document.getElementById('selectionScreen').style.display = 'flex';
};

document.getElementById('selectAllAdmin').onclick = () => {
    const pills = document.querySelectorAll('.admin-pill');
    const allSelected = Array.from(pills).every(p => p.classList.contains('selected'));
    pills.forEach(p => allSelected ? p.classList.remove('selected') : p.classList.add('selected'));
};

async function fetchPosts() {
  if (!selectedBlocker) return;
  const postsDiv = document.getElementById('posts');
  if (postsDiv.innerHTML === '') {
      postsDiv.innerHTML = `<h3 style="color:var(--text-muted); margin-top: 50px; opacity:0.6;">Loading feed...</h3>`;
  }

  const { data, error } = await supabase.from('posts').select('*').eq('blocker', selectedBlocker).order('created_at', { ascending: false });
  if (error || !data || data.length === 0) {
    postsDiv.innerHTML = data?.length === 0 ? `<h3 style="color:var(--text-muted); margin-top: 50px;">No posts found for ${selectedBlocker}.</h3>` : `<h3 style="color:var(--red); margin-top: 50px;">Failed to load.</h3>`;
    return;
  }
  
  postsDiv.innerHTML = data.map(p => {
    const d = new Date(p.created_at);
    const dateStr = `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}`;
    return `
    <div class="post-card">
      <div class="post-meta">
        <div class="post-author">By: ${p.author || 'Anonymous'}</div>
        <div class="post-date">Posted on ${dateStr}</div>
      </div>
      <div class="post-content">${linkify(p.content)}</div>
      ${isAdmin ? `
        <div class="admin-actions">
          <button class="action-btn edit-btn" title="Edit" onclick="openEditModal(${p.id}, \`${p.content.replace(/`/g, '\\`')}\`)">✎</button>
          <button class="action-btn delete-btn" title="Delete" onclick="openDelModal(${p.id})">🗑</button>
        </div>
      ` : ''}
    </div>
  `}).join('');
}

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.backgroundColor = type === 'success' ? 'var(--green)' : 'var(--red)';
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

function linkify(text) {
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  return text.replace(urlRegex, url => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
}

document.getElementById('refreshBtn').onclick = () => { fetchPosts(); showToast('Feed updated'); };
document.getElementById('showAdmin').onclick = () => document.getElementById('adminPanel').style.display = 'block';
document.getElementById('closeAdmin').onclick = () => document.getElementById('adminPanel').style.display = 'none';

document.getElementById('loginBtn').onclick = () => {
  if (document.getElementById('adminPassword').value === 'EISisBetterForever') {
    isAdmin = true;
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('adminContent').style.display = 'block';
    showToast('Admin Access Granted');
    fetchPosts(); 
  } else { showToast('Invalid Password', 'error'); }
};

document.getElementById('publishBtn').onclick = async () => {
  const text = document.getElementById('postText').value;
  const author = document.getElementById('postAuthor').value.trim() || 'Anonymous';
  const selectedPills = document.querySelectorAll('.admin-pill.selected');
  if (!text.trim() || selectedPills.length === 0) return showToast('Add text and select at least one blocker!', 'error');
  for (const pill of selectedPills) {
    await supabase.from('posts').insert([{ blocker: pill.dataset.value, content: text, author: author }]);
  }
  document.getElementById('postText').value = '';
  document.querySelectorAll('.admin-pill').forEach(p => p.classList.remove('selected'));
  showToast('Broadcast Sent');
  fetchPosts();
};

window.openDelModal = (id) => {
  pendingActionId = id;
  document.getElementById('confirmModal').style.display = 'flex';
};

document.getElementById('cancelDel').onclick = () => document.getElementById('confirmModal').style.display = 'none';
document.getElementById('confirmDel').onclick = async () => {
  const { data: postToMatch } = await supabase.from('posts').select('content').eq('id', pendingActionId).single();
  if (postToMatch) {
    const { error } = await supabase.from('posts').delete().eq('content', postToMatch.content);
    document.getElementById('confirmModal').style.display = 'none';
    if (error) showToast('Delete failed', 'error');
    else { showToast('Message wiped globally'); fetchPosts(); }
  }
};

window.openEditModal = (id, content) => {
  pendingActionId = id;
  originalContentToMatch = content;
  document.getElementById('editPostText').value = content;
  document.getElementById('editModal').style.display = 'flex';
};

document.getElementById('cancelEdit').onclick = () => document.getElementById('editModal').style.display = 'none';
document.getElementById('confirmEdit').onclick = async () => {
  const newContent = document.getElementById('editPostText').value;
  if (!newContent.trim()) return showToast('Post cannot be empty', 'error');
  const { error } = await supabase.from('posts').update({ content: newContent }).eq('content', originalContentToMatch);
  document.getElementById('editModal').style.display = 'none';
  if (error) showToast('Update failed', 'error');
  else { showToast('Updated across all blockers'); fetchPosts(); }
};

if (selectedBlocker) showApp();
</script>
</body>
</html>
