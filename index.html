<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Eli's Proxies</title>
  <meta name="title" content="Eli's Proxies | Start your unblocking journey">
  <meta name="description" content="The ultimate destination for unblocked links and proxy feeds.">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://elis-proxies.com/"> 
  <meta property="og:title" content="Eli's Proxies | Start your unblocking journey">
  <meta property="og:description" content="Get the latest unblocked links for Linewize, Securly, GoGuardian, and more.">
  <meta property="og:image" content="https://elis-proxies.odoo.com/web/image/website/1/logo/Eli%27s%20Proxies?unique=7b51271.png">

  <link rel="icon" type="image/png" href="https://elis-proxies.odoo.com/web/image/website/1/logo/Eli%27s%20Proxies?unique=7b51271.png">

  <style>
    /* Default: Catppuccin Mocha */
    :root {
      --bg-dark: #1e1e2e;
      --bg-sidebar: #181825;
      --bg-card: #313244;
      --text-main: #cdd6f4;
      --text-muted: #a6adc8;
      --accent: #89b4fa;
      --accent-hover: #b4befe;
      --red: #f38ba8;
      --green: #a6e3a1;
      --overlay: rgba(0, 0, 0, 0.7);
      --yellow: #f9e2af;
      --border: #45475a;
    }

    [data-theme="dark"] {
      --bg-dark: #121212;
      --bg-sidebar: #1e1e1e;
      --bg-card: #242424;
      --text-main: #e0e0e0;
      --text-muted: #909090;
      --accent: #bb86fc;
      --border: #333333;
    }

    [data-theme="oled"] {
      --bg-dark: #000000;
      --bg-sidebar: #000000;
      --bg-card: #111111;
      --text-main: #ffffff;
      --text-muted: #888888;
      --accent: #ffffff;
      --border: #222222;
    }

    [data-theme="light"] {
      --bg-dark: #eff1f5;
      --bg-sidebar: #e6e9ef;
      --bg-card: #ffffff;
      --text-main: #4c4f69;
      --text-muted: #6c6f85;
      --accent: #1e66f5;
      --border: #ccd0da;
    }

    * { box-sizing: border-box; transition: background 0.3s, color 0.3s; }
    body { 
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
      margin: 0; 
      background: var(--bg-dark); 
      color: var(--text-main); 
      height: 100vh; 
      overflow: hidden; 
    }

    #announcementBanner {
      background: var(--accent);
      color: var(--bg-dark);
      padding: 8px;
      text-align: center;
      font-weight: bold;
      font-size: 0.9rem;
      display: none;
    }

    #toast {
      position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
      padding: 12px 25px; border-radius: 12px; color: #11111b; font-weight: bold;
      z-index: 12000; transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px;
      width: auto; max-width: 90%; text-align: center; pointer-events: none;
    }
    #toast.show { top: 20px; }

    .badge-new {
      background: var(--green);
      color: var(--bg-dark);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: bold;
      margin-left: 8px;
      text-transform: uppercase;
    }

    #confirmModal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--overlay); z-index: 10000; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .modal-content {
      background: var(--bg-card); padding: 25px; border-radius: 20px;
      width: 90%; max-width: 400px; border: 1px solid var(--border);
      text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-cancel { background: #45475a; color: white; }
    .btn-confirm { background: var(--red); color: white; }

    #selectionScreen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; background: radial-gradient(circle at center, var(--bg-sidebar) 0%, var(--bg-dark) 100%);
      overflow-y: auto; padding: 20px;
    }
    .blocker-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; width: 100%; max-width: 1000px; margin-top: 20px; }
    .blocker-card {
      background: var(--bg-card); border: 1px solid var(--border); padding: 20px;
      border-radius: 15px; cursor: pointer; transition: 0.3s; font-weight: bold;
      text-align: center; color: var(--text-main); display: flex; align-items: center; justify-content: center; min-height: 80px;
    }
    .blocker-card:hover { transform: translateY(-3px); background: var(--accent); color: var(--bg-dark); }
    
    .app-container { display: none; width: 100%; height: 100%; flex-direction: column; }
    .header { padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; background: var(--bg-sidebar); gap: 10px; z-index: 10; }
    .branding-area { display: flex; align-items: center; gap: 10px; }
    .branding-area h2 { margin: 0; font-size: 1.2rem; white-space: nowrap; }
    .search-bar { flex: 1; min-width: 150px; padding: 8px 15px; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 20px; color: var(--text-main); outline: none; }
    .header-actions { display: flex; gap: 5px; }
    .btn-outline { background:none; border:1px solid var(--text-muted); color:var(--text-muted); border-radius:20px; padding:6px 12px; cursor:pointer; font-weight:bold; transition: 0.2s; font-size: 0.85rem; white-space: nowrap; }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

    #posts { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .post-card { background: var(--bg-card); padding: 20px; border-radius: 16px; border-left: 5px solid var(--accent); width: 100%; max-width: 700px; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border-top: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .post-author { color: var(--accent); font-weight: 800; font-size: 0.95rem; }
    .post-unblocked-list { font-size: 0.7rem; color: var(--green); margin-top: 2px; font-weight: 600; font-family: monospace; }
    .post-content { white-space: pre-wrap; font-size: 1rem; margin-top: 10px; word-break: break-all; line-height: 1.4; }
    .post-content a { color: var(--accent); text-decoration: underline; }

    .panel { display: none; position: fixed; bottom: 20px; width: 400px; max-width: calc(100% - 40px); background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 20px; z-index: 11000; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
    #adminPanel { right: 20px; }
    #editPanel, #editLogPanel { left: 20px; border-left: 5px solid var(--accent); }

    .admin-input { width: 100%; padding: 10px; background: var(--bg-dark); border: 1px solid var(--border); color: white; border-radius: 8px; margin-bottom: 10px; outline: none; }
    .admin-primary-btn { width: 100%; padding: 12px; background: var(--accent); color: var(--bg-dark); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    .admin-tabs { display: flex; gap: 5px; margin-bottom: 15px; background: var(--bg-dark); padding: 4px; border-radius: 8px; overflow-x: auto; }
    .admin-tab { flex: 1; padding: 6px; text-align: center; cursor: pointer; border-radius: 6px; font-size: 0.7rem; color: var(--text-muted); white-space: nowrap; }
    .admin-tab.active { background: var(--bg-card); color: var(--accent); font-weight: bold; }
    .blocker-pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 10px; }
    .admin-pill { padding: 5px; border-radius: 6px; background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-muted); font-size: 0.65rem; cursor: pointer; text-align: center; }
    .admin-pill.selected { background: var(--accent); color: var(--bg-dark); }

    .log-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 6000; padding: 20px; }
    .log-container { max-width: 600px; margin: 0 auto; background: var(--bg-sidebar); border-radius: 20px; padding: 20px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); }

    .report-btn { color: var(--red); border: 1px solid var(--red); background: transparent; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.7rem; }
    .report-btn:hover { background: var(--red); color: white; }

    .report-item { background: var(--bg-dark); padding: 10px; border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--border); position: relative; }

    @media (max-width: 600px) {
      #adminPanel, #editPanel, #editLogPanel { bottom: 0; right: 0; left: 0; width: 100%; border-radius: 20px 20px 0 0; max-width: 100%; }
    }
    .small-action { background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); padding: 4px 8px; border-radius: 5px; cursor: pointer; font-size: 0.7rem; margin-left: 5px; }
    .copy-btn { background: var(--bg-dark); border: 1px solid var(--border); color: var(--accent); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.7rem; transition: 0.2s; }
    .copy-btn:hover { background: var(--accent); color: var(--bg-dark); }
  </style>
</head>
<body>

<div id="toast"></div>
<div id="announcementBanner"></div>

<div id="confirmModal">
  <div class="modal-content">
    <h3 style="margin-top:0">Action Needed</h3>
    <p id="confirmText" style="color:var(--text-muted); font-size: 0.9rem;"></p>
    <div class="modal-actions">
      <button class="modal-btn btn-cancel" id="confirmCancel">Go Back</button>
      <button class="modal-btn btn-confirm" id="confirmDelete">Confirm</button>
    </div>
  </div>
</div>

<div id="selectionScreen">
  <h1 style="color: var(--text-main); font-size: 2rem; margin-bottom: 5px;">Eli's Proxies</h1>
  <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem;">Select your filter</p>
  <div class="blocker-grid" id="gridContainer"></div>
  <div class="blocker-card" style="margin-top:20px; width:100%; max-width:300px; background: var(--accent); color: var(--bg-dark);" onclick="selectBlocker('All')">All Proxies</div>
  
  <div style="margin-top: 30px; display: flex; gap: 10px;">
    <button class="btn-outline" onclick="setTheme('catppuccin')">Mocha</button>
    <button class="btn-outline" onclick="setTheme('dark')">Dark</button>
    <button class="btn-outline" onclick="setTheme('oled')">OLED</button>
    <button class="btn-outline" onclick="setTheme('light')">Light</button>
  </div>
</div>

<div class="app-container" id="appContainer">
  <div class="header">
    <div class="branding-area">
      <button onclick="goBack()" class="btn-outline" style="padding: 4px 8px;">←</button>
      <h2 id="currentBlocker">Feed</h2>
    </div>
    <input type="text" id="searchInput" class="search-bar" placeholder="Search...">
    <div class="header-actions">
      <button id="refreshBtn" class="btn-outline">↻</button>
      <button id="viewLogs" class="btn-outline">Logs</button>
      <button id="showAdmin" class="btn-outline">Admin</button>
    </div>
  </div>
  <div id="posts"></div>
</div>

<div id="logOverlay" class="log-overlay">
  <div class="log-container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h2 style="margin:0">Update Logs</h2>
      <button onclick="document.getElementById('logOverlay').style.display='none'" class="btn-outline">Close</button>
    </div>
    <div id="logList"></div>
  </div>
</div>

<div id="editPanel" class="panel">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <h3 style="margin:0; color:var(--accent); font-size: 1.1rem;">Global Edit</h3>
    <button onclick="window.cancelEdit()" style="background:none; border:none; color:white; cursor:pointer; font-size:1.5rem;">&times;</button>
  </div>
  <input type="text" id="editAuthor" class="admin-input" placeholder="Author">
  <textarea id="editText" class="admin-input" rows="4" placeholder="Proxy link..."></textarea>
  <button id="updateBtn" class="admin-primary-btn">Apply Global Update</button>
</div>

<div id="adminPanel" class="panel">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <h3 style="margin:0; color:var(--accent); font-size: 1.1rem;">Admin Controls</h3>
    <button onclick="document.getElementById('adminPanel').style.display='none'" style="background:none; border:none; color:white; cursor:pointer; font-size:1.5rem;">&times;</button>
  </div>
  <div id="loginSection">
    <input type="password" id="adminPassword" class="admin-input" placeholder="Password">
    <button id="loginBtn" class="admin-primary-btn">Login</button>
  </div>
  <div id="adminContent" style="display:none;">
    <div class="admin-tabs">
      <div class="admin-tab active" id="tabPost" onclick="switchTab('post')">Proxy</div>
      <div class="admin-tab" id="tabLog" onclick="switchTab('log')">Log</div>
      <div class="admin-tab" id="tabBanner" onclick="switchTab('banner')">Banner</div>
      <div class="admin-tab" id="tabReport" onclick="switchTab('report')">Reports</div>
    </div>
    
    <div id="panePost">
      <input type="text" id="postAuthor" class="admin-input" placeholder="Author">
      <textarea id="postText" class="admin-input" rows="3" placeholder="Proxy link..."></textarea>
      <div id="adminBlockerButtons" class="blocker-pills"></div>
      <button id="publishBtn" class="admin-primary-btn">Publish</button>
    </div>

    <div id="paneLog" style="display:none;">
      <input type="text" id="logHeading" class="admin-input" placeholder="Title">
      <textarea id="logBody" class="admin-input" rows="4" placeholder="Update details..."></textarea>
      <button id="publishLogBtn" class="admin-primary-btn">Add Log</button>
    </div>

    <div id="paneBanner" style="display:none;">
      <textarea id="bannerTextInput" class="admin-input" rows="3" placeholder="Banner text..."></textarea>
      <input type="color" id="bannerColorInput" class="admin-input" style="height:40px">
      <button id="updateBannerBtn" class="admin-primary-btn">Update Banner</button>
    </div>

    <div id="paneReport" style="display:none;">
      <div id="reportList" style="max-height: 250px; overflow-y: auto;"></div>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
const supabase = createClient('https://saauhuiruadqjogzughm.supabase.co', 'sb_publishable_u2yOKUXvz3qjRMOZt55-3Q_FGBN6b-F');

const blockers = ["Linewize", "Securly", "Palo_alto", "Blocksi", "Aristotle", "Lightspeed", "Contentkeeper", "Lanschool", "Goguardian", "Fortiguard", "Cisco_talos", "Deledao"];
let selectedBlocker = localStorage.getItem('eli_selected_blocker');
let isAdmin = false; 
let currentEditingIds = [];
let idsToDelete = null;

// --- THEME ENGINE ---
window.setTheme = (theme) => {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('eli_theme', theme);
};
setTheme(localStorage.getItem('eli_theme') || 'catppuccin');

function showNotice(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = type === 'success' ? 'var(--green)' : 'var(--red)';
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
}

function linkify(text) {
  const urlPattern = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
  return text.replace(urlPattern, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

window.copyToClipboard = (text) => {
  const urlPattern = /https?:\/\/[^\s]+/g;
  const linksFound = text.match(urlPattern);
  if (linksFound) {
    navigator.clipboard.writeText(linksFound.join(' ')).then(() => showNotice("Link copied!"));
  } else showNotice("No URL found", "error");
};

// --- REPORT SYSTEM ---
window.reportLink = async (ids, content) => {
  const { error } = await supabase.from('reports').insert([{ 
    post_ids: ids, 
    content_preview: content.substring(0, 50) + "..." 
  }]);
  if (error) showNotice("Failed to report", "error");
  else showNotice("Link reported to Admin");
};

async function fetchReports() {
  const { data } = await supabase.from('reports').select('*').order('created_at', { ascending: false });
  const container = document.getElementById('reportList');
  if (!data || data.length === 0) { container.innerHTML = "<p style='text-align:center; font-size:0.8rem;'>No reports</p>"; return; }
  
  container.innerHTML = data.map(r => `
    <div class="report-item">
      <div style="font-size:0.7rem; color:var(--accent)">Reported: ${new Date(r.created_at).toLocaleDateString()}</div>
      <div style="font-size:0.8rem; margin:5px 0;">${r.content_preview}</div>
      <button class="small-action" style="color:var(--red)" onclick="window.clearReport('${r.id}')">Clear</button>
    </div>
  `).join('');
}

window.clearReport = async (id) => {
  await supabase.from('reports').delete().eq('id', id);
  fetchReports();
};

// --- CORE APP LOGIC ---
async function syncBanner() {
  const { data } = await supabase.from('settings').select('content, color').eq('id', 'announcement_banner').single();
  if (data) {
    const banner = document.getElementById('announcementBanner');
    banner.textContent = data.content;
    banner.style.background = data.color || 'var(--accent)';
    banner.style.display = data.content.trim() === "" ? 'none' : 'block';
  }
}

blockers.forEach(b => {
  const card = document.createElement('div');
  card.className = 'blocker-card'; card.textContent = b.replace(/_/g, ' ');
  card.onclick = () => selectBlocker(b);
  document.getElementById('gridContainer').appendChild(card);
  
  const pill = document.createElement('div');
  pill.className = 'admin-pill'; pill.textContent = b.replace(/_/g, ' ');
  pill.onclick = () => pill.classList.toggle('selected');
  pill.dataset.value = b;
  document.getElementById('adminBlockerButtons').appendChild(pill);
});

window.selectBlocker = (name) => {
  selectedBlocker = name;
  localStorage.setItem('eli_selected_blocker', name);
  document.getElementById('selectionScreen').style.display = 'none';
  document.getElementById('appContainer').style.display = 'flex';
  document.getElementById('currentBlocker').textContent = name === 'All' ? 'All Proxies' : name.replace(/_/g, ' ');
  syncBanner();
  fetchPosts();
};

window.goBack = () => {
  localStorage.removeItem('eli_selected_blocker');
  document.getElementById('selectionScreen').style.display = 'flex';
  document.getElementById('appContainer').style.display = 'none';
};

async function fetchPosts(isSilent = true) {
  let query = supabase.from('posts').select('*');
  if (selectedBlocker && selectedBlocker !== "All") query = query.eq('blocker', selectedBlocker);
  const { data } = await query.order('created_at', { ascending: false });
  if (!data) return;
  
  const grouped = [];
  data.forEach(item => {
    const existing = grouped.find(g => g.content === item.content && g.author === item.author);
    if (existing) { 
        if (!existing.blockers.includes(item.blocker)) existing.blockers.push(item.blocker);
        existing.ids.push(item.id); 
    }
    else { grouped.push({ ...item, ids: [item.id], blockers: [item.blocker] }); }
  });

  document.getElementById('posts').innerHTML = grouped.map(p => `
    <div class="post-card">
      <div style="display:flex; justify-content:space-between;">
        <span class="post-author">${p.author}</span>
        <span style="font-size:0.7rem; color:var(--text-muted)">${new Date(p.created_at).toLocaleDateString()}</span>
      </div>
      <div class="post-unblocked-list">Filter: ${p.blockers.join(', ')}</div>
      <div class="post-content">${linkify(p.content)}</div>
      <div style="margin-top:12px; display:flex; justify-content:space-between;">
        <div>
          <button class="copy-btn" onclick="window.copyToClipboard(\`${p.content}\`)">Copy</button>
          <button class="report-btn" onclick="window.reportLink('${p.ids.join(',')}', \`${p.content}\`)">Report</button>
        </div>
        ${isAdmin ? `<div>
          <button class="small-action" onclick="window.startEdit('${p.ids.join(',')}', \`${p.author}\`, \`${p.content}\`)">Edit</button>
          <button class="small-action" style="color:var(--red)" onclick="window.requestDelete('${p.ids.join(',')}')">Del</button>
        </div>` : ''}
      </div>
    </div>`).join('');
  if(!isSilent) showNotice("Refreshed");
}

window.switchTab = (tab) => {
  ['panePost', 'paneLog', 'paneBanner', 'paneReport'].forEach(p => document.getElementById(p).style.display = 'none');
  ['tabPost', 'tabLog', 'tabBanner', 'tabReport'].forEach(t => document.getElementById(t).classList.remove('active'));
  document.getElementById('pane' + tab.charAt(0).toUpperCase() + tab.slice(1)).style.display = 'block';
  document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
  if (tab === 'report') fetchReports();
};

const loginAction = () => {
  if (document.getElementById('adminPassword').value === 'EISisBetterForever') {
    isAdmin = true;
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('adminContent').style.display = 'block';
    showNotice("Admin Mode On"); fetchPosts();
  } else showNotice("Wrong Pass", "error");
};

document.getElementById('loginBtn').onclick = loginAction;
document.getElementById('adminPassword').onkeydown = (e) => { if (e.key === 'Enter') loginAction(); };

document.getElementById('publishBtn').onclick = async () => {
  const author = document.getElementById('postAuthor').value || 'Admin';
  const content = document.getElementById('postText').value;
  const pills = document.querySelectorAll('#adminPanel .admin-pill.selected');
  if (!content || pills.length === 0) return;
  for (let p of pills) await supabase.from('posts').insert([{ blocker: p.dataset.value, author, content }]);
  showNotice("Published!"); fetchPosts();
};

document.getElementById('updateBannerBtn').onclick = async () => {
  const content = document.getElementById('bannerTextInput').value;
  const color = document.getElementById('bannerColorInput').value;
  await supabase.from('settings').update({ content, color }).eq('id', 'announcement_banner');
  showNotice("Banner Updated!"); syncBanner();
};

window.startEdit = (ids, author, content) => {
  currentEditingIds = ids.split(',');
  document.getElementById('editPanel').style.display = 'block';
  document.getElementById('editAuthor').value = author;
  document.getElementById('editText').value = content;
};
window.cancelEdit = () => document.getElementById('editPanel').style.display = 'none';

document.getElementById('updateBtn').onclick = async () => {
  const author = document.getElementById('editAuthor').value;
  const content = document.getElementById('editText').value;
  for (let id of currentEditingIds) await supabase.from('posts').update({ author, content }).eq('id', id);
  showNotice("Updated"); cancelEdit(); fetchPosts();
};

window.requestDelete = (ids) => {
  idsToDelete = ids;
  document.getElementById('confirmText').textContent = "This will remove this proxy from all selected categories.";
  document.getElementById('confirmModal').style.display = 'flex';
};
document.getElementById('confirmDelete').onclick = async () => {
  for (let id of idsToDelete.split(',')) await supabase.from('posts').delete().eq('id', id);
  showNotice("Deleted"); document.getElementById('confirmModal').style.display = 'none'; fetchPosts();
};

document.getElementById('viewLogs').onclick = async () => {
  document.getElementById('logOverlay').style.display = 'block';
  const { data } = await supabase.from('logs').select('*').order('created_at', { ascending: false });
  document.getElementById('logList').innerHTML = data.map(l => `
    <div style="border-bottom:1px solid var(--border); padding:15px 0;">
      <strong style="color:var(--accent)">${l.heading}</strong>
      <p>${linkify(l.body)}</p>
    </div>`).join('');
};

document.getElementById('refreshBtn').onclick = () => fetchPosts(false);
document.getElementById('showAdmin').onclick = () => document.getElementById('adminPanel').style.display='block';
document.getElementById('searchInput').oninput = (e) => {
  const term = e.target.value.toLowerCase();
  document.querySelectorAll('.post-card').forEach(card => card.style.display = card.innerText.toLowerCase().includes(term) ? 'block' : 'none');
};

if (selectedBlocker) selectBlocker(selectedBlocker);
</script>
</body>
</html>
