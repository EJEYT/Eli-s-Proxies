<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Eli's Proxies</title>
  <meta name="title" content="Eli's Proxies | Start your unblocking journey">
  <meta name="description" content="The ultimate destination for unblocked links and proxy feeds.">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://elis-proxies.com/"> 
  <meta property="og:title" content="Eli's Proxies | Start your unblocking journey">
  <meta property="og:description" content="Get the latest unblocked links for Linewize, Securly, GoGuardian, and more.">
  <meta property="og:image" content="https://elis-proxies.odoo.com/web/image/website/1/logo/Eli%27s%20Proxies?unique=7b51271.png">

  <link rel="icon" type="image/png" href="https://elis-proxies.odoo.com/web/image/website/1/logo/Eli%27s%20Proxies?unique=7b51271.png">

  <style>
    /* Themes */
    :root { /* Original (Mocha) */
      --bg-dark: #1e1e2e; --bg-sidebar: #181825; --bg-card: #313244;
      --text-main: #cdd6f4; --text-muted: #a6adc8; --accent: #89b4fa;
      --red: #f38ba8; --green: #a6e3a1; --border: #45475a; --overlay: rgba(0,0,0,0.7);
    }
    [data-theme="dark"] {
      --bg-dark: #121212; --bg-sidebar: #1e1e1e; --bg-card: #242424;
      --text-main: #e0e0e0; --text-muted: #909090; --accent: #bb86fc; --border: #333333;
    }
    [data-theme="oled"] {
      --bg-dark: #000000; --bg-sidebar: #000000; --bg-card: #111111;
      --text-main: #ffffff; --text-muted: #888888; --accent: #ffffff; --border: #222222;
    }
    [data-theme="light"] {
      --bg-dark: #eff1f5; --bg-sidebar: #e6e9ef; --bg-card: #ffffff;
      --text-main: #4c4f69; --text-muted: #6c6f85; --accent: #1e66f5; --border: #ccd0da;
    }
    [data-theme="emerald"] {
      --bg-dark: #06120e; --bg-sidebar: #0a1a15; --bg-card: #122a22;
      --text-main: #ecfdf5; --text-muted: #6ee7b7; --accent: #10b981; --border: #065f46;
    }
    [data-theme="rose"] {
      --bg-dark: #1a1012; --bg-sidebar: #24181a; --bg-card: #3d2b2e;
      --text-main: #fff1f2; --text-muted: #fda4af; --accent: #f43f5e; --border: #9f1239;
    }

    * { box-sizing: border-box; transition: background 0.3s, color 0.3s; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; background: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; }

    #announcementBanner { background: var(--accent); color: var(--bg-dark); padding: 8px; text-align: center; font-weight: bold; font-size: 0.85rem; display: none; }

    /* Toast */
    #toast {
      position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
      padding: 12px 25px; border-radius: 12px; color: #11111b; font-weight: bold;
      z-index: 20000; transition: top 0.4s; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #toast.show { top: 20px; }

    /* Selection Screen */
    #selectionScreen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; background: radial-gradient(circle at center, var(--bg-sidebar) 0%, var(--bg-dark) 100%);
      overflow-y: auto; padding: 20px;
    }
    .blocker-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; width: 100%; max-width: 1000px; margin-top: 20px; }
    .blocker-card {
      background: var(--bg-card); border: 1px solid var(--border); padding: 20px;
      border-radius: 15px; cursor: pointer; transition: 0.3s; font-weight: bold;
      text-align: center; display: flex; align-items: center; justify-content: center; min-height: 80px;
    }
    .blocker-card:hover { transform: translateY(-3px); background: var(--accent); color: var(--bg-dark); }
    
    /* Main Layout */
    .app-container { display: none; width: 100%; height: 100%; flex-direction: column; }
    .header { padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--bg-sidebar); z-index: 10; }
    .search-bar { flex: 0.6; padding: 8px 15px; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 20px; color: var(--text-main); outline: none; margin: 0 15px; }
    
    #posts { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .post-card { background: var(--bg-card); padding: 20px; border-radius: 16px; border-left: 5px solid var(--accent); width: 100%; max-width: 700px; position: relative; border: 1px solid var(--border); border-left-width: 5px; }
    .post-author { color: var(--accent); font-weight: 800; font-size: 0.95rem; }
    .post-unblocked-list { font-size: 0.7rem; color: var(--green); margin-top: 2px; font-weight: 600; font-family: monospace; }
    .post-content { white-space: pre-wrap; font-size: 1rem; margin-top: 10px; word-break: break-all; line-height: 1.4; }

    /* Settings Menu */
    .settings-dropdown { position: relative; }
    .gear-icon { font-size: 1.4rem; cursor: pointer; color: var(--text-muted); padding: 5px; }
    .gear-icon:hover { color: var(--accent); }
    .settings-menu { 
        display: none; position: absolute; right: 0; top: 40px; 
        background: var(--bg-card); border: 1px solid var(--border); 
        border-radius: 12px; width: 180px; padding: 8px; z-index: 100;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .settings-menu.show { display: block; }
    .menu-item { padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: bold; color: var(--text-main); }
    .menu-item:hover { background: var(--bg-dark); color: var(--accent); }

    /* Modals & Panels */
    .panel { display: none; position: fixed; bottom: 20px; right: 20px; width: 400px; max-width: calc(100% - 40px); background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 20px; z-index: 15000; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
    .admin-input { width: 100%; padding: 10px; background: var(--bg-dark); border: 1px solid var(--border); color: white; border-radius: 8px; margin-bottom: 10px; outline: none; }
    .admin-primary-btn { width: 100%; padding: 12px; background: var(--accent); color: var(--bg-dark); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 5px; }
    
    .admin-tabs { display: flex; gap: 5px; margin-bottom: 15px; background: var(--bg-dark); padding: 4px; border-radius: 8px; overflow-x: auto; }
    .admin-tab { flex: 1; padding: 6px; text-align: center; cursor: pointer; border-radius: 6px; font-size: 0.7rem; color: var(--text-muted); white-space: nowrap; }
    .admin-tab.active { background: var(--bg-card); color: var(--accent); font-weight: bold; }
    
    .blocker-pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 10px; }
    .admin-pill { padding: 5px; border-radius: 6px; background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-muted); font-size: 0.65rem; cursor: pointer; text-align: center; }
    .admin-pill.selected { background: var(--accent); color: var(--bg-dark); }

    .report-item { background: var(--bg-dark); padding: 10px; border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--border); }
    .report-msg { font-size: 0.75rem; color: var(--yellow); font-style: italic; margin-top: 4px; border-top: 1px solid #45475a; padding-top: 4px;}

    .btn-outline { background:none; border:1px solid var(--text-muted); color:var(--text-muted); border-radius:20px; padding:6px 12px; cursor:pointer; font-weight:bold; font-size: 0.8rem; }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .copy-btn { background: var(--bg-dark); border: 1px solid var(--border); color: var(--accent); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.7rem; }
    .report-btn { color: var(--red); border: 1px solid var(--red); background: transparent; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.7rem; margin-left: 5px; }

    #confirmModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--overlay); z-index: 30000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
  </style>
</head>
<body>

<div id="toast"></div>
<div id="announcementBanner"></div>

<div id="confirmModal">
  <div class="modal-content" style="background:var(--bg-card); padding:25px; border-radius:20px; width:90%; max-width:400px; border:1px solid var(--border); text-align:center;">
    <h3 id="confirmTitle" style="margin-top:0">Report Link</h3>
    <div id="reportInputArea">
      <textarea id="reportMessage" class="admin-input" rows="3" placeholder="What's wrong with this link? (Optional)"></textarea>
    </div>
    <p id="confirmText" style="color:var(--text-muted); font-size: 0.85rem;"></p>
    <div style="display:flex; gap:10px; margin-top:20px;">
      <button class="admin-primary-btn" style="background:#45475a; color:white;" onclick="closeModal()">Cancel</button>
      <button id="confirmActionBtn" class="admin-primary-btn">Submit</button>
    </div>
  </div>
</div>

<div id="selectionScreen">
  <h1 style="color: var(--text-main); font-size: 2rem; margin-bottom: 5px;">Eli's Proxies</h1>
  <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem;">Select your filter</p>
  <div class="blocker-grid" id="gridContainer"></div>
  <div class="blocker-card" style="margin-top:20px; width:100%; max-width:300px; background: var(--accent); color: var(--bg-dark);" onclick="selectBlocker('All')">All Proxies</div>
  
  <div style="margin-top: 30px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;">
    <button class="btn-outline" onclick="setTheme('catppuccin')">Original</button>
    <button class="btn-outline" onclick="setTheme('dark')">Dark</button>
    <button class="btn-outline" onclick="setTheme('oled')">OLED</button>
    <button class="btn-outline" onclick="setTheme('light')">Light</button>
    <button class="btn-outline" onclick="setTheme('emerald')" style="border-color:#10b981; color:#10b981;">Emerald</button>
    <button class="btn-outline" onclick="setTheme('rose')" style="border-color:#f43f5e; color:#f43f5e;">Rose</button>
  </div>
</div>

<div class="app-container" id="appContainer">
  <div class="header">
    <div style="display:flex; align-items:center; gap:10px;">
      <button onclick="goBack()" class="btn-outline" style="padding: 4px 8px;">←</button>
      <h2 id="currentBlocker" style="font-size:1.1rem">Feed</h2>
    </div>
    <input type="text" id="searchInput" class="search-bar" placeholder="Search...">
    <div class="settings-dropdown">
      <div class="gear-icon" onclick="toggleSettings()">⚙</div>
      <div id="settingsMenu" class="settings-menu">
        <div class="menu-item" onclick="fetchPosts(false)">↻ Refresh Feed</div>
        <div class="menu-item" onclick="showLogs()">📜 View Logs</div>
        <div class="menu-item" onclick="document.getElementById('adminPanel').style.display='block'">🔑 Admin Panel</div>
      </div>
    </div>
  </div>
  <div id="posts"></div>
</div>

<div id="logOverlay" class="log-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:18000; padding:20px;">
  <div style="max-width:600px; margin:0 auto; background:var(--bg-sidebar); border-radius:20px; padding:20px; max-height:90vh; overflow-y:auto; border:1px solid var(--border);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h2 style="margin:0">Update Logs</h2>
      <button onclick="document.getElementById('logOverlay').style.display='none'" class="btn-outline">Close</button>
    </div>
    <div id="logList"></div>
  </div>
</div>

<div id="adminPanel" class="panel">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <h3 style="margin:0; color:var(--accent); font-size: 1.1rem;">Admin Controls</h3>
    <button onclick="document.getElementById('adminPanel').style.display='none'" style="background:none; border:none; color:white; cursor:pointer; font-size:1.5rem;">&times;</button>
  </div>
  <div id="loginSection">
    <input type="password" id="adminPassword" class="admin-input" placeholder="Password">
    <button id="loginBtn" class="admin-primary-btn">Login</button>
  </div>
  <div id="adminContent" style="display:none;">
    <div class="admin-tabs">
      <div class="admin-tab active" id="tabPost" onclick="switchTab('post')">Proxy</div>
      <div class="admin-tab" id="tabLog" onclick="switchTab('log')">Log</div>
      <div class="admin-tab" id="tabBanner" onclick="switchTab('banner')">Banner</div>
      <div class="admin-tab" id="tabReport" onclick="switchTab('report')">Reports</div>
    </div>
    
    <div id="panePost">
      <input type="text" id="postAuthor" class="admin-input" placeholder="Author">
      <textarea id="postText" class="admin-input" rows="3" placeholder="Proxy link..."></textarea>
      <div id="adminBlockerButtons" class="blocker-pills"></div>
      <button id="publishBtn" class="admin-primary-btn">Publish</button>
    </div>

    <div id="paneLog" style="display:none;">
      <input type="text" id="logHeading" class="admin-input" placeholder="Title">
      <textarea id="logBody" class="admin-input" rows="4" placeholder="Update details..."></textarea>
      <button id="publishLogBtn" class="admin-primary-btn">Add Log</button>
    </div>

    <div id="paneBanner" style="display:none;">
      <p style="font-size:0.7rem; color:var(--text-muted); margin-bottom:8px;">Banner content only (Color follows theme accent)</p>
      <textarea id="bannerTextInput" class="admin-input" rows="3" placeholder="Banner text..."></textarea>
      <button id="updateBannerBtn" class="admin-primary-btn">Update Banner</button>
    </div>

    <div id="paneReport" style="display:none;">
      <div id="reportList" style="max-height: 250px; overflow-y: auto;"></div>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
const supabase = createClient('https://saauhuiruadqjogzughm.supabase.co', 'sb_publishable_u2yOKUXvz3qjRMOZt55-3Q_FGBN6b-F');

const blockers = ["Linewize", "Securly", "Palo_alto", "Blocksi", "Aristotle", "Lightspeed", "Contentkeeper", "Lanschool", "Goguardian", "Fortiguard", "Cisco_talos", "Deledao"];
let selectedBlocker = localStorage.getItem('eli_selected_blocker');
let isAdmin = false; 

// UI Helpers
window.setTheme = (t) => { document.documentElement.setAttribute('data-theme', t); localStorage.setItem('eli_theme', t); };
setTheme(localStorage.getItem('eli_theme') || 'catppuccin');

window.toggleSettings = () => document.getElementById('settingsMenu').classList.toggle('show');
window.onclick = (e) => { if (!e.target.matches('.gear-icon')) document.getElementById('settingsMenu').classList.remove('show'); };

function showNotice(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = type === 'success' ? 'var(--green)' : 'var(--red)';
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
}

function linkify(text) {
  const urlPattern = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
  return text.replace(urlPattern, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

// Global Modal Control
window.closeModal = () => document.getElementById('confirmModal').style.display = 'none';

// --- REPORTING ---
window.openReportModal = (ids, content) => {
    document.getElementById('confirmTitle').textContent = "Report Link";
    document.getElementById('reportInputArea').style.display = 'block';
    document.getElementById('confirmText').textContent = "Help the admin know what's wrong.";
    document.getElementById('confirmModal').style.display = 'flex';
    document.getElementById('confirmActionBtn').onclick = async () => {
        const msg = document.getElementById('reportMessage').value;
        const { error } = await supabase.from('reports').insert([{ post_ids: ids, content_preview: content.substring(0, 40), message: msg }]);
        if (!error) showNotice("Reported!");
        document.getElementById('reportMessage').value = '';
        closeModal();
    };
};

async function fetchReports() {
  const { data } = await supabase.from('reports').select('*').order('created_at', { ascending: false });
  const container = document.getElementById('reportList');
  if (!data || data.length === 0) { container.innerHTML = "<p style='font-size:0.8rem; text-align:center;'>No reports</p>"; return; }
  container.innerHTML = data.map(r => `
    <div class="report-item">
      <div style="font-size:0.7rem; color:var(--accent)">${new Date(r.created_at).toLocaleDateString()}</div>
      <div style="font-size:0.8rem; margin:4px 0;">${r.content_preview}...</div>
      ${r.message ? `<div class="report-msg">" ${r.message} "</div>` : ''}
      <button class="admin-primary-btn" style="padding:4px; font-size:0.7rem; width:auto;" onclick="window.clearReport('${r.id}')">Clear</button>
    </div>
  `).join('');
}

window.clearReport = async (id) => { await supabase.from('reports').delete().eq('id', id); fetchReports(); };

// --- CORE ---
async function syncBanner() {
  const { data } = await supabase.from('settings').select('content').eq('id', 'announcement_banner').single();
  if (data) {
    const banner = document.getElementById('announcementBanner');
    banner.textContent = data.content;
    banner.style.display = data.content.trim() === "" ? 'none' : 'block';
    document.getElementById('bannerTextInput').value = data.content;
  }
}

blockers.forEach(b => {
  const card = document.createElement('div');
  card.className = 'blocker-card'; card.textContent = b.replace(/_/g, ' ');
  card.onclick = () => selectBlocker(b);
  document.getElementById('gridContainer').appendChild(card);
  
  const pill = document.createElement('div');
  pill.className = 'admin-pill'; pill.textContent = b.replace(/_/g, ' ');
  pill.onclick = () => pill.classList.toggle('selected');
  pill.dataset.value = b;
  document.getElementById('adminBlockerButtons').appendChild(pill);
});

window.selectBlocker = (name) => {
  selectedBlocker = name; localStorage.setItem('eli_selected_blocker', name);
  document.getElementById('selectionScreen').style.display = 'none';
  document.getElementById('appContainer').style.display = 'flex';
  document.getElementById('currentBlocker').textContent = name === 'All' ? 'All Proxies' : name.replace(/_/g, ' ');
  syncBanner(); fetchPosts();
};

window.goBack = () => { localStorage.removeItem('eli_selected_blocker'); location.reload(); };

async function fetchPosts(silent = true) {
  let query = supabase.from('posts').select('*');
  if (selectedBlocker && selectedBlocker !== "All") query = query.eq('blocker', selectedBlocker);
  const { data } = await query.order('created_at', { ascending: false });
  if (!data) return;
  
  const grouped = [];
  data.forEach(item => {
    const existing = grouped.find(g => g.content === item.content && g.author === item.author);
    if (existing) { existing.ids.push(item.id); if(!existing.blockers.includes(item.blocker)) existing.blockers.push(item.blocker); }
    else { grouped.push({ ...item, ids: [item.id], blockers: [item.blocker] }); }
  });

  document.getElementById('posts').innerHTML = grouped.map(p => `
    <div class="post-card">
      <div style="display:flex; justify-content:space-between;">
        <span class="post-author">${p.author}</span>
        <span style="font-size:0.7rem; color:var(--text-muted)">${new Date(p.created_at).toLocaleDateString()}</span>
      </div>
      <div class="post-unblocked-list">Filter: ${p.blockers.join(', ')}</div>
      <div class="post-content">${linkify(p.content)}</div>
      <div style="margin-top:12px; display:flex; justify-content:space-between;">
        <div>
          <button class="copy-btn" onclick="navigator.clipboard.writeText(\`${p.content}\`).then(()=>showNotice('Copied!'))">Copy</button>
          <button class="report-btn" onclick="window.openReportModal('${p.ids.join(',')}', \`${p.content}\`)">Report</button>
        </div>
        ${isAdmin ? `<button class="btn-outline" style="color:var(--red); border-color:var(--red);" onclick="window.deleteProxy('${p.ids.join(',')}')">Delete</button>` : ''}
      </div>
    </div>`).join('');
  if(!silent) showNotice("Refreshed");
}

window.deleteProxy = (ids) => {
    document.getElementById('confirmTitle').textContent = "Delete Proxy?";
    document.getElementById('reportInputArea').style.display = 'none';
    document.getElementById('confirmText').textContent = "This will delete this link from all categories.";
    document.getElementById('confirmModal').style.display = 'flex';
    document.getElementById('confirmActionBtn').onclick = async () => {
        for(let id of ids.split(',')) await supabase.from('posts').delete().eq('id', id);
        showNotice("Deleted"); closeModal(); fetchPosts();
    };
};

window.switchTab = (tab) => {
  ['panePost', 'paneLog', 'paneBanner', 'paneReport'].forEach(p => document.getElementById(p).style.display = 'none');
  ['tabPost', 'tabLog', 'tabBanner', 'tabReport'].forEach(t => document.getElementById(t).classList.remove('active'));
  document.getElementById('pane' + tab.charAt(0).toUpperCase() + tab.slice(1)).style.display = 'block';
  document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
  if (tab === 'report') fetchReports();
};

const loginAction = () => {
  if (document.getElementById('adminPassword').value === 'EISisBetterForever') {
    isAdmin = true;
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('adminContent').style.display = 'block';
    showNotice("Admin Authenticated"); fetchPosts();
  } else showNotice("Invalid Password", "error");
};
document.getElementById('loginBtn').onclick = loginAction;
document.getElementById('adminPassword').onkeydown = (e) => { if(e.key==='Enter') loginAction(); };

document.getElementById('publishBtn').onclick = async () => {
  const author = document.getElementById('postAuthor').value || 'Admin';
  const content = document.getElementById('postText').value;
  const pills = document.querySelectorAll('#adminPanel .admin-pill.selected');
  if(!content || pills.length === 0) return;
  for(let p of pills) await supabase.from('posts').insert([{ blocker: p.dataset.value, author, content }]);
  showNotice("Published!"); document.getElementById('postText').value = ''; fetchPosts();
};

document.getElementById('updateBannerBtn').onclick = async () => {
  await supabase.from('settings').update({ content: document.getElementById('bannerTextInput').value }).eq('id', 'announcement_banner');
  showNotice("Banner Updated"); syncBanner();
};

window.showLogs = async () => {
  document.getElementById('logOverlay').style.display = 'block';
  const { data } = await supabase.from('logs').select('*').order('created_at', { ascending: false });
  document.getElementById('logList').innerHTML = data.map(l => `
    <div style="border-bottom:1px solid var(--border); padding:15px 0;">
      <strong style="color:var(--accent)">${l.heading}</strong>
      <p style="font-size:0.9rem;">${linkify(l.body)}</p>
    </div>`).join('');
};

document.getElementById('searchInput').oninput = (e) => {
  const term = e.target.value.toLowerCase();
  document.querySelectorAll('.post-card').forEach(card => card.style.display = card.innerText.toLowerCase().includes(term) ? 'block' : 'none');
};

if (selectedBlocker) selectBlocker(selectedBlocker);
</script>
</body>
</html>
