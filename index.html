<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eli's Proxies</title>
<link rel="icon" type="image/png" href="https://elis-proxies.odoo.com/web/image/website/1/logo/Eli%27s%20Proxies?unique=7b51271.png">

<style>
  :root {
    --bg-dark: #1e1e2e;
    --bg-sidebar: #181825;
    --bg-card: #313244;
    --text-main: #cdd6f4;
    --text-muted: #a6adc8;
    --accent: #89b4fa;
    --red: #f38ba8;
    --green: #a6e3a1;
  }

  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; background: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; }

  #toast {
    position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
    padding: 12px 25px; border-radius: 12px; color: #11111b; font-weight: bold;
    z-index: 9999; transition: top 0.4s; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  #toast.show { top: 30px; }

  #selectionScreen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; background: radial-gradient(circle at center, #24273a 0%, #1e1e2e 100%);
  }

  .blocker-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; max-width: 1000px; margin-top: 30px; }
  .blocker-card {
    background: var(--bg-card); border: 1px solid #45475a; padding: 25px;
    border-radius: 15px; cursor: pointer; transition: 0.3s; font-weight: bold;
    min-width: 160px; text-align: center;
  }
  .blocker-card:hover { transform: translateY(-5px); background: var(--accent); color: var(--bg-dark); }
  
  .app-container { display: none; width: 100%; height: 100%; flex-direction: column; }
  main { flex: 1; display: flex; flex-direction: column; background: var(--bg-dark); overflow: hidden; }

  .header { padding: 15px 40px; border-bottom: 1px solid #313244; display: flex; justify-content: space-between; align-items: center; background: var(--bg-sidebar); }
  .btn-outline { background:none; border:2px solid var(--text-muted); color:var(--text-muted); border-radius:25px; padding:8px 18px; cursor:pointer; font-weight:bold; }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

  #posts { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .post-card { background: var(--bg-card); padding: 25px; border-radius: 16px; border-left: 6px solid var(--accent); width: 100%; max-width: 800px; }
  .post-author { color: var(--accent); font-weight: 800; font-size: 0.9rem; }
  .post-unblocked-list { font-size: 0.75rem; color: var(--green); margin-top: 5px; }
  .post-content { white-space: pre-wrap; line-height: 1.5; font-size: 1.1rem; margin-top: 10px; }
  .post-content a { color: var(--accent); }

  #adminPanel { display: none; position: fixed; bottom: 30px; right: 30px; width: 400px; background: var(--bg-card); border: 1px solid #45475a; padding: 25px; border-radius: 20px; z-index: 5000; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
  .admin-input { width: 100%; padding: 12px; background: var(--bg-dark); border: 1px solid #45475a; color: white; border-radius: 10px; margin-bottom: 10px; font-family: inherit; }
  .admin-primary-btn { width: 100%; padding: 12px; background: var(--accent); color: var(--bg-dark); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }

  .admin-pill { padding: 8px; border-radius: 8px; background: #1e1e2e; border: 1px solid #45475a; color: var(--text-muted); font-size: 0.7rem; cursor: pointer; text-align: center; }
  .admin-pill.selected { background: var(--accent); color: var(--bg-dark); }
  #adminBlockerButtons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 15px; }

  .small-action { background: #1e1e2e; border: 1px solid #45475a; color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.75rem; margin-left: 5px; }
</style>
</head>
<body>

<div id="toast"></div>

<div id="selectionScreen">
  <h1 style="color: white; font-size: 2rem;">Eli's Proxies</h1>
  <div class="blocker-grid" id="gridContainer"></div>
  <div style="margin-top:20px;"><button class="blocker-card" onclick="selectBlocker('All')">All Proxies</button></div>
</div>

<div class="app-container" id="appContainer">
  <main>
    <div class="header">
      <div>
        <h2 id="currentBlocker" style="margin:0">Feed</h2>
        <button onclick="goBack()" class="btn-outline" style="padding:4px 10px; font-size:0.7rem; margin-top:5px;">← Switch Blocker</button>
      </div>
      <div style="display:flex; gap:10px;">
        <button id="refreshBtn" class="btn-outline">↻</button>
        <button id="showAdmin" class="btn-outline">Admin</button>
      </div>
    </div>
    <div id="posts"></div>
  </main>
</div>

<div id="adminPanel">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <h3 style="margin:0; color:var(--accent);" id="adminTitle">Admin Panel</h3>
    <button id="closeAdmin" style="background:none; border:none; color:white; cursor:pointer; font-size:1.2rem;">&times;</button>
  </div>
  
  <div id="loginSection">
    <input type="password" id="adminPassword" class="admin-input" placeholder="Password">
    <button id="loginBtn" class="admin-primary-btn">Login</button>
  </div>

  <div id="adminContent" style="display:none;">
    <input type="text" id="postAuthor" class="admin-input" placeholder="Author">
    <textarea id="postText" class="admin-input" rows="3" placeholder="Content..."></textarea>
    <div id="adminBlockerButtons"></div>
    <button id="publishBtn" class="admin-primary-btn">Post Everywhere</button>
    <button id="cancelEditBtn" class="admin-primary-btn" style="display:none; background:#45475a; color:white; margin-top:8px;">Cancel Edit</button>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
const supabase = createClient('https://saauhuiruadqjogzughm.supabase.co', 'sb_publishable_u2yOKUXvz3qjRMOZt55-3Q_FGBN6b-F');

const blockers = ["Linewize", "Securly", "Palo_alto", "Blocksi", "Aristotle", "Lightspeed", "Contentkeeper", "Lanschool", "Goguardian", "Fortiguard", "Cisco_talos", "Deledao"];
let selectedBlocker = localStorage.getItem('eli_selected_blocker');
let isAdmin = (localStorage.getItem('eli_admin') === 'true');
let editingContentOriginal = "";

function showNotice(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = type === 'success' ? 'var(--green)' : 'var(--red)';
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
}

const grid = document.getElementById('gridContainer');
blockers.forEach(b => {
  const card = document.createElement('div'); card.className = 'blocker-card'; card.textContent = b.replace(/_/g, ' '); card.onclick = () => selectBlocker(b); grid.appendChild(card);
  const pill = document.createElement('div'); pill.className = 'admin-pill'; pill.textContent = b.replace(/_/g, ' '); pill.onclick = () => pill.classList.toggle('selected');
  pill.dataset.value = b; document.getElementById('adminBlockerButtons').appendChild(pill);
});

window.selectBlocker = (name) => {
  selectedBlocker = name; localStorage.setItem('eli_selected_blocker', name);
  document.getElementById('selectionScreen').style.display = 'none';
  document.getElementById('appContainer').style.display = 'flex';
  document.getElementById('currentBlocker').textContent = name === 'All' ? 'All Proxies' : name.replace(/_/g, ' ');
  if(isAdmin) checkAdminStatus();
  fetchPosts();
};

window.goBack = () => {
    localStorage.removeItem('eli_selected_blocker');
    location.reload();
};

async function fetchPosts() {
  const { data } = await supabase.from('posts').select('*').order('created_at', { ascending: false });
  if (!data) return;
  const filtered = (selectedBlocker && selectedBlocker !== "All") ? data.filter(i => i.blocker === selectedBlocker) : data;
  const grouped = [];
  filtered.forEach(item => {
    const ex = grouped.find(g => g.content === item.content && g.author === item.author);
    if (ex) { if (!ex.blockers.includes(item.blocker)) ex.blockers.push(item.blocker); }
    else { grouped.push({ ...item, blockers: [item.blocker] }); }
  });
  renderPosts(grouped);
}

function renderPosts(posts) {
  const postsDiv = document.getElementById('posts');
  postsDiv.innerHTML = posts.map(p => {
    const list = p.blockers.map(b => b.replace(/_/g, ' ')).join(', ');
    const label = (selectedBlocker === "All") ? `<div class="post-unblocked-list">Works on: ${list}</div>` : '';
    const controls = isAdmin ? `<div style="margin-top:10px; text-align:right;">
      <button class="small-action" onclick="triggerEdit('${p.author.replace(/'/g, "\\'")}', '${p.content.replace(/'/g, "\\'")}')">Edit</button>
      <button class="small-action" style="color:var(--red)" onclick="deleteGlobal('${p.content.replace(/'/g, "\\'")}')">Delete</button>
    </div>` : '';
    return `<div class="post-card">
      <div class="post-author">By ${p.author}</div>
      ${label}
      <div class="post-content">${p.content}</div>
      ${controls}
    </div>`;
  }).join('');
}

// Ensure Admin UI stays visible after switching blockers
function checkAdminStatus() {
    if(isAdmin) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
    }
}

window.triggerEdit = (author, content) => {
  editingContentOriginal = content;
  document.getElementById('adminPanel').style.display = 'block';
  document.getElementById('postAuthor').value = author;
  document.getElementById('postText').value = content;
  document.getElementById('publishBtn').textContent = "Update Everywhere";
  document.getElementById('cancelEditBtn').style.display = "block";
  document.getElementById('adminTitle').textContent = "Editing Mode";
};

document.getElementById('cancelEditBtn').onclick = () => {
  editingContentOriginal = "";
  document.getElementById('postAuthor').value = ''; document.getElementById('postText').value = '';
  document.getElementById('publishBtn').textContent = "Post Everywhere";
  document.getElementById('cancelEditBtn').style.display = "none";
  document.getElementById('adminTitle').textContent = "Admin Panel";
};

document.getElementById('publishBtn').onclick = async () => {
  const author = document.getElementById('postAuthor').value || 'Admin';
  const content = document.getElementById('postText').value;
  if (!content) return;

  if (editingContentOriginal) {
    await supabase.from('posts').update({ author, content }).eq('content', editingContentOriginal);
    showNotice("Updated Successfully");
    document.getElementById('cancelEditBtn').click();
  } else {
    const pills = document.querySelectorAll('.admin-pill.selected');
    for (const p of pills) await supabase.from('posts').insert([{ blocker: p.dataset.value, author, content }]);
    showNotice("Posted Successfully");
  }
  fetchPosts();
};

window.deleteGlobal = async (content) => {
  if(confirm("Delete everywhere?")) {
    await supabase.from('posts').delete().eq('content', content);
    showNotice("Deleted Everywhere"); fetchPosts();
  }
};

document.getElementById('loginBtn').onclick = () => {
  if (document.getElementById('adminPassword').value === 'EISisBetterForever') {
    isAdmin = true;
    localStorage.setItem('eli_admin', 'true');
    checkAdminStatus();
    showNotice("Logged In");
    fetchPosts();
  } else showNotice("Wrong Pass", "error");
};

// Enter key for login
document.getElementById('adminPassword').addEventListener('keypress', (e) => {
    if(e.key === 'Enter') document.getElementById('loginBtn').click();
});

document.getElementById('showAdmin').onclick = () => document.getElementById('adminPanel').style.display='block';
document.getElementById('closeAdmin').onclick = () => document.getElementById('adminPanel').style.display='none';
document.getElementById('refreshBtn').onclick = () => fetchPosts();

if (selectedBlocker) selectBlocker(selectedBlocker);
</script>
</body>
</html>
